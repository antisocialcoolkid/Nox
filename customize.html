<!-- =========================
     NØX PROFILE LINK
========================= -->

<div
    style="
        margin-top:18px;
        padding-top:18px;
        border-top:1px solid #181818;
    "
>

    <button
        id="generateProfileLink"
        type="button"
        style="
            width:100%;
            height:48px;
            border:1px solid #292929;
            border-radius:10px;
            background:#080808;
            color:#fff;
            cursor:pointer;
            font-weight:800;
            font-size:11px;
        "
    >
        🔗 GENERATE PROFILE LINK
    </button>


    <div
        id="profileLinkArea"
        style="
            display:none;
            margin-top:10px;
        "
    >

        <input
            id="profileLink"
            type="text"
            readonly
            style="
                width:100%;
                height:46px;
                background:#070707;
                color:#aaa;
                border:1px solid #292929;
                border-radius:10px;
                padding:12px;
                outline:none;
            "
        >


        <button
            id="copyProfileLink"
            type="button"
            style="
                width:100%;
                height:46px;
                margin-top:8px;
                border:1px solid #292929;
                border-radius:10px;
                background:#111;
                color:#fff;
                cursor:pointer;
                font-weight:800;
                font-size:11px;
            "
        >
            📋 COPY LINK
        </button>


        <button
            id="viewProfile"
            type="button"
            style="
                width:100%;
                height:46px;
                margin-top:8px;
                border:1px solid #292929;
                border-radius:10px;
                background:#111;
                color:#fff;
                cursor:pointer;
                font-weight:800;
                font-size:11px;
            "
        >
            👁 VIEW PROFILE
        </button>

    </div>

</div>


<script>

/* =========================
   GENERATE PROFILE LINK
========================= */

const generateProfileLink =
    document.getElementById(
        "generateProfileLink"
    );

const profileLinkArea =
    document.getElementById(
        "profileLinkArea"
    );

const profileLink =
    document.getElementById(
        "profileLink"
    );

const copyProfileLink =
    document.getElementById(
        "copyProfileLink"
    );

const viewProfile =
    document.getElementById(
        "viewProfile"
    );


if(generateProfileLink){

    generateProfileLink.addEventListener(
        "click",
        function(){

            const usernameElement =
                document.getElementById(
                    "username"
                );

            if(!usernameElement){

                alert(
                    "No se encontró el campo USERNAME."
                );

                return;
            }


            const username =
                usernameElement.value
                .trim()
                .toLowerCase();


            if(!username){

                alert(
                    "Primero escribe tu username."
                );

                return;
            }


            /*
             * Perfil público:
             *
             * profile.html?username=nox
             */

            const link =
                window.location.origin +
                window.location.pathname
                    .replace(
                        "customize.html",
                        "profile.html"
                    ) +
                "?username=" +
                encodeURIComponent(
                    username
                );


            profileLink.value =
                link;


            profileLinkArea.style.display =
                "block";

        }
    );

}


/* =========================
   COPY LINK
========================= */

if(copyProfileLink){

    copyProfileLink.addEventListener(
        "click",
        async function(){

            const link =
                profileLink.value;


            if(!link){
                return;
            }


            try{

                await navigator
                    .clipboard
                    .writeText(
                        link
                    );

            }catch(error){

                profileLink
                    .focus();

                profileLink
                    .select();

                document.execCommand(
                    "copy"
                );
            }


            copyProfileLink.textContent =
                "✓ COPIED";


            setTimeout(
                function(){

                    copyProfileLink.textContent =
                        "📋 COPY LINK";

                },
                1500
            );

        }
    );

}


/* =========================
   VIEW PROFILE
========================= */

if(viewProfile){

    viewProfile.addEventListener(
        "click",
        function(){

            const usernameElement =
                document.getElementById(
                    "username"
                );


            if(!usernameElement){
                return;
            }


            const username =
                usernameElement.value
                .trim()
                .toLowerCase();


            if(!username){

                alert(
                    "Primero escribe tu username."
                );

                return;
            }


            const url =
                window.location.origin +
                window.location.pathname
                    .replace(
                        "customize.html",
                        "profile.html"
                    ) +
                "?username=" +
                encodeURIComponent(
                    username
                );


            window.location.href =
                url;

        }
    );

}

</script>
