<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØX Test</title>
</head>

<body style="background:#050505;color:white;font-family:Arial;text-align:center;padding:50px">

<h1>NØX CUSTOMIZE TEST</h1>

<p id="status">Cargando JavaScript...</p>

<button id="save"
style="padding:15px 30px;font-weight:bold;cursor:pointer">
SAVE CHANGES
</button>

<script>
window.addEventListener("load", function () {

    document.getElementById("status").textContent =
        "✓ JAVASCRIPT FUNCIONANDO";

    document.getElementById("save").addEventListener("click", function () {

        document.getElementById("status").textContent =
            "✓ SAVE CHANGES FUNCIONA";

        alert("NØX: el botón funciona correctamente.");

    });

});
</script>

</body>
</html>
