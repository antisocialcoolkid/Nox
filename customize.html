<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://qvqhanioapefeyxtbzlp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_hJVj2VGj2hEXUgc91QY1Q_zGjw9qp1".replace(
        "hJVj2VGj2hEXUgc91QY1Q_zGjw9qp1",
        "hJVj-2VGj2hEXUgc91QY1Q_zGjw9qp1"
    );

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let currentUser = null;
let currentProfile = null;

const $ = id =>
    document.getElementById(id);


/* =========================
   MESSAGE
========================= */

function showMessage(text, type = "") {

    const message = $("message");

    if (!message) return;

    message.textContent = text;
    message.className =
        "message " + type;
}


/* =========================
   URL
========================= */

function normalizeUrl(value) {

    if (!value) return "";

    if (
        value.startsWith("https://") ||
        value.startsWith("http://")
    ) {
        return value;
    }

    return "https://" + value;
}


/* =========================
   PREVIEW
========================= */

function updatePreview() {

    const username =
        $("username").value.trim();

    const name =
        $("displayName").value.trim();

    const bio =
        $("bio").value.trim();

    const website =
        $("website").value.trim();

    const color =
        $("accentColor").value;


    $("previewUsername").textContent =
        "@" + (username || "nox");

    $("previewName").textContent =
        name || "NØX";

    $("previewBio").textContent =
        bio ||
        "This is my NØX profile.";

    $("colorValue").textContent =
        color.toUpperCase();

    document.documentElement.style
        .setProperty(
            "--accent",
            color
        );


    if (website) {

        $("websitePreview").style.display =
            "inline";

        $("websitePreview").href =
            normalizeUrl(website);

        $("websitePreview").textContent =
            website;

    } else {

        $("websitePreview").style.display =
            "none";

    }


    updateSocial(
        "discord",
        "discordPreview"
    );

    updateSocial(
        "instagram",
        "instagramPreview"
    );

    updateSocial(
        "tiktok",
        "tiktokPreview"
    );

    updateSocial(
        "youtube",
        "youtubePreview"
    );

    updateSocial(
        "github",
        "githubPreview"
    );

    updateSocial(
        "twitter",
        "twitterPreview"
    );
}


/* =========================
   SOCIALS
========================= */

function updateSocial(inputId, outputId) {

    const value =
        $(inputId).value.trim();

    const element =
        $(outputId);

    if (!value) {

        element.style.display =
            "none";

        return;
    }

    element.style.display =
        "inline-block";

    element.href =
        normalizeUrl(value);
}


/* =========================
   PROFILE LINK
========================= */

function generateProfileLink() {

    const username =
        $("username").value.trim();

    if (!username) {

        $("profileLinkBox").style.display =
            "none";

        return;
    }

    const link =
        window.location.origin +
        "/" +
        encodeURIComponent(username);

    $("profileLink").value =
        link;

    $("profileLinkBox").style.display =
        "block";
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

    try {

        const result =
            await supabaseClient
            .auth
            .getUser();

        if (result.error)
            throw result.error;

        if (!result.data.user) {

            showMessage(
                "No hay una sesión iniciada.",
                "error"
            );

            return;
        }

        currentUser =
            result.data.user;


        const profile =
            await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if (profile.error)
            throw profile.error;


        if (!profile.data) {

            showMessage(
                "No existe tu perfil.",
                "error"
            );

            return;
        }


        currentProfile =
            profile.data;


        $("username").value =
            currentProfile.username || "";

        $("displayName").value =
            currentProfile.display_name ||
            "NØX";

        $("bio").value =
            currentProfile.bio ||
            "This is my NØX profile.";

        $("website").value =
            currentProfile.website_url ||
            "";

        $("accentColor").value =
            currentProfile.accent_color ||
            "#ffffff";

        $("profileEffect").value =
            currentProfile.profile_effect ||
            "none";


        if (currentProfile.avatar_url) {

            $("avatar").src =
                currentProfile.avatar_url;
        }


        if (currentProfile.banner_url) {

            $("banner").style.backgroundImage =
                `url("${currentProfile.banner_url}")`;
        }


        if (currentProfile.background_url) {

            $("preview").style.backgroundImage =
                `url("${currentProfile.background_url}")`;
        }


        const socials =
            currentProfile.social_links || {};


        $("discord").value =
            socials.discord || "";

        $("instagram").value =
            socials.instagram || "";

        $("tiktok").value =
            socials.tiktok || "";

        $("youtube").value =
            socials.youtube || "";

        $("github").value =
            socials.github || "";

        $("twitter").value =
            socials.twitter || "";


        updatePreview();

        generateProfileLink();


    } catch (error) {

        console.error(
            "NØX LOAD ERROR:",
            error
        );

        showMessage(
            "⚠️ " + error.message,
            "error"
        );
    }
}


/* =========================
   UPLOAD
========================= */

async function uploadFile(file, folder) {

    if (!file)
        return null;


    if (!file.type.startsWith("image/")) {

        throw new Error(
            "El archivo debe ser una imagen."
        );
    }


    if (file.size > 10 * 1024 * 1024) {

        throw new Error(
            "La imagen supera los 10 MB."
        );
    }


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const path =
        currentUser.id +
        "/" +
        folder +
        "/" +
        crypto.randomUUID() +
        "." +
        extension;


    const upload =
        await supabaseClient
        .storage
        .from("profiles")
        .upload(
            path,
            file
        );


    if (upload.error)
        throw upload.error;


    const publicUrl =
        supabaseClient
        .storage
        .from("profiles")
        .getPublicUrl(path);


    return publicUrl.data.publicUrl;
}


/* =========================
   SAVE CHANGES
========================= */

$("save").addEventListener(
    "click",
    async function () {

        try {

            if (!currentUser) {

                throw new Error(
                    "No hay una sesión iniciada."
                );
            }


            const button = $("save");

            button.disabled = true;
            button.textContent = "SAVING...";

            showMessage(
                "Guardando..."
            );


            let avatarUrl =
                currentProfile.avatar_url ||
                null;

            let bannerUrl =
                currentProfile.banner_url ||
                null;

            let backgroundUrl =
                currentProfile.background_url ||
                null;


            const avatarFile =
                $("avatarFile").files[0];

            const bannerFile =
                $("bannerFile").files[0];

            const backgroundFile =
                $("backgroundFile").files[0];


            if (avatarFile) {

                showMessage(
                    "Subiendo avatar..."
                );

                avatarUrl =
                    await uploadFile(
                        avatarFile,
                        "avatars"
                    );
            }


            if (bannerFile) {

                showMessage(
                    "Subiendo banner..."
                );

                bannerUrl =
                    await uploadFile(
                        bannerFile,
                        "banners"
                    );
            }


            if (backgroundFile) {

                showMessage(
                    "Subiendo fondo..."
                );

                backgroundUrl =
                    await uploadFile(
                        backgroundFile,
                        "backgrounds"
                    );
            }


            const socialLinks = {

                discord:
                    $("discord").value.trim(),

                instagram:
                    $("instagram").value.trim(),

                tiktok:
                    $("tiktok").value.trim(),

                youtube:
                    $("youtube").value.trim(),

                github:
                    $("github").value.trim(),

                twitter:
                    $("twitter").value.trim()
            };


            const updateData = {

                display_name:
                    $("displayName")
                    .value
                    .trim(),

                bio:
                    $("bio")
                    .value
                    .trim(),

                website_url:
                    $("website")
                    .value
                    .trim(),

                avatar_url:
                    avatarUrl,

                banner_url:
                    bannerUrl,

                background_url:
                    backgroundUrl,

                accent_color:
                    $("accentColor")
                    .value,

                profile_effect:
                    $("profileEffect")
                    .value,

                social_links:
                    socialLinks
            };


            const update =
                await supabaseClient
                .from("profiles")
                .update(updateData)
                .eq(
                    "id",
                    currentUser.id
                );


            if (update.error)
                throw update.error;


            currentProfile = {
                ...currentProfile,
                ...updateData
            };


            $("avatarFile").value = "";
            $("bannerFile").value = "";
            $("backgroundFile").value = "";


            generateProfileLink();


            showMessage(
                "✓ Cambios guardados correctamente.",
                "success"
            );


            button.disabled = false;
            button.textContent =
                "SAVE CHANGES";


        } catch (error) {

            console.error(
                "NØX SAVE ERROR:",
                error
            );


            showMessage(
                "⚠️ " + error.message,
                "error"
            );


            $("save").disabled =
                false;

            $("save").textContent =
                "SAVE CHANGES";
        }
    }
);


/* =========================
   COPY PROFILE LINK
========================= */

$("copyLink").addEventListener(
    "click",
    async function () {

        const link =
            $("profileLink").value;

        try {

            await navigator
                .clipboard
                .writeText(link);

            this.textContent =
                "COPIED ✓";

            setTimeout(
                () => {
                    this.textContent =
                        "COPY";
                },
                1500
            );

        } catch {

            $("profileLink").select();

            document.execCommand(
                "copy"
            );
        }
    }
);


/* =========================
   VIEW PROFILE
========================= */

$("viewProfile").addEventListener(
    "click",
    function () {

        const username =
            $("username").value.trim();

        if (!username)
            return;


        window.location.href =
            window.location.origin +
            "/" +
            encodeURIComponent(
                username
            );
    }
);


/* =========================
   LIVE PREVIEW
========================= */

[

    "displayName",
    "bio",
    "website",
    "discord",
    "instagram",

    "youtube",
    "github",

/* =========================

========================= */

        this.value =

            .toLowerCase()
            .replace(
                /[^a-z0-9_]/g,

            );

        generateProfileLink();

);

$("backgroundFile").addEventListener(

   START

loadProfile();

                </script>
