<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Customize</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ffffff;
    --bg:#050505;
    --panel:#0c0c0c;
    --border:#252525;
    --muted:#777;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        #050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:20px;
}

button,
input,
textarea,
select{
    font:inherit;
}

.container{
    width:min(1150px,100%);
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.title{
    font-size:30px;
    font-weight:800;
    letter-spacing:-1.5px;
}

.subtitle{
    margin-top:5px;
    color:#666;
    font-size:12px;
}

.back{
    color:#777;
    text-decoration:none;
    font-size:11px;
}

.back:hover{
    color:#fff;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 410px;
    gap:20px;
}

.editor,
.preview{
    border:1px solid var(--border);
    border-radius:22px;
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(20px);
}

.editor{
    padding:25px;
}

.preview{
    overflow:hidden;
    position:sticky;
    top:20px;
    height:max-content;
}

.section{
    margin-bottom:28px;
}

.section-title{
    color:#666;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:15px;
}

.field{
    margin-bottom:17px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #252525;
    border-radius:11px;
    background:#070707;
    color:#fff;
    outline:none;
    padding:12px;
    transition:.2s;
}

input{
    height:46px;
}

textarea{
    min-height:95px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#555;
}

.username-info{
    margin-top:7px;
    color:#555;
    font-size:10px;
    line-height:1.5;
}

.file{
    display:block;
    border:1px dashed #303030;
    border-radius:12px;
    padding:17px;
    text-align:center;
    color:#777;
    cursor:pointer;
    transition:.2s;
}

.file:hover{
    border-color:#666;
    color:#fff;
    background:#0a0a0a;
}

.file input{
    display:none;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:60px;
    padding:3px;
}

.color-value{
    color:#777;
    font-size:11px;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.save:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(255,255,255,.10);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}

.message{
    min-height:22px;
    text-align:center;
    margin-top:12px;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff6666;
}

.status{
    margin-top:18px;
    padding:14px;
    border:1px solid #1e1e1e;
    border-radius:13px;
    background:#070707;
}

.status-title{
    color:#555;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.3px;
    margin-bottom:10px;
}

.status-line{
    display:flex;
    align-items:center;
    gap:8px;
    color:#666;
    font-size:10px;
    margin:7px 0;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#333;
}

.status-line.ok{
    color:#aaa;
}

.status-line.ok .dot{
    background:#aaa;
}

.status-line.error{
    color:#ff6666;
}

.status-line.error .dot{
    background:#ff6666;
}

/* PREVIEW */

.banner{
    height:190px;
    position:relative;
    background:
        linear-gradient(
            135deg,
            #181818,
            #050505
        );
    background-size:cover;
    background-position:center;
}

.banner:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent,
        #080808
    );
}

.preview-body{
    position:relative;
    margin-top:-58px;
    z-index:2;
    padding:0 25px 30px;
    text-align:center;
}

.avatar{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #080808;
    background:#111;
}

.preview-name{
    margin-top:13px;
    font-size:23px;
    font-weight:800;
}

.preview-username{
    margin-top:4px;
    color:#666;
    font-size:11px;
}

.preview-bio{
    max-width:330px;
    margin:14px auto;
    color:#aaa;
    font-size:12px;
    line-height:1.5;
}

.website{
    display:none;
    color:var(--accent);
    font-size:11px;
    text-decoration:none;
}

.badges-title{
    margin-top:24px;
    margin-bottom:10px;
    color:#555;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.4px;
}

.badges{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.badge{
    width:35px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    background:#101010;
    color:#555;
    font-size:13px;
    opacity:.4;
}

.badge.early{
    color:#fff;
    border-color:#444;
    opacity:1;
}

@media(max-width:850px){

    body{
        padding:13px;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <div>
            <div class="title">Customize</div>
            <div class="subtitle">
                Customize your NØX identity.
            </div>
        </div>

        <a href="dashboard.html" class="back">
            ← BACK
        </a>
    </div>


    <div class="layout">

        <!-- EDITOR -->

        <div class="editor">

            <div class="section">

                <div class="section-title">
                    IDENTITY
                </div>

                <div class="field">

                    <label>USERNAME</label>

                    <input
                        id="username"
                        type="text"
                        maxlength="20"
                        autocomplete="off"
                    >

                    <div
                        id="usernameInfo"
                        class="username-info"
                    >
                        Cargando...
                    </div>

                </div>


                <div class="field">

                    <label>DISPLAY NAME</label>

                    <input
                        id="displayName"
                        type="text"
                        maxlength="30"
                        placeholder="NØX"
                    >

                </div>


                <div class="field">

                    <label>BIO</label>

                    <textarea
                        id="bio"
                        maxlength="160"
                        placeholder="This is my NØX profile."
                    ></textarea>

                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    MEDIA
                </div>


                <div class="field">

                    <label>PROFILE PICTURE</label>

                    <label class="file">

                        📷 CHOOSE PROFILE PHOTO

                        <input
                            id="avatarFile"
                            type="file"
                            accept="image/*"
                        >

                    </label>

                </div>


                <div class="field">

                    <label>BANNER</label>

                    <label class="file">

                        🖼️ CHOOSE BANNER

                        <input
                            id="bannerFile"
                            type="file"
                            accept="image/*"
                        >

                    </label>

                </div>


                <div class="field">

                    <label>PROFILE BACKGROUND</label>

                    <label class="file">

                        🌌 CHOOSE BACKGROUND

                        <input
                            id="backgroundFile"
                            type="file"
                            accept="image/*"
                        >

                    </label>

                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    STYLE
                </div>


                <div class="field">

                    <label>ACCENT COLOR</label>

                    <div class="color-row">

                        <input
                            id="accentColor"
                            type="color"
                            value="#ffffff"
                        >

                        <span
                            id="colorValue"
                            class="color-value"
                        >
                            #FFFFFF
                        </span>

                    </div>

                </div>


                <div class="field">

                    <label>PROFILE EFFECT</label>

                    <select id="profileEffect">

                        <option value="none">
                            None
                        </option>

                        <option value="particles">
                            Particles
                        </option>

                        <option value="floating">
                            Floating
                        </option>

                    </select>

                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    SOCIAL
                </div>

                <div class="field">

                    <label>WEBSITE</label>

                    <input
                        id="website"
                        type="url"
                        placeholder="https://example.com"
                    >

                </div>

            </div>


            <button
                id="save"
                class="save"
                type="button"
            >
                SAVE CHANGES
            </button>


            <div
                id="message"
                class="message"
            ></div>


            <div class="status">

                <div class="status-title">
                    NØX SYSTEM STATUS
                </div>

                <div
                    id="statusSupabase"
                    class="status-line"
                >
                    <span class="dot"></span>
                    Supabase
                </div>

                <div
                    id="statusUser"
                    class="status-line"
                >
                    <span class="dot"></span>
                    Usuario
                </div>

                <div
                    id="statusProfile"
                    class="status-line"
                >
                    <span class="dot"></span>
                    Profile
                </div>

                <div
                    id="statusDatabase"
                    class="status-line"
                >
                    <span class="dot"></span>
                    Database
                </div>

                <div
                    id="statusStorage"
                    class="status-line"
                >
                    <span class="dot"></span>
                    Storage
                </div>

            </div>

        </div>


        <!-- PREVIEW -->

        <div
            id="preview"
            class="preview"
        >

            <div
                id="banner"
                class="banner"
            ></div>

            <div class="preview-body">

                <img
                    id="avatar"
                    class="avatar"
                    alt="Avatar"
                >

                <div
                    id="previewName"
                    class="preview-name"
                >
                    NØX
                </div>

                <div
                    id="previewUsername"
                    class="preview-username"
                >
                    @nox
                </div>

                <div
                    id="previewBio"
                    class="preview-bio"
                >
                    This is my NØX profile.
                </div>

                <a
                    id="websitePreview"
                    class="website"
                    target="_blank"
                    rel="noopener"
                ></a>


                <div class="badges-title">
                    BADGES
                </div>

                <div class="badges">

                    <div
                        class="badge early"
                        title="Early Access"
                    >
                        ◆
                    </div>

                    <div
                        class="badge"
                        title="Verified"
                    >
                        ✓
                    </div>

                    <div
                        class="badge"
                        title="Developer"
                    >
                        ⚡
                    </div>

                    <div
                        class="badge"
                        title="OG"
                    >
                        ★
                    </div>

                    <div
                        class="badge"
                        title="Supporter"
                    >
                        ◇
                    </div>

                    <div
                        class="badge"
                        title="Premium"
                    >
                        ◈
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/* =====================================================
   NØX
===================================================== */

let currentUser = null;
let profile = null;

const $ = id =>
    document.getElementById(id);


/* =====================================================
   STATUS
===================================================== */

function setStatus(id, ok){

    const el = $(id);

    if(!el) return;

    el.classList.remove(
        "ok",
        "error"
    );

    el.classList.add(
        ok ? "ok" : "error"
    );
}


/* =====================================================
   MESSAGE
===================================================== */

function message(text, type=""){

    const el =
        $("message");

    el.textContent =
        text;

    el.className =
        "message " + type;
}


/* =====================================================
   START
===================================================== */

async function start(){

    try{

        if(
            typeof supabaseClient ===
            "undefined"
        ){

            throw new Error(
                "No se encontró supabaseClient. Revisa supabase.js."
            );

        }


        setStatus(
            "statusSupabase",
            true
        );


        const result =
            await supabaseClient
                .auth
                .getUser();


        if(result.error)
            throw result.error;


        if(
            !result.data ||
            !result.data.user
        ){

            setStatus(
                "statusUser",
                false
            );

            message(
                "No hay una sesión iniciada.",
                "error"
            );

            return;

        }


        currentUser =
            result.data.user;


        setStatus(
            "statusUser",
            true
        );


        await loadProfile();

    }
    catch(error){

        console.error(
            "NØX START:",
            error
        );

        message(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    const result =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if(result.error){

        setStatus(
            "statusProfile",
            false
        );

        throw result.error;

    }


    if(!result.data){

        setStatus(
            "statusProfile",
            false
        );

        throw new Error(
            "No existe tu perfil en la tabla profiles."
        );

    }


    profile =
        result.data;


    setStatus(
        "statusProfile",
        true
    );


    $("username").value =
        profile.username || "";


    $("displayName").value =
        profile.display_name || "NØX";


    $("bio").value =
        profile.bio ||
        "This is my NØX profile.";


    $("website").value =
        profile.website_url || "";


    $("accentColor").value =
        profile.accent_color ||
        "#ffffff";


    $("profileEffect").value =
        profile.profile_effect ||
        "none";


    if(profile.avatar_url){

        $("avatar").src =
            profile.avatar_url;

    }
    else{

        $("avatar").src =
            createAvatar();

    }


    if(profile.banner_url){

        $("banner").style.backgroundImage =
            `url("${profile.banner_url}")`;

    }


    if(profile.background_url){

        $("preview").style.backgroundImage =
            `url("${profile.background_url}")`;

    }


    updatePreview();
    usernameInfo();

}


/* =====================================================
   DEFAULT AVATAR
===================================================== */

function createAvatar(){

    return "data:image/svg+xml," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="300"
                 height="300">
                <rect width="100%"
                      height="100%"
                      fill="#111"/>
                <text x="50%"
                      y="54%"
                      text-anchor="middle"
                      fill="#777"
                      font-size="80"
                      font-family="Arial">
                    NØX
                </text>
            </svg>
        `);

}

   PREVIEW
===================================================== */

function updatePreview(){

    const username =
        $("username")
            .value
            .trim();


    const name =
        $("displayName")
            .value
            .trim();


    const bio =

            .value

        "@" +

    $("previewBio")

        bio ||
        "This is my NØX profile.";


    const color =
        $("accentColor").value;


    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );


    $("colorValue")

        color.t
