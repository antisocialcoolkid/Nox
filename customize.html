<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Customize</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1000px,92%);
    margin:50px auto;
}

h1{
    margin:0;
    font-size:34px;
}

.subtitle{
    color:#777;
    margin-top:6px;
    margin-bottom:30px;
}

.card{
    background:#0c0c0c;
    border:1px solid #252525;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

label{
    display:block;
    color:#777;
    font-size:11px;
    font-weight:bold;
    margin-bottom:8px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #292929;
    background:#070707;
    color:white;
    outline:none;
    margin-bottom:18px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#666;
}

.username-info{
    color:#666;
    font-size:11px;
    margin-top:-10px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#message{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    font-size:12px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff5555;
}

.status{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#070707;
    border:1px solid #1d1d1d;
}

.status-title{
    color:#666;
    font-size:10px;
    font-weight:bold;
    margin-bottom:10px;
}

.status div{
    font-size:11px;
    color:#666;
    margin:7px 0;
}

.status .ok{
    color:#aaa;
}

.status .bad{
    color:#ff5555;
}

.preview{
    overflow:hidden;
    border-radius:20px;
    border:1px solid #252525;
    background:#0b0b0b;
}

.banner{
    height:180px;
    background:#151515 center/cover no-repeat;
}

.profile{
    text-align:center;
    padding:0 20px 30px;
    margin-top:-55px;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    background:#151515;
    border:4px solid #0b0b0b;
}

.name{
    font-size:24px;
    font-weight:bold;
    margin-top:12px;
}

.username{
    color:#666;
    font-size:12px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:13px;
    margin:15px auto;
    max-width:450px;
    line-height:1.5;
}

@media(max-width:700px){

    .container{
        margin:25px auto;
    }

    h1{
        font-size:28px;
    }

}
</style>
</head>

<body>

<div class="container">

    <h1>Customize</h1>

    <div class="subtitle">
        Customize your NØX identity.
    </div>


    <!-- PREVIEW -->

    <div class="preview">

        <div
            id="banner"
            class="banner"
        ></div>

        <div class="profile">

            <img
                id="avatar"
                class="avatar"
                alt="Avatar"
            >

            <div
                id="previewName"
                class="name"
            >
                NØX
            </div>

            <div
                id="previewUsername"
                class="username"
            >
                @nox
            </div>

            <div
                id="previewBio"
                class="bio"
            >
                This is my NØX profile.
            </div>

        </div>

    </div>


    <!-- EDITOR -->

    <div class="card">

        <label>
            USERNAME
        </label>

        <input
            id="username"
            type="text"
            maxlength="20"
        >

        <div
            id="usernameInfo"
            class="username-info"
        >
            Username actual.
        </div>


        <label>
            DISPLAY NAME
        </label>

        <input
            id="displayName"
            type="text"
            maxlength="30"
        >


        <label>
            BIO
        </label>

        <textarea
            id="bio"
            maxlength="160"
        ></textarea>


        <label>
            WEBSITE
        </label>

        <input
            id="website"
            type="url"
            placeholder="https://example.com"
        >


        <button
            id="save"
            type="button"
        >
            SAVE CHANGES
        </button>


        <div
            id="message"
        ></div>


        <div class="status">

            <div class="status-title">
                NØX SYSTEM STATUS
            </div>

            <div id="statusSupabase">
                ⚪ Supabase
            </div>

            <div id="statusUser">
                ⚪ Usuario
            </div>

            <div id="statusProfile">
                ⚪ Profile
            </div>

            <div id="statusDatabase">
                ⚪ Database
            </div>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>


<script>

let currentUser = null;
let currentProfile = null;


const $ = (id) =>
    document.getElementById(id);


function setStatus(id, ok){

    const element = $(id);

    if(!element) return;

    element.classList.remove(
        "ok",
        "bad"
    );

    element.classList.add(
        ok ? "ok" : "bad"
    );

    element.textContent =
        (ok ? "🟢 " : "🔴 ") +
        element.textContent
            .replace(/^🟢 |^🔴 |^⚪ /,"");

}


function showMessage(text, type){

    const element =
        $("message");

    element.textContent =
        text;

    element.className =
        type || "";

}


/* =========================================
   CARGAR USUARIO
========================================= */

async function loadUser(){

    try{

        const result =
            await supabaseClient
                .auth
                .getUser();


        if(result.error){

            setStatus(
                "statusUser",
                false
            );

            throw result.error;

        }


        currentUser =
            result.data.user;


        if(!currentUser){

            setStatus(
                "statusUser",
                false
            );

            showMessage(
                "No hay una sesión iniciada.",
                "error"
            );

            return;

        }


        setStatus(
            "statusSupabase",
            true
        );

        setStatus(
            "statusUser",
            true
        );


        await loadProfile();

    }
    catch(error){

        console.error(
            "LOAD USER:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================
   CARGAR PROFILE
========================================= */

async function loadProfile(){

    const result =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if(result.error){

        setStatus(
            "statusProfile",
            false
        );

        throw result.error;

    }


    if(!result.data){

        setStatus(
            "statusProfile",
            false
        );

        showMessage(
            "No existe un perfil para este usuario.",
            "error"
        );

        return;

    }


    currentProfile =
        result.data;


    setStatus(
        "statusProfile",
        true
    );


    $("username").value =
        currentProfile.username || "";


    $("displayName").value =
        currentProfile.display_name || "NØX";


    $("bio").value =
        currentProfile.bio ||
        "This is my NØX profile.";


    $("website").value =
        currentProfile.website_url || "";


    updatePreview();

}


/* =========================================
   PREVIEW
========================================= */

function updatePreview(){

    const username =
        $("username").value.trim();

    const name =
        $("displayName").value.trim();

    const bio =
        $("bio").value.trim();


    $("previewUsername")
        .textContent =
        "@" + (
            username || "nox"
        );


    $("previewName")
        .textContent =
        name || "NØX";


    $("previewBio")
        .textContent =
        bio ||
        "This is my NØX profile.";

}


/* =========================================
   INPUTS
========================================= */

$("username")
.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .toLowerCase()
                .replace(
                    /[^a-z0-9_]/g,
                    ""
                );

        updatePreview();

    }
);


$("displayName")
.addEventListener(
    "input",
    updatePreview
);


$("bio")
.addEventListener(
    "input",
    updatePreview
);


/* =========================================
   SAVE
========================================= */

$("save")
.addEventListener(
    "click",
    async function(){

        const button =
            $("save");


        try{

            console.log(
                "NØX: SAVE CLICK"
            );


            if(!currentUser){

                throw new Error(
                    "No hay usuario autenticado."
                );

            }


            const username =
                $("username")
                    .value
                    .trim()
                    .toLowerCase();


            const displayName =
                $("displayName")
                    .value
                    .trim();


            const bio =
                $("bio")
                    .value
                    .trim();


            const website =
                $("website")
                    .value
                    .trim();


            if(!username){

                throw new Error(
                    "El username no puede estar vacío."
                );

            }


            button.disabled =
                true;

            button.textContent =
                "SAVING...";


            showMessage(
                "Guardando..."
            );


            /*
             * IMPORTANTE:
             * No cambiamos el username mediante
             * RPC aquí. Primero hacemos funcionar
             * correctamente el UPDATE.
             */

            const updateData = {

                display_name:
                    displayName,

                bio:
                    bio,

                website_url:
                    website

            };


            const result =
                await supabaseClient
                    .from("profiles")
                    .update(updateData)
                    .eq(
                        "id",
                        currentUser.id
                    )
                    .select()
                    .single();


            if(result.error){

                setStatus(
                    "statusDatabase",
                    false
                );

                throw result.error;

            }


            currentProfile =
                result.data;


            setStatus(
                "statusDatabase",
                true
            );


            showMessage(
                "✓ Cambios guardados correctamente.",
                "success"
            );


            updatePreview();


            console.log(
                "NØX: PROFILE UPDATED",
                result.data
            );


        }
        catch(error){

            console.error(
                "NØX SAVE ERROR:",
                error
            );


            showMessage(
                "⚠️ " +
                error.message,
                "error"
            );

        }
        finally{

            button.disabled =
                false;

            button.textContent =
                "SAVE CHANGES";

        }

    }
);


/* =========================================
   START
========================================= */

loadUser();

</script>

</body>
</html>
