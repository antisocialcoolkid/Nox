<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Customize</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050505;
    --panel:#0b0b0b;
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#666;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,sans-serif;
}


/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );

    background-size:70px 70px;
}


/* NAV */

nav{
    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 35px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.logo{
    color:white;
    text-decoration:none;

    font-size:23px;
    font-weight:800;

    letter-spacing:-1.5px;
}

.back{
    color:#555;
    text-decoration:none;

    font-size:11px;

    transition:.3s;
}

.back:hover{
    color:white;
}


/* MAIN */

main{
    width:min(1200px,calc(100% - 40px));
    margin:auto;

    padding:55px 0 100px;
}

.eyebrow{
    color:#444;

    font-size:9px;
    letter-spacing:3px;
}

h1{
    margin-top:12px;

    font-size:
        clamp(40px,6vw,65px);

    letter-spacing:-4px;
}


/* GRID */

.layout{
    display:grid;

    grid-template-columns:
        390px 1fr;

    gap:20px;

    margin-top:45px;
}


/* EDITOR */

.editor{
    padding:25px;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );
}

.section{
    padding-bottom:24px;
    margin-bottom:24px;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.section:last-child{
    border-bottom:0;
    margin-bottom:0;
    padding-bottom:0;
}

.section-title{
    color:#555;

    font-size:9px;

    letter-spacing:2px;

    margin-bottom:18px;
}

.field{
    margin-bottom:15px;
}

.field:last-child{
    margin-bottom:0;
}

label{
    display:block;

    color:#777;

    font-size:10px;

    margin-bottom:7px;
}

input,
textarea{
    width:100%;

    outline:none;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:9px;

    background:#080808;

    color:white;

    font-family:inherit;

    font-size:12px;

    transition:.25s;
}

input{
    height:45px;
    padding:0 12px;
}

textarea{
    min-height:90px;
    padding:12px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:
        rgba(255,255,255,.25);
}

input::placeholder,
textarea::placeholder{
    color:#333;
}


/* COLOR */

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

#color{
    width:50px;
    height:40px;
    padding:3px;
    cursor:pointer;
}

#colorText{
    color:#666;
    font-size:11px;
}


/* BUTTON */

.save{
    width:100%;

    height:48px;

    margin-top:22px;

    border:0;

    border-radius:9px;

    background:white;

    color:black;

    font-family:inherit;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    transition:.3s;
}

.save:hover{
    transform:translateY(-2px);

    box-shadow:
        0 15px 40px
        rgba(255,255,255,.1);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}


/* MESSAGE */

.message{
    min-height:18px;

    margin-top:12px;

    text-align:center;

    color:#777;

    font-size:10px;
}


/* PREVIEW */

.preview{
    min-height:700px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:sticky;
    top:20px;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.045),
            transparent 55%
        ),
        #050505;
}

.preview-label{
    position:absolute;

    top:20px;
    left:22px;

    color:#333;

    font-size:9px;

    letter-spacing:2px;
}


/* PROFILE */

.profile-card{
    width:min(400px,calc(100% - 40px));

    padding:40px 30px;

    text-align:center;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:22px;

    background:
        rgba(10,10,10,.82);

    backdrop-filter:blur(25px);

    box-shadow:
        0 40px 100px
        rgba(0,0,0,.7);

    transition:.4s;
}

.avatar{
    width:90px;
    height:90px;

    margin:auto;

    display:grid;
    place-items:center;

    overflow:hidden;

    border-radius:27px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.12);

    font-size:28px;
    font-weight:800;

    transition:.3s;
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.name{
    margin-top:20px;

    font-size:26px;

    font-weight:800;
}

.username{
    display:block;

    margin-top:5px;

    color:#555;

    font-size:11px;
}

.bio{
    margin:18px auto 0;

    max-width:310px;

    color:#777;

    font-size:12px;

    line-height:1.7;
}

.links{
    display:flex;

    flex-direction:column;

    gap:8px;

    margin-top:25px;
}

.link{
    min-height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:9px;

    background:
        rgba(255,255,255,.025);

    color:#aaa;

    font-size:11px;
}

.footer{
    margin-top:22px;

    color:#333;

    font-size:8px;

    letter-spacing:2px;
}


/* MOBILE */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        min-height:650px;
    }

}

@media(max-width:500px){

    nav{
        padding:0 18px;
    }

    main{
        width:calc(100% - 25px);
        padding-top:40px;
    }

    h1{
        letter-spacing:-2.5px;
    }

    .editor{
        padding:20px;
    }

}

</style>

</head>


<body>


<nav>

    <a
        href="dashboard.html"
        class="logo"
    >
        NØX
    </a>

    <a
        href="dashboard.html"
        class="back"
    >
        ← Dashboard
    </a>

</nav>


<main>


<div class="eyebrow">

</div>


<h1>

</h1>


<div class="layout">


<!-- EDITOR -->

BIO

<div class="field">

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let currentUser = null;


/* =========================
   ELEMENTS
========================= */

const username =
    document.getElementById("username");

const displayName =
    document.getElementById("displayName");

const bio =
    document.getElementById("bio");

const avatar =
    document.getElementById("avatar");

const color =
    document.getElementById("color");

const colorText =
    document.getElementById("colorText");

const link1 =
    document.getElementById("link1");

const url1 =
    document.getElementById("url1");

const link2 =
    document.getElementById("link2");

const url2 =
    document.getElementById("url2");

const link3 =
    document.getElementById("link3");

const url3 =
    document.getElementById("url3");


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const name =
        displayName.value ||
        "NØX";

    const user =
        username.value ||
        "nox";

    const description =
        bio.value ||
        "Welcome to my corner of the void.";

    const accent =
        color.value ||
        "#ffffff";


    document
        .getElementById("namePreview")
        .textContent =
        name;


    document
        .getElementById("usernamePreview")
        .textContent =
        "@" + user;


    document
        .getElementById("bioPreview")
        .textContent =
        description;


    document
        .getElementById("link1Preview")
        .textContent =
        link1.value ||
        "Discord";


    document
        .getElementById("link2Preview")
        .textContent =
        link2.value ||
        "Instagram";


    document
        .getElementById("link3Preview")
        .textContent =
        link3.value ||
        "YouTube";


    colorText.textContent =
        accent;


    document
        .getElementById("namePreview")
        .style.textShadow =
        `0 0 35px ${accent}22`;


    document
        .getElementById("profileCard")
        .style.boxShadow =
        `0 40px 100px ${accent}10`;


    const avatarPreview =
        document.getElementById(
            "avatarPreview"
        );


    if(avatar.value.trim()){

        avatarPreview.innerHTML = "";

        const img =
            document.createElement("img");

        img.src =
            avatar.value.trim();

        img.onerror = () => {

            avatarPreview.innerHTML =
                name
                    .charAt(0)
                    .toUpperCase();

        };

        avatarPreview.appendChild(img);

    }else{

        avatarPreview.textContent =
            name
                .charAt(0)
                .toUpperCase();

    }

}


/* =========================
   INPUT EVENTS
========================= */

document
    .querySelectorAll("input, textarea")
    .forEach(element => {

        element.addEventListener(
            "input",
            updatePreview
        );

    });


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if(error){

        console.error(error);

        return;

    }


    if(!data.session){

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        data.session.user;


    const {
        data: profile,
        error: profileError
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .single();


    if(profileError){

        console.error(
            profileError
        );

        document
            .getElementById("message")
            .textContent =
            "No se pudo cargar tu perfil.";

        return;

    }


    username.value =
        profile.username || "";

    displayName.value =
        profile.display_name || "";

    bio.value =
        profile.bio || "";

    avatar.value =
        profile.avatar_url || "";

    color.value =
        profile.accent_color ||
        "#ffffff";


    /*
    LOAD LINKS
    */

    const {
        data: links,
        error: linksError
    } =
        await supabaseClient
            .from("profile_links")
            .select("*")
            .eq(
                "profile_id",
                currentUser.id
            )
            .order(
                "position",
                {
                    ascending:true
                }
            );


    if(!linksError && links){

        if(links[0]){

            link1.value =
                links[0].title;

            url1.value =
                links[0].url;

        }

        if(links[1]){

            link2.value =
                links[1].title;

            url2.value =
                links[1].url;

        }

        if(links[2]){

            link3.value =
                links[2].title;

            url3.value =
                links[2].url;

        }

    }


    updatePreview();

}


/* =========================
   SAVE
========================= */

document
    .getElementById("save")
    .addEventListener(
        "click",
        async () => {

            const button =
                document.getElementById(
                    "save"
                );

            const message =
                document.getElementById(
                    "message"
                );


            button.disabled =
                true;

            button.textContent =
                "SAVING...";

            message.textContent =
                "";


            try{


                /*
                UPDATE PROFILE
                */

                const {
                    error:
                        profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .update({

                            username:
                                username.value
                                    .trim()
                                    .toLowerCase(),

                            display_name:
                                displayName.value
                                    .trim(),

                            bio:
                                bio.value
                                    .trim(),

                            avatar_url:
                                avatar.value
                                    .trim(),

                            accent_color:
                                color.value,

                            updated_at:
                                new Date()
                                    .toISOString()

                        })
                        .eq(
                            "id",
                            currentUser.id
                        );


                if(profileError){

                    throw profileError;

                }


                /*
                DELETE OLD LINKS
                */

                const {
                    error:
                        deleteError
                } =
                    await supabaseClient
                        .from("profile_links")
                        .delete()
                        .eq(
                            "profile_id",
                            currentUser.id
                        );


                if(deleteError){

                    throw deleteError;

                }


                /*
                INSERT NEW LINKS
                */

                const links = [];


                if(
                    link1.value.trim() &&
                    url1.value.trim()
                ){

                    links.push({

                        profile_id:
                            currentUser.id,

                        title:
                            link1.value.trim(),

                        url:
                            url1.value.trim(),

                        position:
                            0

                    });

                }


                if(
                    link2.value.trim() &&
                    url2.value.trim()
                ){

                    links.push({

                        profile_id:
                            currentUser.id,

                        title:
                            link2.value.trim(),

                        url:
                            url2.value.trim(),

                        position:
                            1

                    });

                }


                if(
                    link3.value.trim() &&
                    url3.value.trim()
                ){

                    links.push({

                        profile_id:
                            currentUser.id,

                        title:
                            link3.value.trim(),

                        url:
                            url3.value.trim(),

                        position:
                            2

                    });

                }


                if(links.length){

                    const {
                        error:
                            linksError
                    } =
                        await supabaseClient
                            .from(
                                "profile_links"
                            )
                            .insert(
                                links
                            );


                    if(linksError){

                        throw linksError;

                    }

                }


                /*
                SUCCESS
                */

                message.textContent =
                    "✓ Changes saved.";

                message.style.color =
                    "#aaa";


                button.textContent =
                    "SAVED";


                setTimeout(() => {

                    button.disabled =
                        false;

                    button.textContent =
                        "SAVE CHANGES";

                },1500);


            }catch(
