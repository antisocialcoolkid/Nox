<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    background:#050505;

    color:#fff;

    font-family:
        Arial,
        sans-serif;

    padding:30px;

}

.container{

    width:min(700px,100%);

    margin:auto;

}

.back{

    display:inline-block;

    margin-bottom:25px;

    color:#666;

    text-decoration:none;

    font-size:12px;

}

.back:hover{

    color:white;

}

h1{

    font-size:28px;

    margin-bottom:5px;

}

.subtitle{

    color:#666;

    font-size:13px;

    margin-bottom:30px;

}

.card{

    background:#0d0d0d;

    border:1px solid #222;

    border-radius:18px;

    padding:25px;

}

.field{

    margin-bottom:20px;

}

label{

    display:block;

    color:#888;

    font-size:10px;

    font-weight:bold;

    letter-spacing:1px;

    margin-bottom:8px;

}

input,
textarea{

    width:100%;

    background:#080808;

    border:1px solid #252525;

    border-radius:10px;

    color:white;

    padding:13px;

    outline:none;

    font-family:inherit;

}

input{

    height:48px;

}

textarea{

    min-height:100px;

    resize:vertical;

}

input:focus,
textarea:focus{

    border-color:#555;

}

.username-info{

    margin-top:7px;

    color:#555;

    font-size:10px;

}

button{

    width:100%;

    height:50px;

    border:0;

    border-radius:10px;

    background:white;

    color:black;

    font-weight:800;

    cursor:pointer;

}

button:disabled{

    opacity:.5;

    cursor:wait;

}

.message{

    min-height:20px;

    margin-top:15px;

    text-align:center;

    font-size:11px;

}

.success{

    color:#aaa;

}

.error{

    color:#ff6464;

}

.preview{

    margin-top:20px;

    padding:22px;

    border:1px solid #222;

    border-radius:15px;

}

.preview-name{

    font-size:20px;

    font-weight:800;

}

.preview-username{

    margin-top:4px;

    color:#555;

    font-size:11px;

}

.preview-bio{

    margin-top:15px;

    color:#aaa;

    font-size:12px;

    line-height:1.6;

    white-space:pre-wrap;

}

</style>

</head>


<body>


<div class="container">


<a
    href="dashboard.html"
    class="back"
>
    ← BACK
</a>


<h1>
    Customize
</h1>


<div class="subtitle">
    Customize your NØX identity.
</div>


<div class="card">


<!-- USERNAME -->

<div class="field">

<label>
    USERNAME
</label>

<input
    id="username"
    type="text"
    maxlength="20"
    autocomplete="off"
>

<div
    id="usernameInfo"
    class="username-info"
>
    Loading...
</div>

</div>


<!-- DISPLAY NAME -->

<div class="field">

<label>
    DISPLAY NAME
</label>

<input
    id="displayName"
    type="text"
    maxlength="30"
    placeholder="Your name"
>

</div>


<!-- BIO -->

<div class="field">

<label>
    BIO
</label>

<textarea
    id="bio"
    maxlength="160"
    placeholder="Tell people about yourself..."
></textarea>

</div>


<!-- WEBSITE -->

<div class="field">

<label>
    WEBSITE
</label>

<input
    id="website"
    type="url"
    placeholder="https://example.com"
>

</div>


<!-- COLOR -->

<div class="field">

<label>
    ACCENT COLOR
</label>

<input
    id="accentColor"
    type="color"
    value="#ffffff"
>

</div>


<button
    id="saveButton"
    type="button"
>
    SAVE CHANGES
</button>


<div
    id="message"
    class="message"
></div>


</div>


<!-- PREVIEW -->

<div class="preview">

<div
    id="previewName"
    class="preview-name"
>
NØX
</div>

<div
    id="previewUsername"
    class="preview-username"
>
@username
</div>

<div
    id="previewBio"
    class="preview-bio"
>
Your bio will appear here.
</div>

</div>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


let currentUser = null;

let profile = null;


/* ELEMENTOS */

const username =
    document.getElementById(
        "username"
    );

const displayName =
    document.getElementById(
        "displayName"
    );

const bio =
    document.getElementById(
        "bio"
    );

const website =
    document.getElementById(
        "website"
    );

const accentColor =
    document.getElementById(
        "accentColor"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const message =
    document.getElementById(
        "message"
    );

const usernameInfo =
    document.getElementById(
        "usernameInfo"
    );


/* MENSAJE */

function showMessage(
    text,
    type=""
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =================================
   LOGIN CHECK
================================= */

async function start(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(error)
            throw error;


        if(!data.user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            data.user;


        await loadProfile();


    }catch(error){

        console.error(
            "NØX:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =================================
   LOAD PROFILE
================================= */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(error)
        throw error;


    /*
    SI NO EXISTE EL PERFIL
    */

    if(!data){

        const {
            data:newProfile,
            error:createError
        } =
        await supabaseClient
            .from("profiles")
            .insert({

                id:
                    currentUser.id,

                username:
                    currentUser.email
                        .split("@")[0]
                        .toLowerCase()
                        .replace(
                            /[^a-z0-9_]/g,
                            ""
                        ),

                display_name:
                    currentUser.email
                        .split("@")[0],

                bio:"",

                website_url:"",

                accent_color:
                    "#ffffff",

                updated_at:
                    new Date().toISOString()

            })
            .select()
            .single();


        if(createError)
            throw createError;


        profile =
            newProfile;

    }else{

        profile =
            data;

    }


    fillForm();

}


/* =================================
   FILL FORM
================================= */

function fillForm(){

    username.value =
        profile.username || "";


    displayName.value =
        profile.display_name || "";


    bio.value =
        profile.bio || "";


    website.value =
        profile.website_url || "";


    accentColor.value =
        profile.accent_color ||
        "#ffffff";


    updatePreview();

    updateUsernameInfo();

}


/* =================================
   USERNAME STATUS
================================= */

function updateUsernameInfo(){

    if(!profile)
        return;


    const current =
        (profile.username || "")
            .toLowerCase();


    const typed =
        username.value
            .trim()
            .toLowerCase();


    if(typed === current){

        usernameInfo.textContent =
            "Username actual.";

        return;

    }


    if(!profile.username_changed_at){

        usernameInfo.textContent =
            "Puedes cambiar tu username.";

        return;

    }


    const last =
        new Date(
            profile.username_changed_at
        );


    const next =
        new Date(
            last.getTime()
            +
            7 * 24 * 60 * 60 * 1000
        );


    if(Date.now() >= next.getTime()){

        usernameInfo.textContent =
            "Puedes cambiar tu username.";

    }else{

        const days =
            Math.ceil(
                (
                    next.getTime()
                    -
                    Date.now()
                )
                /
                86400000
            );

        usernameInfo.textContent =
            `Podrás cambiarlo en ${days} día(s).`;

    }

}


/* =================================
   PREVIEW
================================= */

function updatePreview(){

    document.getElementById(
        "previewName"
    ).textContent =
        displayName.value ||
        "NØX";


    document.getElementById(
        "previewUsername"
    ).textContent =
        "@" +
        (
            username.value ||
            "username"
        );


    document.getElementById(
        "previewBio"
    ).textContent =
        bio.value ||
        "Your bio will appear here.";

}


/* =================================
   SAVE
================================= */

saveButton.addEventListener(
    "click",
    saveProfile
);


async function saveProfile(){

    saveButton.disabled =
        true;

    saveButton.textContent =
        "SAVING...";

    showMessage("");


    try{

        const newUsername =
            username.value
                .trim()
                .toLowerCase();


        /* USERNAME */

        if(
            newUsername !==
            (
                profile.username ||
                ""
            ).toLowerCase()
        ){

            const {
                error
            } =
            await supabaseClient
                .rpc(
                    "change_username",
                    {
                        new_username:
                            newUsername
                    }
                );


            if(error)
                throw error;

        }


        /* PROFILE */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("profiles")
            .update({

                display_name:
                    displayName.value
                        .trim(),

                bio:
                    bio.value
                        .trim(),

                website_url:
                    website.value
                        .trim(),

                accent_color:
                    accentColor.value,

                updated_at:
                    new Date()
                        .toISOString()

            })
            .eq(
                "id",
                currentUser.id
            )
            .select()
            .single();


        if(error)
            throw error;


        profile =
            data;


        updatePreview();

        updateUsernameInfo();


        showMessage(
            "✓ Changes saved.",
            "success"
        );


    }catch(error){

        console.error(
            "NØX SAVE ERROR:",
            error
        );


        showMessage(
            error.message ||
            "No se pudieron guardar los cambios.",
            "error"
        );


    }finally{

        saveButton.disabled =
            false;

        saveButton.textContent =
            "SAVE CHANGES";

    }

}


/* =================================
   LIVE PREVIEW
================================= */

username.addEventListener(
    "input",
    () => {

        updatePreview();

        updateUsernameInfo();

    }
);


displayName.addEventListener(
    "input",
    updatePreview
);


bio.addEventListener(
    "input",
    updatePreview
);


/* START */

start();

</script>


</body>

</html>
