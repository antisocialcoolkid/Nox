<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>NØX — Customize</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


:root{

    --accent:#ffffff;

    --bg:#030303;

    --panel:#090909;

    --border:#202020;

}


body{

    min-height:100vh;

    background:

        radial-gradient(
            circle at top,
            rgba(255,255,255,.06),
            transparent 35%
        ),

        #030303;

    color:white;

    font-family:
        Inter,
        Arial,
        sans-serif;

    padding:25px;

}


.container{

    width:min(
        1150px,
        100%
    );

    margin:auto;

}


.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}


.title{

    font-size:30px;

    font-weight:800;

    letter-spacing:-1.5px;

}


.subtitle{

    margin-top:5px;

    color:#666;

    font-size:12px;

}


.back{

    color:#666;

    text-decoration:none;

    font-size:12px;

}


.back:hover{

    color:white;

}


.layout{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        430px;

    gap:20px;

}


.panel{

    padding:25px;

    border:
        1px solid
        var(--border);

    border-radius:20px;

    background:
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(20px);

}


.section{

    margin-bottom:30px;

}


.section-title{

    margin-bottom:15px;

    color:#777;

    font-size:10px;

    font-weight:800;

    letter-spacing:1.5px;

}


.field{

    margin-bottom:17px;

}


label{

    display:block;

    margin-bottom:7px;

    color:#777;

    font-size:10px;

    font-weight:700;

}


input,
textarea,
select{

    width:100%;

    border:
        1px solid
        #242424;

    border-radius:10px;

    outline:none;

    background:#070707;

    color:white;

    padding:12px;

    font-family:inherit;

}


input{

    height:46px;

}


textarea{

    min-height:90px;

    resize:vertical;

}


input:focus,
textarea:focus,
select:focus{

    border-color:
        rgba(255,255,255,.35);

}


.username-info{

    margin-top:7px;

    color:#555;

    font-size:10px;

    line-height:1.5;

}


.file{

    display:block;

    padding:18px;

    border:
        1px dashed
        #292929;

    border-radius:12px;

    color:#777;

    text-align:center;

    font-size:11px;

    cursor:pointer;

    transition:.25s;

}


.file:hover{

    color:white;

    border-color:#555;

    background:#0c0c0c;

}


.file input{

    display:none;

}


.color-row{

    display:flex;

    align-items:center;

    gap:12px;

}


.color-row input{

    width:55px;

    height:40px;

    padding:3px;

}


.color-value{

    color:#777;

    font-size:11px;

}


.save{

    width:100%;

    height:50px;

    border:0;

    border-radius:11px;

    background:white;

    color:black;

    font-weight:800;

    cursor:pointer;

    transition:.25s;

}


.save:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 15px 40px
        rgba(255,255,255,.1);

}


.save:disabled{

    opacity:.5;

    cursor:wait;

    transform:none;

}


.message{

    min-height:18px;

    margin-top:13px;

    text-align:center;

    font-size:11px;

}


.success{

    color:#aaa;

}


.error{

    color:#ff6666;

}


/* =========================
   PREVIEW
========================= */


.preview{

    position:sticky;

    top:20px;

    overflow:hidden;

    border:
        1px solid
        var(--border);

    border-radius:22px;

    background:#080808;

    transition:.4s;

}


.banner{

    height:180px;

    position:relative;

    background:

        linear-gradient(
            135deg,
            #171717,
            #050505
        );

    background-position:center;

    background-size:cover;

}


.banner::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            transparent,
            #080808
        );

}


.preview-content{

    position:relative;

    margin-top:-60px;

    padding:
        0 25px 30px;

    text-align:center;

    z-index:2;

}


.avatar{

    width:105px;

    height:105px;

    border:
        4px solid
        #080808;

    border-radius:50%;

    object-fit:cover;

    background:#111;

}


.preview-name{

    margin-top:15px;

    font-size:23px;

    font-weight:800;

}


.preview-username{

    margin-top:4px;

    color:#666;

    font-size:11px;

}


.preview-bio{

    max-width:340px;

    margin:15px auto;

    color:#aaa;

    font-size:12px;

    line-height:1.5;

}


.preview-link{

    color:var(--accent);

    font-size:11px;

}


.badges{

    display:flex;

    justify-content:center;

    gap:7px;

    margin-top:18px;

}


.badge{

    width:30px;

    height:30px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        #292929;

    border-radius:9px;

    background:#111;

    transition:.25s;

}


.badge:hover{

    transform:
        translateY(-4px);

    border-color:
        var(--accent);

}


.floating{

    animation:
        floating
        4s
        ease-in-out
        infinite;

}


@keyframes floating{

    0%,
    100%{

        transform:
            translateY(0);

    }

    50%{

        transform:
            translateY(-6px);

    }

}


.particles{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;

}


.dot{

    position:absolute;

    width:3px;

    height:3px;

    border-radius:50%;

    background:
        var(--accent);

    opacity:.4;

    animation:
        particle
        6s
        infinite
        ease-in-out;

}


@keyframes particle{

    0%,
    100%{

        transform:
            translateY(0);

        opacity:.1;

    }

    50%{

        transform:
            translateY(-35px);

        opacity:.8;

    }

}


@media(max-width:850px){

    body{

        padding:15px;

    }

    .layout{

        grid-template-columns:1fr;

    }

    .preview{

        position:relative;

        top:0;

        order:-1;

    }

}

</style>

</head>

<script>

let currentUser = null;

let profile = null;


const $ =
    id =>
    document.getElementById(id);


/* =========================
   AUTH
========================= */

async function init(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error)
        throw error;


    if(!data.user){

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        data.user;


    await loadProfile();

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .single();


    if(error)
        throw error;


    profile =
        data;


    $("username").value =
        profile.username ||
        "";


    $("displayName").value =
        profile.display_name ||
        "";


    $("bio").value =
        profile.bio ||
        "";


    $("website").value =
        profile.website_url ||
        "";


    $("accentColor").value =
        profile.accent_color ||
        "#ffffff";


    $("profileEffect").value =
        profile.profile_effect ||
        "none";


    updatePreview();

    updateUsernameInfo();

}


/* =========================
   USERNAME TIMER
========================= */

function updateUsernameInfo(){

    const oldUsername =
        (
            profile.username ||
            ""
        ).toLowerCase();


    const newUsername =
        $("username")
            .value
            .trim()
            .toLowerCase();


    if(
        oldUsername ===
        newUsername
    ){

        $("usernameInfo")
            .textContent =
            "Username actual.";

        return;

    }


    if(
        !profile.username_changed_at
    ){

        $("usernameInfo")
            .textContent =
            "✓ Puedes cambiarlo ahora. Después tendrás que esperar 7 días.";

        return;

    }


    const nextChange =
        new Date(
            profile.username_changed_at
        ).getTime()
        +
        7 *
        24 *
        60 *
        60 *
        1000;


    const remaining =
        nextChange -
        Date.now();


    if(
        remaining <= 0
    ){

        $("usernameInfo")
            .textContent =
            "✓ Puedes cambiar tu username.";

        return;

    }


    const days =
        Math.ceil(
            remaining /
            (
                24 *
                60 *
                60 *
                1000
            )
        );


    $("usernameInfo")
        .textContent =
        `🔒 Username bloqueado. Podrás cambiarlo en ${days} día(s).`;

}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const username =
        $("username")
            .value
            .trim();


    const name =
        $("displayName")
            .value
            .trim();


    const bio =
        $("bio")
            .value
            .trim();


    $("previewUsername")
        .textContent =
        "@" +
        (
            username ||
            "nox"
        );


    $("previewName")
        .textContent =
        name ||
        "NØX";


    $("previewBio")
        .textContent =
        bio ||
        "This is my NØX profile.";


    document.documentElement
        .style
        .setProperty(
            "--accent",
            $("accentColor").value
        );


    $("colorValue")
        .textContent =
        $("accentColor")
            .value
            .toUpperCase();


    const website =
        $("website")
            .value
            .trim();


    if(website){

        $("previewWebsite")
            .style
            .display =
            "inline";

        $("previewWebsite")
            .href =
            website;

        $("previewWebsite")
            .textContent =
            website;

    }

    else{

        $("previewWebsite")
            .style
            .display =
            "none";

    }


    $("preview")
        .classList.toggle(
            "floating",
            $("profileEffect").value ===
            "floating"
        );


    createParticles();

}


/* =========================
   PARTICLES
========================= */

function createParticles(){

    $("particles")
        .innerHTML = "";


    if(
        $("profileEffect").value !==
        "particles"
    )
        return;


    for(
        let i = 0;
        i < 35;
        i++
    ){

        const dot =
            document.createElement(
                "div"
            );


        dot.className =
            "dot";


        dot.style.left =
            Math.random() *
            100 +
            "%";


        dot.style.top =
            Math.random() *
            100 +
            "%";


        dot.style.animationDelay =
            Math.random() *
            5 +
            "s";


        $("particles")
            .appendChild(dot);

    }

}


/* =========================
   IMAGE COMPRESSION
========================= */

function compressImage(
    file,
    maxWidth = 1600
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
            event => {

                const img =
                    new Image();


                img.onload =
                () => {

                    let width =
                        img.width;

                    let height =
                        img.height;


                    if(
                        width >
                        maxWidth
                    ){

                        const ratio =
                            maxWidth /
                            width;

                        width =
                            Math.round(
                                width *
                                ratio
                            );

                        height =
                            Math.round(
                                height *
                                ratio
                            );

                    }


                    const canvas =
                        document
                            .createElement(
                                "canvas"
                            );


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas
                            .getContext(
                                "2d"
                            );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    canvas.toBlob(
                        blob => {

                            if(!blob){

                                reject(
                                    new Error(
                                        "No se pudo comprimir la imagen."
                                    )
                                );

                                return;

                            }


                            resolve(blob);

                        },
                        "image/webp",
                        .78
                    );

                };


                img.onerror =
                () =>
                reject(
                    new Error(
                        "Imagen inválida."
                    )
                );


                img.src =
                    event.target.result;

            };


            reader.onerror =
            () =>
            reject(
                new Error(
                    "No se pudo leer la imagen."
                )
            );


            reader.readAsDataURL(file);

        }
    );

}


/* =========================
   UPLOAD
========================= */

async function uploadImage(
    file,
    folder
){

    if(!file)
        return null;


    if(
        file.size >
        15 *
        1024 *
        1024
    ){

        throw new Error(
            "La imagen supera los 15 MB."
        );

    }


    let maxWidth =
        1600;


    if(
        folder ===
        "avatars"
    ){

        maxWidth =
            700;

    }


    if(
        folder ===
        "banners"
    ){

        maxWidth =
            1800;

    }


    if(
        folder ===
        "backgrounds"
    ){

        maxWidth =
            1920;

    }


    const blob =
        await compressImage(
            file,
            maxWidth
        );


    const path =
        currentUser.id
        +
        "/"
        +
        folder
        +
        "/"
        +
        crypto.randomUUID()
        +
        ".webp";


    const {
        error
    } =
    await supabaseClient
        .storage
        .from("profiles")
        .upload(
            path,
            blob,
            {

                contentType:
                    "image/webp",

                cacheControl:
                    "31536000",

                upsert:false

            }
        );


    if(error)
        throw error;


    const {
        data
    } =
    supabaseClient
        .storage
        .from("profiles")
        .getPublicUrl(
            path
        );


    return data.publicUrl;

}


/* =========================
   SAVE
========================= */

$("save")
.addEventListener(
    "click",
    async () => {

        const button =
            $("save");


        button.disabled =
            true;


        button.textContent =
            "SAVING...";


        $("message")
            .textContent =
            "";


        try{

            const newUsername =
                $("username")
                    .value
                    .trim()
                    .toLowerCase();


            const oldUsername =
                (
                    profile.username ||
                    ""
                ).toLowerCase();


            /*
             * USERNAME
