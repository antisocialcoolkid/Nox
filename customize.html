<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --accent:#ffffff;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1000px,92%);
    margin:40px auto;
}

h1{
    margin:0;
    font-size:34px;
    letter-spacing:-1px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:6px;
    margin-bottom:25px;
}

.card{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    background:#070707;
    border:1px solid #292929;
    color:white;
    border-radius:10px;
    outline:none;
    padding:13px;
    margin-bottom:18px;
}

input{
    height:45px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#666;
}

button{
    width:100%;
    height:52px;
    border:0;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:wait;
}

#message{
    min-height:22px;
    text-align:center;
    margin-top:13px;
    font-size:12px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff5555;
}

.status{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    border:1px solid #1e1e1e;
    background:#070707;
}

.status-title{
    color:#555;
    font-size:10px;
    font-weight:bold;
    margin-bottom:10px;
}

.status-item{
    color:#666;
    font-size:11px;
    margin:8px 0;
}

.status-item.ok{
    color:#aaa;
}

.status-item.error{
    color:#ff5555;
}


/* PREVIEW */

.preview{
    overflow:hidden;
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
    margin-bottom:20px;
}

.banner{
    height:180px;
    background:
        linear-gradient(
            135deg,
            #181818,
            #050505
        );
}

.profile{
    text-align:center;
    padding:0 25px 30px;
    margin-top:-55px;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0b0b0b;
}

.name{
    margin-top:12px;
    font-size:24px;
    font-weight:bold;
}

.username{
    color:#666;
    font-size:11px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:12px;
    line-height:1.5;
    margin:15px auto;
    max-width:400px;
}

@media(max-width:600px){

    .container{
        width:94%;
        margin:25px auto;
    }

    h1{
        font-size:28px;
    }

}

</style>

</head>


<body>


<div class="container">


<h1>
    Customize
</h1>

<div class="subtitle">
    Customize your NØX identity.
</div>


<!-- PREVIEW -->

<div class="preview">

    <div
        id="banner"
        class="banner"
    ></div>


    <div class="profile">

        <img
            id="avatar"
            class="avatar"
            alt="Avatar"
        >


        <div
            id="previewName"
            class="name"
        >
            NØX
        </div>


        <div
            id="previewUsername"
            class="username"
        >
            @nox
        </div>


        <div
            id="previewBio"
            class="bio"
        >
            This is my NØX profile.
        </div>

    </div>

</div>


<!-- EDITOR -->

<div class="card">


<label>
    USERNAME
</label>

<input
    id="username"
    type="text"
    maxlength="20"
    autocomplete="off"
>

<div
    id="usernameInfo"
    style="
        color:#555;
        font-size:10px;
        margin-top:-10px;
        margin-bottom:18px;
    "
>
    Username actual.
</div>


<label>
    DISPLAY NAME
</label>

<input
    id="displayName"
    type="text"
    maxlength="30"
>


<label>
    BIO
</label>

<textarea
    id="bio"
    maxlength="160"
></textarea>


<label>
    WEBSITE
</label>

<input
    id="website"
    type="url"
    placeholder="https://example.com"
>


<button
    id="save"
    type="button"
>
    SAVE CHANGES
</button>


<div
    id="message"
></div>


<div class="status">

    <div class="status-title">
        NØX SYSTEM STATUS
    </div>

    <div
        id="statusSupabase"
        class="status-item"
    >
        ⚪ Supabase
    </div>

    <div
        id="statusUser"
        class="status-item"
    >
        ⚪ Usuario
    </div>

    <div
        id="statusProfile"
        class="status-item"
    >
        ⚪ Profile
    </div>

    <div
        id="statusDatabase"
        class="status-item"
    >
        ⚪ Database
    </div>

</div>


</div>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>


<script>

console.log(
    "NØX CUSTOMIZE: JavaScript iniciado"
);


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;
let currentProfile = null;


/* =========================================
   ELEMENTOS
========================================= */

const saveButton =
    document.getElementById("save");

const messageBox =
    document.getElementById("message");


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type=""
){

    messageBox.textContent =
        text;

    messageBox.className =
        type;

}


/* =========================================
   STATUS
========================================= */

function status(
    id,
    ok
){

    const element =
        document.getElementById(id);

    if(!element)
        return;

    element.classList.remove(
        "ok",
        "error"
    );

    element.classList.add(
        ok ? "ok" : "error"
    );

    const clean =
        element.textContent
            .replace(
                "⚪ ",
                ""
            )
            .replace(
                "🟢 ",
                ""
            )
            .replace(
                "🔴 ",
                ""
            );

    element.textContent =
        (ok ? "🟢 " : "🔴 ") +
        clean;

}


/* =========================================
   PREVIEW
========================================= */

function updatePreview(){

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const displayName =
        document
            .getElementById("displayName")
            .value
            .trim();

    const bio =
        document
            .getElementById("bio")
            .value
            .trim();


    document
        .getElementById("previewUsername")
        .textContent =
        "@" +
        (
            username ||
            "nox"
        );


    document
        .getElementById("previewName")
        .textContent =
        displayName ||
        "NØX";


    document
        .getElementById("previewBio")
        .textContent =
        bio ||
        "This is my NØX profile.";

}


/* =========================================
   LOAD USER
========================================= */

async function loadUser(){

    try{

        console.log(
            "NØX: buscando usuario..."
        );


        if(
            typeof supabaseClient ===
            "undefined"
        ){

            throw new Error(
                "supabaseClient no está disponible. Revisa supabase.js."
            );

        }


        status(
            "statusSupabase",
            true
        );


        const result =
            await supabaseClient
                .auth
                .getUser();


        if(result.error){

            throw result.error;

        }


        if(
            !result.data ||
            !result.data.user
        ){

            status(
                "statusUser",
                false
            );

            showMessage(
                "No hay una sesión iniciada.",
                "error"
            );

            return;

        }


        currentUser =
            result.data.user;


        status(
            "statusUser",
            true
        );


        console.log(
            "NØX USER:",
            currentUser.id
        );


        await loadProfile();

    }
    catch(error){

        console.error(
            "NØX LOAD USER ERROR:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

    try{

        console.log(
            "NØX: cargando profile..."
        );


        const result =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


        if(result.error){

            status(
                "statusProfile",
                false
            );

            throw result.error;

        }


        if(!result.data){

            status(
                "statusProfile",
                false
            );

            showMessage(
                "No existe un perfil para este usuario.",
                "error"
            );

            return;

        }


        currentProfile =
            result.data;


        status(
            "statusProfile",
            true
        );


        document
            .getElementById("username")
            .value =
            currentProfile.username ||
            "";


        document
            .getElementById("displayName")
            .value =
            currentProfile.display_name ||
            "NØX";


        document
            .getElementById("bio")
            .value =
            currentProfile.bio ||
            "This is my NØX profile.";


        document
            .getElementById("website")
            .value =
            currentProfile.website_url ||
            "";


        updatePreview();


        console.log(
            "NØX PROFILE:",
            currentProfile
        );

    }
    catch(error){

        console.error(
            "NØX PROFILE ERROR:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================
   INPUTS
========================================= */

document
    .getElementById("username")
    .addEventListener(
        "input",
        function(){

            this.value =
                this.value
                    .toLowerCase()
                    .replace(
                        /[^a-z0-9_]/g,
                        ""
                    );

            updatePreview();

        }
    );


document
    .getElementById("displayName")
    .addEventListener(
        "input",
        updatePreview
    );


document
    .getElementById("bio")
    .addEventListener(
        "input",
        updatePreview
    );


/* =========================================
   SAVE
========================================= */

saveButton.addEventListener(
    "click",
    async function(){

        console.log(
            "NØX: SAVE PRESIONADO"
        );


        try{

            if(!currentUser){

                throw new Error(
                    "No hay una sesión iniciada."
                );

            }


            saveButton.disabled =
                true;


            saveButton.textContent =
                "SAVING...";


            showMessage(
                "Guardando..."
            );


            const displayName =
                document
                    .getElementById(
                        "displayName"
                    )
                    .value
                    .trim();


            const bio =
                document
                    .getElementById(
                        "bio"
                    )
                    .value
                    .trim();


            const website =
                document
                    .getElementById(
                        "website"
                    )
                    .value
                    .trim();


            const updateData = {

                display_name:
                    displayName,

                bio:
                    bio,

                website_url:
                    website

            };


            console.log(
                "NØX UPDATE:",
                updateData
            );


            const result =
                await supabaseClient
                    .from("profiles")
                    .update(
                        updateData
                    )
                    .eq(
                        "id",
                        currentUser.id
                    )
                    .select()
                    .single();


            if(result.error){

                status(
                    "statusDatabase",
                    false
                );

                throw result.error;

            }


            currentProfile =
                result.data;


            status(
                "statusDatabase",
                true
            );


            console.log(
                "NØX GUARDADO:",
                result.data
            );


            showMessage(
                "✓ Cambios guardados correctamente.",
                "success"
            );


        }
        catch(error){

            console.error(
                "NØX SAVE ERROR:",
                error
            );


            showMessage(
                "⚠️ " +
                error.message,
                "error"
            );

        }
        finally{

            saveButton.disabled =
                false;

            saveButton.textContent =
                "SAVE CHANGES";

        }

    }
);


/* =========================================
   START
========================================= */

loadUser();

</script>


</body>

</html>
