<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØX — Customize</title>

<style>
*{box-sizing:border-box}

:root{
    --accent:#ffffff;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
textarea{
    font-family:inherit;
}

.container{
    width:min(1100px,94%);
    margin:35px auto 70px;
}

.header{
    margin-bottom:25px;
}

.title{
    font-size:36px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:6px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 410px;
    gap:20px;
}

.card,
.preview{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
}

.card{
    padding:25px;
}

.section{
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #181818;
}

.section:last-child{
    border-bottom:0;
    margin-bottom:0;
}

.section-title{
    color:#555;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:800;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    background:#070707;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    outline:none;
    padding:12px;
    margin-bottom:16px;
}

input{
    height:46px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#777;
}

.file{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    border:1px dashed #303030;
    border-radius:10px;
    color:#777;
    cursor:pointer;
    margin-bottom:14px;
    transition:.2s;
}

.file:hover{
    color:#fff;
    border-color:#777;
    background:#0e0e0e;
}

.file input{
    display:none;
}

.social-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.social-grid input{
    margin:0;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:60px;
    height:42px;
    padding:3px;
    margin:0;
}

.color-value{
    color:#777;
    font-size:11px;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.save:hover{
    transform:translateY(-1px);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}

.status{
    min-height:20px;
    text-align:center;
    margin:13px 0;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff5555;
}

.profile-tools{
    margin-top:15px;
}

.tool{
    width:100%;
    height:46px;
    margin-top:9px;
    border:1px solid #292929;
    border-radius:10px;
    background:#080808;
    color:#fff;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.tool:hover{
    border-color:#666;
    background:#111;
}

.profile-result{
    display:none;
    margin-top:12px;
}

.profile-result input{
    margin:0;
}

.preview{
    position:sticky;
    top:20px;
    height:max-content;
    overflow:hidden;
    background-size:cover;
    background-position:center;
}

.banner{
    height:190px;
    position:relative;
    background:
        radial-gradient(
            circle at 50% 0%,
            #292929,
            #070707 65%
        );
    background-size:cover;
    background-position:center;
}

.banner:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 20%,
        #0b0b0b
    );
}

.profile{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 25px 30px;
    margin-top:-62px;
}

.avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0b0b0b;
}

.name{
    margin-top:12px;
    font-size:25px;
    font-weight:900;
}

.username{
    color:#666;
    font-size:11px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:12px;
    line-height:1.5;
    margin:15px auto;
    max-width:330px;
}

.website{
    display:none;
    color:var(--accent);
    font-size:11px;
    text-decoration:none;
}

.socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
}

.social{
    display:none;
    padding:8px 10px;
    border:1px solid #292929;
    border-radius:8px;
    color:#888;
    text-decoration:none;
    font-size:10px;
}

.social:hover{
    color:var(--accent);
    border-color:var(--accent);
}

.badges{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:20px;
}

.badge{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
    font-size:14px;
}

.badge.early{
    color:#fff;
    border-color:#555;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }
}

@media(max-width:550px){

    .social-grid{
        grid-template-columns:1fr;
    }

    .title{
        font-size:30px;
    }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


const SUPABASE_URL =
    "https://qvqhanioapefeyxtbzlp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_hJVj-2VGj2hEXUgc91QY1Q_zGjw9qp1";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const $ = function(id){
    return document.getElementById(id);
};


let currentUser = null;
let avatarUrl = null;
let bannerUrl = null;
let backgroundUrl = null;


/* =========================
   STATUS
========================= */

function showStatus(text,type){

    $("status").textContent = text;

    $("status").className =
        "status " + (type || "");

}


/* =========================
   URL
========================= */

function normalizeUrl(value){

    value = String(value || "").trim();

    if(!value){
        return "";
    }

    if(
        value.indexOf("http://") === 0 ||
        value.indexOf("https://") === 0
    ){
        return value;
    }

    return "https://" + value;
}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const username =
        $("username").value.trim();

    const displayName =
        $("displayName").value.trim();

    const bio =
        $("bio").value.trim();

    const website =
        $("website").value.trim();

    const accent =
        $("accentColor").value;


    $("previewUsername").textContent =
        "@" + (username || "nox");

    $("previewName").textContent =
        displayName || "NØX";

    $("previewBio").textContent =
        bio || "This is my NØX profile.";

    $("colorValue").textContent =
        accent.toUpperCase();

    document.documentElement.style
        .setProperty("--accent",accent);


    if(website){

        $("websitePreview").style.display =
            "inline";

        $("websitePreview").href =
            normalizeUrl(website);

        $("websitePreview").textContent =
            website;

    }else{

        $("websitePreview").style.display =
            "none";

    }


    updateSocial(
        "discord",
        "discordPreview"
    );

    updateSocial(
        "instagram",
        "instagramPreview"
    );

    updateSocial(
        "tiktok",
        "tiktokPreview"
    );

    updateSocial(
        "youtube",
        "youtubePreview"
    );

    updateSocial(
        "github",
        "githubPreview"
    );

    updateSocial(
        "twitter",
        "twitterPreview"
    );
}


/* =========================
   SOCIAL
========================= */

function updateSocial(inputId,outputId){

    const value =
        $(inputId).value.trim();

    const element =
        $(outputId);


    if(!value){

        element.style.display =
            "none";

        element.removeAttribute("href");

        return;
    }


    element.style.display =
        "inline-block";

    element.href =
        normalizeUrl(value);
}


/* =========================
   FILE UPLOAD
========================= */

async function uploadImage(file,folder){

    if(!file){
        return null;
    }


    if(!file.type.startsWith("image/")){

        throw new Error(
            "El archivo debe ser una imagen."
        );
    }


    if(file.size > 10 * 1024 * 1024){

        throw new Error(
            "La imagen supera los 10 MB."
        );
    }


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
        currentUser.id +
        "/" +
        folder +
        "-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2) +
        "." +
        extension;


    const uploadResult =
        await supabaseClient
        .storage
        .from("profiles")
        .upload(
            fileName,
            file,
            {
                cacheControl:"3600",
                upsert:true,
                contentType:file.type
            }
        );


    if(uploadResult.error){

        throw uploadResult.error;
    }


    const publicResult =
        supabaseClient
        .storage
        .from("profiles")
        .getPublicUrl(fileName);


    if(
        !publicResult ||
        !publicResult.data ||
        !publicResult.data.publicUrl
    ){

        throw new Error(
            "No se pudo obtener la URL de la imagen."
        );
    }


    return publicResult.data.publicUrl;
}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

    try{

        const result =
            await supabaseClient
            .auth
            .getUser();


        if(result.error){

            throw result.error;
        }


        if(!result.data.user){

            showStatus(
                "No hay una sesión iniciada.",
                "error"
            );

            return;
        }


        currentUser =
            result.data.user;


        await loadProfile();

    }catch(error){

        console.error(
            "NØX:",
            error
        );

        showStatus(
            "⚠️ " + error.message,
            "error"
        );
    }
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    const result =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(result.error){

        throw result.error;
    }


    if(!result.data){

        showStatus(
            "No existe tu perfil.",
            "error"
        );

        return;
    }


    const profile =
        result.data;


    $("username").value =
        profile.username || "";

    $("displayName").value =
        profile.display_name || "NØX"
