<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ffffff;
}

body{
    min-height:100vh;
    background:#030303;
    color:white;
    font-family:Inter,Arial,sans-serif;
    padding:25px;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}

.container{
    position:relative;
    width:min(1100px,100%);
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.back{
    color:#666;
    text-decoration:none;
    font-size:12px;
}

.back:hover{
    color:white;
}

.title{
    font-size:30px;
    font-weight:800;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:5px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 430px;
    gap:20px;
}

.panel{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border:1px solid #202020;
    border-radius:20px;
    padding:22px;
    backdrop-filter:blur(20px);
}

.section{
    margin-bottom:25px;
}

.section:last-child{
    margin-bottom:0;
}

.section-title{
    color:#777;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:14px;
}

.field{
    margin-bottom:15px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #252525;
    outline:none;
    border-radius:10px;
    background:#080808;
    color:white;
    padding:12px;
    font-family:inherit;
    transition:.2s;
}

input{
    height:45px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

select{
    height:45px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#555;
}

.username-status{
    margin-top:6px;
    color:#555;
    font-size:10px;
}

.file{
    padding:15px;
    border:1px dashed #292929;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    color:#777;
    font-size:11px;
    transition:.2s;
}

.file:hover{
    border-color:#555;
    color:white;
}

.file input{
    display:none;
}

.color-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.color-row input{
    width:55px;
    padding:3px;
}

.toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #171717;
}

.toggle:last-child{
    border-bottom:0;
}

.toggle span{
    color:#aaa;
    font-size:12px;
}

.toggle input{
    width:40px;
    height:20px;
}

.save{
    width:100%;
    height:50px;
    border:0;
    border-radius:11px;
    background:white;
    color:black;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.save:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(255,255,255,.08);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
}

.message{
    min-height:18px;
    text-align:center;
    margin-top:13px;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff6666;
}


/* PREVIEW */

.preview{
    position:sticky;
    top:20px;
    height:fit-content;
    overflow:hidden;
    border:1px solid #222;
    border-radius:22px;
    background:#080808;
}

.preview-banner{
    height:160px;
    background:
        linear-gradient(
            135deg,
            #171717,
            #050505
        );

    background-size:cover;
    background-position:center;

    position:relative;
}

.preview-banner::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #080808
        );
}

.preview-content{
    position:relative;
    margin-top:-55px;
    padding:0 25px 25px;
    text-align:center;
    z-index:2;
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #080808;
}

.preview-name{
    margin-top:15px;
    font-size:23px;
    font-weight:800;
}

.preview-username{
    color:#666;
    font-size:11px;
    margin-top:4px;
}

.preview-bio{
    margin:15px auto;
    color:#aaa;
    font-size:12px;
    line-height:1.5;
    max-width:330px;
}

.preview-link{
    color:var(--accent);
    font-size:11px;
    text-decoration:none;
}

.badges{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:15px;
}

.badge{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:8px;
    background:#101010;
    font-size:12px;
}

.preview.glow{
    box-shadow:
        0 0 80px
        color-mix(
            in srgb,
            var(--accent) 12%,
            transparent
        );
}

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.dot{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--accent);
    opacity:.5;
    animation:float 6s infinite ease-in-out;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
        opacity:.15;
    }

    50%{
        transform:translateY(-30px);
        opacity:.7;
    }

}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }

}

</style>

</head>


<body>


<div class="container">


<div class="top">

<div>

<div class="title">
Customize
</div>

<div class="subtitle">
Customize your NØX identity.
</div>

</div>

<a
    href="dashboard.html"
    class="back"
>
← BACK
</a>

</div>


<div class="layout">


<!-- EDITOR -->

<div class="panel">


<div class="section">

<div class="section-title">
IDENTITY
</div>


<div class="field">

<label>
USERNAME
</label>

<input
    id="username"
    maxlength="20"
>

<div
    id="usernameStatus"
    class="username-status"
>
Loading...
</div>

</div>


<div class="field">

<label>
DISPLAY NAME
</label>

<input
    id="displayName"
    maxlength="30"
>

</div>


<div class="field">

<label>
BIO
</label>

<textarea
    id="bio"
    maxlength="160"
    placeholder="Tell people about yourself..."
></textarea>

</div>

</div>


<div class="section">

<div class="section-title">
VISUALS
</div>


<div class="field">

<label>
AVATAR
</label>

<label class="file">

Choose image

<input
    id="avatarFile"
    type="file"
    accept="image/*"
>

</label>

</div>


<div class="field">

<label>
BANNER
</label>

<label class="file">

Choose image

<input
    id="bannerFile"
    type="file"
    accept="image/*"
>

</label>

</div>


<div class="field">

<label>
BACKGROUND
</label>

<label class="file">

Choose image

<input
    id="backgroundFile"
    type="file"
    accept="image/*"
>

</label>

</div>


<div class="field">

<label>
ACCENT COLOR
</label>

<div class="color-row">

<input
    id="accentColor"
    type="color"
    value="#ffffff"
>

</div>

</div>


<div class="field">

<label>
PROFILE EFFECT
</label>

<select id="profileEffect">

<option value="none">
None
</option>

<option value="glow">
Glow
</option>

<option value="floating">
Floating
</option>

<option value="particles">
Particles
</option>

</select>

</div>

</div>


<div class="section">

<div class="section-title">
EFFECTS
</div>


<div class="toggle">

<span>
Glow
</span>

<input
    id="glow"
    type="checkbox"
    checked
>

</div>


<div class="toggle">

<span>
Blur
</span>

<input
    id="blur"
    type="checkbox"
    checked
>

</div>


<div class="toggle">

<span>
Particles
</span>

<input
    id="particles"
    type="checkbox"
>

</div>

</div>


<div class="section">

<div class="section-title">
SOCIAL
</div>


<div class="field">

<label>
WEBSITE
</label>

<input
    id="website"
    type="url"
    placeholder="https://..."
>

</div>

</div>


<button
    id="saveButton"
    class="save"
>
SAVE CHANGES
</button>


<div
    id="message"
    class="message"
></div>


</div>


<!-- PREVIEW -->

<div
    id="preview"
    class="preview"
>


<div
    id="previewBanner"
    class="preview-banner"
>


<div
    id="particlesContainer"
    class="particles"
></div>


</div>


<div class="preview-content">


<img
    id="previewAvatar"
    class="avatar"
    src=""
    alt=""
>


<div
    id="previewName"
    class="preview-name"
>
NØX
</div>


<div
    id="previewUsername"
    class="preview-username"
>
@nox
</div>


<div
    id="previewBio"
    class="preview-bio"
>
This is my NØX profile.
</div>


<a
    id="previewWebsite"
    class="preview-link"
    style="display:none"
></a>


<div class="badges">

<div class="badge">
✓
</div>

<div class="badge">
◆
</div>

<div class="badge">
⚡
</div>

</div>


</div>

</div>


</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let user = null;
let profile = null;


/* ELEMENTS */

const username =
document.getElementById("username");

const displayName =
document.getElementById("displayName");

const bio =
document.getElementById("bio");

const website =
document.getElementById("website");

const accentColor =
document.getElementById("accentColor");

const profileEffect =
document.getElementById("profileEffect");

const glow =
document.getElementById("glow");

const blur =
document.getElementById("blur");

const particles =
document.getElementById("particles");

const saveButton =
document.getElementById("saveButton");

const message =
document.getElementById("message");

const preview =
document.getElementById("preview");

const previewAvatar =
document.getElementById("previewAvatar");

const previewBanner =
document.getElementById("previewBanner");

const previewName =
document.getElementById("previewName");

const previewUsername =
document.getElementById("previewUsername");

const previewBio =
document.getElementById("previewBio");

const previewWebsite =
document.getElementById("previewWebsite");

const particlesContainer =
document.getElementById(
    "particlesContainer"
);


/* MESSAGE */

function showMessage(
    text,
    type=""
){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* LOAD USER */

async function start(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error)
        throw error;


    if(!data.user){

        location.href =
            "login.html";

        return;

    }


    user =
        data.user;


    await loadProfile();

}


/* LOAD PROFILE */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            user.id
        )
        .single();


    if(error)
        throw error;


    profile =
        data;


    username.value =
        profile.username || "";


    displayName.value =
        profile.display_name || "";


    bio.value =
        profile.bio || "";


    website.value =
        profile.website_url || "";


    accentColor.value =
        profile.accent_color ||
        "#ffffff";


    profileEffect.value =
        profile.profile_effect ||
        "none";


    glow.checked =
        profile.glow_enabled ??
        true;


    blur.checked =
        profile.blur_enabled ??
        true;


    particles.checked =
        profile.particles_enabled ??
        false;


    updatePreview();

    updateUsernameStatus();

}


/* USERNAME */

function updateUsernameStatus(){

    const original =
        (
            profile.username ||
            ""
        ).toLowerCase();


    const current =
        username.value
            .trim()
            .toLowerCase();


    if(current === original){

        usernameStatus.textContent =
            "Username actual.";

        return;

    }


    if(!profile.username_changed_at){

        usernameStatus.textContent =
            "Puedes cambiar tu username ahora. Después tendrás que esperar 7 días.";

        return;

    }


    const next =
        new Date(
            new Date(
                profile.username_changed_at
            ).getTime()
            +
            7 * 86400000
        );


    if(Date.now() >= next.getTime()){

        usernameStatus.textContent =
            "Puedes cambiar tu username. Después tendrás que esperar 7 días.";

    }else{

        const days =
            Math.ceil(
                (
                    next.getTime()
                    -
                    Date.now()
                )
                /
                86400000
            );


        usernameStatus.textContent =
            `🔒 Username bloqueado. Podrás cambiarlo en ${days} día(s).`;

    }

}


/* PREVIEW */

function updatePreview(){

    previewName.textContent =
        displayName.value ||
        "NØX";


    previewUsername.textContent =
        "@" +
        (
            username.value ||
            "nox"
        );


    previewBio.textContent =
        bio.value ||
        "This is my NØX profile.";


    document.documentElement
        .style
        .setProperty(
            "--accent",
            accentColor.value
        );


    if(profile.avatar_url){

        previewAvatar.src =
            profile.avatar_url;

    }


    if(profile.banner_url){

        previewBanner.style.backgroundImage =
            `url("${profile.banner_url}")`;

    }


    if(profile.background_url){

        preview.style.backgroundImage =
            `url("${profile.background_url}")`;

    }


    if(website.value){

        previewWebsite.style.display =
            "inline-block";

        previewWebsite.href =
            website.value;

        previewWebsite.textContent =
            website.value;

    }else{

        previewWebsite.style.display =
            "none";

    }


    preview.classList.toggle(
        "glow",
        glow.checked
    );


    particlesContainer.innerHTML =
        "";


    if(
        particles.checked ||
        profileEffect.value ===
        "particles"
    ){

        for(
            let i = 0;
            i < 25;
            i++
        ){

            const dot =
                document.createElement(
                    "div"
                );

            dot.className =
                "dot";

            dot.style.left =
                Math.random() * 100 +
                "%";

            dot.style.top =
                Math.random() * 100 +
                "%";

            dot.style.animationDelay =
                Math.random() * 5 +
                "s";

            particlesContainer
                .appendChild(dot);

        }

    }

}


/* FILE UPLOAD */

async function uploadFile(
    file,
    folder
){

    if(!file)
        return null;


    const extension =
        file.name
            .split(".")
            .pop();


    const path =
        `${user.id}/${Date.now()}.${extension}`;


    const {
        error
    } =
    await supabaseClient
        .storage
        .from("profiles")
        .upload(
            `${folder}/${path}`,
            file,
            {
                upsert:true
            }
        );


    if(error)
        throw error;


    const {
        data
    } =
    supabaseClient
        .storage
        .from("profiles")
        .getPublicUrl(
            `${folder}/${path}`
        );


    return data.publicUrl;

}


/* SAVE */

saveButton.addEventListener(
    "click",
    async () => {

        saveButton.disabled =
            true;

        saveButton.textContent =
            "SAVING...";

        showMessage("");


        try{

            const newUsername =
                username.value
                    .trim()
                    .toLowerCase();


            /*
            USERNAME
            */

            if(
                newUsername !==
                (
                    profile.username ||
                    ""
                ).toLowerCase()
            ){

                const {
                    error
                } =
                await supabaseClient
                    .rpc(
                        "change_username",
                        {
                            new_username:
                                newUsername
                        }
                    );


                if(error)
                    throw error;

            }


            /*
            IMÁGENES
            */

            let avatarUrl =
                profile.avatar_url || "";


            let bannerUrl =
                profile.banner_url || "";


            let backgroundUrl =
                profile.background_url || "";


            const avatarFile =
                document.getElementById(
                    "avatarFile"
                ).files[0];


            const bannerFile =
                document.getElementById(
                    "bannerFile"
                ).files[0];


            const backgroundFile =
                document.getElementById(
                    "backgroundFile"
                ).files[0];


            if(avatarFile){

                avatarUrl =
                    await uploadFile(
                        avatarFile,
                        "avatars"
                    );

            }


            if(bannerFile){

                bannerUrl =
                    await uploadFile(
                        bannerFile,
                        "banners"
                    );

            }


            if(backgroundFile){

                backgroundUrl =
                    await uploadFile(
                        backgroundFile,
                        "backgrounds"
                    );

            }


            /*
            UPDATE
            */

            const {
                data,
                error
            } =
            await supabaseClient
                .from("profiles")
                .update({

                    display_name:
                        displayName.value
                            .trim(),

                    bio:
                        bio.value
                            .trim(),

                    website_url:
                        website.value
                            .trim(),

                    avatar_url:
                        avatarUrl,

                    banner_url:
                        bannerUrl,

                    background_url:
                        backgroundUrl,

                    accent_color:
                        accentColor.value,

                    profile_effect:
                        profileEffect.value,

                    blur_enabled:
                        blur.checked,

                    glow_enabled:
                        glow.checked,

                    particles_enabled:
                        particles.checked,

                    updated_at:
                        new Date()
                            .toISOString()

                })
                .eq(
                    "id",
                    user.id
                )
                .select()
                .single();


            if(error)
                throw error;


            profile =
                data;


            updatePreview();

            updateUsernameStatus
