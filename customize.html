<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ffffff;
    --bg:#050505;
    --panel:#0b0b0b;
    --border:#252525;
    --muted:#707070;
}

html{
    background:#050505;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(255,255,255,.09),
            transparent 38%
        ),
        #050505;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    padding:22px;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

.container{
    width:min(1180px,100%);
    margin:auto;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.title{
    font-size:30px;
    font-weight:800;
    letter-spacing:-1.5px;
}

.subtitle{
    margin-top:5px;
    color:#666;
    font-size:12px;
}

.back{
    color:#666;
    text-decoration:none;
    font-size:11px;
}

.back:hover{
    color:#fff;
}

/* LAYOUT */

.grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) 430px;
    gap:20px;
}

.panel,
.preview{
    border:1px solid var(--border);
    border-radius:22px;
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(25px);
}

.panel{
    padding:25px;
}

.section{
    margin-bottom:30px;
}

.section-title{
    color:#777;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:15px;
}

/* INPUTS */

.field{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#777;
    font-size:10px;
    font-weight:700;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #252525;
    border-radius:11px;
    outline:none;
    background:#070707;
    color:#fff;
    padding:12px;
    transition:.2s;
}

input{
    height:46px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#555;
}

.username-info{
    margin-top:7px;
    color:#555;
    font-size:10px;
    line-height:1.5;
}

/* FILE */

.file{
    display:block;
    padding:18px;
    border:1px dashed #303030;
    border-radius:12px;
    text-align:center;
    color:#777;
    cursor:pointer;
    transition:.25s;
}

.file:hover{
    color:#fff;
    border-color:#666;
    background:#0b0b0b;
}

.file input{
    display:none;
}

/* COLOR */

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:58px;
    height:42px;
    padding:3px;
}

.color-value{
    color:#777;
    font-size:11px;
}

/* SAVE */

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.save:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 45px rgba(255,255,255,.12);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}

/* MESSAGE */

.message{
    min-height:22px;
    margin-top:14px;
    padding:0 4px;
    text-align:center;
    font-size:11px;
    line-height:1.5;
}

.success{
    color:#aaa;
}

.error{
    color:#ff6868;
}

/* DIAGNOSTIC */

.diagnostic{
    margin-top:20px;
    padding:15px;
    border:1px solid #1f1f1f;
    border-radius:13px;
    background:#070707;
}

.diagnostic-title{
    margin-bottom:10px;
    color:#666;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.3px;
}

.diag-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin:7px 0;
    color:#777;
    font-size:10px;
}

.diag-dot{
    width:7px;
    height:7px;
    flex:none;
    border-radius:50%;
    background:#333;
}

.diag-row.ok{
    color:#aaa;
}

.diag-row.ok .diag-dot{
    background:#aaa;
}

.diag-row.bad{
    color:#ff6868;
}

.diag-row.bad .diag-dot{
    background:#ff6868;
}

/* PREVIEW */

.preview{
    position:sticky;
    top:20px;
    overflow:hidden;
    background-color:#080808;
    background-size:cover;
    background-position:center;
    transition:.35s;
}

.banner{
    position:relative;
    height:190px;
    background:
        linear-gradient(
            135deg,
            #191919,
            #050505
        );
    background-size:cover;
    background-position:center;
}

.banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent,
        #080808
    );
}

.particles{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:3;
}

.dot{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--accent);
    opacity:.45;
    animation:particle 6s ease-in-out infinite;
}

@keyframes particle{

    0%,100%{
        transform:translateY(0);
        opacity:.1;
    }

    50%{
        transform:translateY(-35px);
        opacity:.8;
    }

}

.preview-content{
    position:relative;
    z-index:4;
    margin-top:-58px;
    padding:0 25px 30px;
    text-align:center;
}

.avatar{
    width:110px;
    height:110px;
    object-fit:cover;
    border:4px solid #080808;
    border-radius:50%;
    background:#111;
}

.preview-name{
    margin-top:14px;
    font-size:23px;
    font-weight:800;
}

.preview-username{
    margin-top:4px;
    color:#666;
    font-size:11px;
}

.preview-bio{
    max-width:340px;
    margin:15px auto;
    color:#aaa;
    font-size:12px;
    line-height:1.5;
}

.preview-website{
    display:none;
    color:var(--accent);
    text-decoration:none;
    font-size:11px;
}

/* BADGES */

.badges-title{
    margin-top:22px;
    margin-bottom:10px;
    color:#555;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.4px;
}

.badges{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.badge{
    position:relative;
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    background:#101010;
    color:#555;
    font-size:13px;
}

.badge.locked{
    opacity:.38;
    filter:grayscale(1);
}

.badge::after{
    content:"LOCKED";
    position:absolute;
    bottom:-16px;
    font-size:6px;
    color:#444;
    letter-spacing:.5px;
}

.floating{
    animation:floating 4s ease-in-out infinite;
}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}

@media(max-width:850px){

    body{
        padding:14px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }

}

</style>

</head>

<script>

/* =====================================================
   NØX CUSTOMIZE SYSTEM
===================================================== */

let currentUser = null;
let profile = null;

const $ =
    id => document.getElementById(id);


/* =====================================================
   DIAGNÓSTICO
===================================================== */

function diag(id,ok){

    const element =
        $(id);

    if(!element)
        return;

    element.classList.remove(
        "ok",
        "bad"
    );

    element.classList.add(
        ok ? "ok" : "bad"
    );

}


/* =====================================================
   MENSAJE
===================================================== */

function showMessage(
    text,
    type=""
){

    $("message").textContent =
        text;

    $("message").className =
        "message " +
        type;

}


/* =====================================================
   INICIO
===================================================== */

async function init(){

    try{

        if(
            typeof supabaseClient ===
            "undefined"
        ){

            diag(
                "diagSupabase",
                false
            );

            throw new Error(
                "supabaseClient no existe. Revisa supabase.js."
            );

        }


        diag(
            "diagSupabase",
            true
        );


        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(error)
            throw error;


        if(
            !data ||
            !data.user
        ){

            diag(
                "diagAuth",
                false
            );

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            data.user;


        diag(
            "diagAuth",
            true
        );


        await loadProfile();

    }

    catch(error){

        console.error(
            "NØX INIT ERROR:",
            error
        );


        showMessage(
            "⚠️ " +
            (
                error.message ||
                "No se pudo iniciar."
            ),
            "error"
        );

    }

}


/* =====================================================
   CARGAR PERFIL
===================================================== */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(error){

        diag(
            "diagProfile",
            false
        );

        throw error;

    }


    if(!data){

        diag(
            "diagProfile",
            false
        );

        throw new Error(
            "No existe un registro en profiles para tu usuario."
        );

    }


    profile =
        data;


    diag(
        "diagProfile",
        true
    );


    $("username").value =
        profile.username ||
        "nox";


    $("displayName").value =
        profile.display_name ||
        "NØX";


    $("bio").value =
        profile.bio ||
        "This is my NØX profile.";


    $("website").value =
        profile.website_url ||
        "";


    $("accentColor").value =
        profile.accent_color ||
        "#ffffff";


    $("profileEffect").value =
        profile.profile_effect ||
        "none";


    if(profile.avatar_url){

        $("avatar").src =
            profile.avatar_url;

    }


    if(profile.banner_url){

        $("banner")
            .style
            .backgroundImage =
            `url("${profile.banner_url}")`;

    }


    if(profile.background_url){

        $("preview")
            .style
            .backgroundImage =
            `url("${profile.background_url}")`;

    }


    updatePreview();
    updateUsernameInfo();

}


/* =====================================================
   USERNAME
===================================================== */

function updateUsernameInfo(){

    if(!profile)
        return;


    const oldUsername =
        (
            profile.username ||
            ""
        )
        .toLowerCase();


    const newUsername =
        $("username")
            .value
            .trim()
            .toLowerCase();


    if(
        oldUsername ===
        newUsername
    ){

        $("usernameInfo")
            .textContent =
            "Username actual.";

        return;

    }


    if(
        !profile.username_changed_at
    ){

        $("usernameInfo")
            .textContent =
            "✓ Puedes cambiarlo. Después tendrás que esperar 7 días.";

        return;

    }


    const changed =
        new Date(
            profile.username_changed_at
        )
        .getTime();


    const next =
        changed +
        7 *
        24 *
        60 *
        60 *
        1000;


    const remaining =
        next -
        Date.now();


    if(
        remaining <= 0
    ){

        $("usernameInfo")
            .textContent =
            "✓ Ya puedes cambiar tu username.";

        return;

    }


    const days =
        Math.ceil(
            remaining /
            (
                24 *
                60 *
                60 *
                1000
            )
        );


    $("usernameInfo")
        .textContent =
        `🔒 Podrás cambiarlo en ${days} día(s).`;

}


/* =====================================================
   PREVIEW
===================================================== */

function updatePreview(){

    const username =
        $("username")
            .value
            .trim();


    const displayName =
        $("displayName")
            .value
            .trim();


    const bio =
        $("bio")
            .value
            .trim();


    $("previewUsername")
        .textContent =
        "@" +
        (
            username ||
            "nox"
        );


    $("previewName")
        .textContent =
        displayName ||
        "NØX";


    $("previewBio")
        .textContent =
        bio ||
        "This is my NØX profile.";


    const color =
        $("accentColor")
            .value;


    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );


    $("colorValue")
        .textContent =
        color.toUpperCase();


    const website =
        $("website")
            .value
            .trim();


    if(website){

        $("previewWebsite")
            .style
            .display =
            "inline";

        $("previewWebsite")
            .href =
            website;

        $("previewWebsite")
            .textContent =
            website;

    }

    else{

        $("previewWebsite")
            .style
            .display =
            "none";

    }


    $("preview")
        .classList.toggle(
            "floating",
            $("profileEffect")
                .value ===
            "floating"
        );


    createParticles();

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(){

    const container =
        $("particles");


    container.innerHTML =
        "";


    if(
        $("profileEffect")
            .value !==
        "particles"
    )
        return;


    for(
        let i=0;
        i<35;
        i++
    ){

        const dot =
            document.createElement(
                "div"
            );


        dot.className =
            "dot";


        dot.style.left =
            Math.random() *
            100 +
            "%";


        dot.style.top =
            Math.random() *
            100 +
            "%";


        dot.style.animationDelay =
            Math.random() *
            5 +
            "s";


        container
            .appendChild(dot);

    }

}


/* =====================================================
   UPLOAD
===================================================== */

async function uploadImage(
    file,
    folder
){

    if(!file)
        return null;


    if(
        file.size >
        15 *
        1024 *
        1024
    ){

        throw new Error(
            "La imagen supera los 15 MB."
        );

    }


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const path =
        currentUser.id +
        "/" +
        folder +
        "/" +
        crypto.randomUUID() +
        "." +
        extension;


    const {
        error
    } =
    await supabaseClient
        .storage
        .from("profiles")
        .upload(
            path,
            file,
            {
                upsert:false
            }
        );


    if(error)
        throw er
