<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ffffff;
}

html{
    background:#030303;
}

body{
    min-height:100vh;
    background:#030303;
    color:white;
    font-family:Inter,Arial,sans-serif;
    padding:25px;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}

.container{
    position:relative;
    width:min(1100px,100%);
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.back{
    color:#666;
    text-decoration:none;
    font-size:12px;
    transition:.2s;
}

.back:hover{
    color:white;
}

.title{
    font-size:30px;
    font-weight:800;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:5px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 430px;
    gap:20px;
}

.panel{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    border:1px solid #202020;
    border-radius:20px;
    padding:22px;
    backdrop-filter:blur(20px);
}

.section{
    margin-bottom:27px;
}

.section:last-child{
    margin-bottom:0;
}

.section-title{
    color:#777;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:14px;
}

.field{
    margin-bottom:16px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #252525;
    outline:none;
    border-radius:10px;
    background:#080808;
    color:white;
    padding:12px;
    font-family:inherit;
    transition:.2s;
}

input{
    height:45px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

select{
    height:45px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#555;
}

input::placeholder,
textarea::placeholder{
    color:#444;
}

.username-status{
    margin-top:7px;
    color:#555;
    font-size:10px;
    line-height:1.5;
}

.file{
    padding:17px;
    border:1px dashed #292929;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    color:#777;
    font-size:11px;
    transition:.2s;
}

.file:hover{
    border-color:#555;
    color:white;
    background:#0b0b0b;
}

.file input{
    display:none;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:55px;
    padding:3px;
}

.color-value{
    color:#666;
    font-size:11px;
}

.toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 0;
    border-bottom:1px solid #171717;
}

.toggle:last-child{
    border-bottom:0;
}

.toggle span{
    color:#aaa;
    font-size:12px;
}

.toggle input{
    width:40px;
    height:20px;
}

.save{
    width:100%;
    height:50px;
    border:0;
    border-radius:11px;
    background:white;
    color:black;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.save:hover{
    transform:translateY(-2px);
    box-shadow:
        0 15px 40px
        rgba(255,255,255,.08);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}

.message{
    min-height:18px;
    text-align:center;
    margin-top:13px;
    font-size:11px;
    line-height:1.5;
}

.success{
    color:#aaa;
}

.error{
    color:#ff6666;
}


/* PREVIEW */

.preview{
    position:sticky;
    top:20px;
    height:fit-content;
    overflow:hidden;

    border:1px solid #222;
    border-radius:22px;

    background:#080808;

    transition:
        .4s ease;

}

.preview.glow{
    box-shadow:
        0 0 80px
        color-mix(
            in srgb,
            var(--accent) 14%,
            transparent
        );
}

.preview-banner{

    height:165px;

    background:
        linear-gradient(
            135deg,
            #171717,
            #050505
        );

    background-size:cover;
    background-position:center;

    position:relative;

    overflow:hidden;

}

.preview-banner::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #080808
        );

}

.preview-content{

    position:relative;

    margin-top:-55px;

    padding:
        0 25px 28px;

    text-align:center;

    z-index:2;

}

.avatar{

    width:100px;
    height:100px;

    border-radius:50%;

    object-fit:cover;

    background:#111;

    border:
        4px solid
        #080808;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.5);

}

.preview-name{

    margin-top:15px;

    font-size:23px;

    font-weight:800;

    letter-spacing:-.5px;

}

.preview-username{

    color:#666;

    font-size:11px;

    margin-top:4px;

}

.preview-bio{

    margin:
        15px auto;

    color:#aaa;

    font-size:12px;

    line-height:1.5;

    max-width:330px;

    white-space:pre-wrap;

}

.preview-link{

    color:var(--accent);

    font-size:11px;

    text-decoration:none;

}

.preview-link:hover{
    text-decoration:underline;
}

.badges{

    display:flex;

    justify-content:center;

    gap:7px;

    margin-top:16px;

}

.badge{

    width:28px;

    height:28px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        #292929;

    border-radius:8px;

    background:#101010;

    font-size:12px;

}


/* PARTICLES */

.particles{

    position:absolute;

    inset:0;

    pointer-events:none;

    overflow:hidden;

}

.dot{

    position:absolute;

    width:3px;

    height:3px;

    border-radius:50%;

    background:var(--accent);

    opacity:.5;

    animation:
        float 6s
        infinite
        ease-in-out;

}

@keyframes float{

    0%,100%{
        transform:
            translateY(0)
            scale(1);
        opacity:.15;
    }

    50%{
        transform:
            translateY(-35px)
            scale(1.4);
        opacity:.7;
    }

}


/* FLOATING */

.preview.floating .preview-content{

    animation:
        floating 4s
        infinite
        ease-in-out;

}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}


/* MOBILE */

@media(max-width:850px){

    body{
        padding:16px;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }

}

</style>

</head>


<body>


<div class="container">


<div class="top">

<div>

<div class="title">
Customize
</div>

<div class="subtitle">
Customize your NØX identity.
</div>

</div>

<a
    href="dashboard.html"

>
← BACK

</div>


<div class="layout">


<!-- EDITOR -->

<div class="panel">

IDENTITY

USERNAME
</label>

DISPLAY NAME

<div class="field">

BIO

<textarea
    id="bio"

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


let user = null;

let profile = null;


/* ELEMENTS */

const username =
document.getElementById(
    "username"
);

const displayName =
document.getElementById(
    "displayName"
);

const bio =
document.getElementById(
    "bio"
);

const website =
document.getElementById(
    "website"
);

const accentColor =
document.getElementById(
    "accentColor"
);

const colorValue =
document.getElementById(
    "colorValue"
);

const profileEffect =
document.getElementById(
    "profileEffect"
);

const glow =
document.getElementById(
    "glow"
);

const blur =
document.getElementById(
    "blur"
);

const particles =
document.getElementById(
    "particles"
);

const saveButton =
document.getElementById(
    "saveButton"
);

const message =
document.getElementById(
    "message"
);

const preview =
document.getElementById(
    "preview"
);

const previewAvatar =
document.getElementById(
    "previewAvatar"
);

const previewBanner =
document.getElementById(
    "previewBanner"
);

const previewName =
document.getElementById(
    "previewName"
);

const previewUsername =
document.getElementById(
    "previewUsername"
);

const previewBio =
document.getElementById(
    "previewBio"
);

const previewWebsite =
document.getElementById(
    "previewWebsite"
);

const particlesContainer =
document.getElementById(
    "particlesContainer"
);

const usernameStatus =
document.getElementById(
    "usernameStatus"
);


/* MESSAGE */

function showMessage(
    text,
    type=""
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* AUTH */

async function start(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error)
        throw error;


    if(!data.user){

        window.location.href =
            "login.html";

        return;

    }


    user =
        data.user;


    await loadProfile();

}


/* PROFILE */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            user.id
        )
        .single();


    if(error)
        throw error;


    profile =
        data;


    username.value =
        profile.username ||
        "";


    displayName.value =
        profile.display_name ||
        "";


    bio.value =
        profile.bio ||
        "";


    website.value =
        profile.website_url ||
        "";


    accentColor.value =
        profile.accent_color ||
        "#ffffff";


    profileEffect.value =
        profile.profile_effect ||
        "none";


    glow.checked =
        profile.glow_enabled ??
        true;


    blur.checked =
        profile.blur_enabled ??
        true;


    particles.checked =
        profile.particles_enabled ??
        false;


    updatePreview();

    updateUsernameStatus();

}


/* USERNAME STATUS */

function updateUsernameStatus(){

    const original =
        (
            profile.username ||
            ""
        ).toLowerCase();


    const current =
        username.value
            .trim()
            .toLowerCase();


    if(current === original){

        usernameStatus.textContent =
            "Username actual.";

        username.style.borderColor =
            "#252525";

        return;

    }


    if(!profile.username_changed_at){

        usernameStatus.textContent =
            "Puedes cambiarlo ahora. Después tendrás que esperar 7 días.";

        username.style.borderColor =
            "#555";

        return;

    }


    const nextChange =
        new Date(
            new Date(
                profile.username_changed_at
            ).getTime()
            +
            7 * 24 * 60 * 60 * 1000
        );


    const remaining =
        nextChange.getTime()
        -
        Date.now();


    if(remaining <= 0){

        usernameStatus.textContent =
            "✓ Puedes cambiar tu username ahora.";

        username.style.borderColor =
            "#555";

        return;

    }


    const days =
        Math.ceil(
            remaining /
            (
                24 *
                60 *
                60 *
                1000
            )
        );


    usernameStatus.textContent =
        `🔒 Username bloqueado. Podrás cambiarlo en ${days} día(s).`;

    username.style.borderColor =
        "#3a2020";

}


/* PREVIEW */

function updatePreview(){

    previewName.textContent =
        displayName.value ||
        "NØX";


    previewUsername.textContent =
        "@" +
        (
            username.value ||
            "nox"
        );


    previewBio.textContent =
        bio.value ||
        "This is my NØX profile.";


    document.documentElement
        .style
        .setProperty(
            "--accent",
            accentColor.value
        );


    colorValue.textContent =
        accentColor.value
            .toUpperCase();


    /*
    AVATAR
    */

    if(profile?.avatar_url){

        previewAvatar.src =
            profile.avatar_url;

    }


    /*
    BANNER
    */

    if(profile?.banner_url){

        previewBanner.style.backgroundImage =
            `url("${profile.banner_url}")`;

    }


    /*
    BACKGROUND
    */

    if(profile?.background_url){

        preview.style.backgroundImage =
            `url("${profile.background_url}")`;

    }


    /*
    WEBSITE
    */

    if(
        website.value &&
        website.value.trim()
    ){

        previewWebsite.style.display =
            "inline-block";

        previewWebsite.href =
            website.value.trim();

        previewWebsite.textContent =
            website.value.trim();

    }else{

        previewWebsite.style.display =
            "none";

    }


    /*
    GLOW
    */

    preview.classList.toggle(
        "glow",
        glow.checked
    );


    /*
    FLOATING
    */

    preview.classList.toggle(
        "floating",
        profileEffect.value ===
        "floating"
    );


    /*
    PARTICLES
    */

    particlesContainer.innerHTML =
        "";


    if(
        particles.checked ||
        profileEffect.value ===
        "particles"
    ){

        for(
            let i = 0;
            i < 28;
            i++
        ){

            const dot =
                document.createElement(
                    "div"
                );


            dot.className =
                "dot";


            dot.style.left =
                Math.random() * 100 +
                "%";


            dot.style.top =
                Math.random() * 100 +
                "%";


            dot.style.animationDelay =
                Math.random() * 6 +
                "s";


            particlesContainer
                .appendChild(dot);

        }

    }

}


/* COMPRESS IMAGE */

async function compressImage(
    file,
    maxWidth,
    quality = 0.78
){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
            event => {

                const img =
                    new Image();


                img.onload =
                () => {

                    let width =
                        img.width;


                    let height =
                        img.height;


                    if(
                        width >
                        maxWidth
                    ){

                        const ratio =
                            maxWidth /
                            width;


                        width =
                            Math.round(
                                width *
                                ratio
                            );


                        height =
                            Math.round(
                                height *
                                ratio
                            );

                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        width;


                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    canvas.toBlob(
                        blob => {

                            if(!blob){

                                reject(
                                    new Error(
                                        "No se pudo comprimir la imagen."
                                    )
                                );

                                return;

                            }
