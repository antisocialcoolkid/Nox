<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NØX — Customize</title>

<style>
*{box-sizing:border-box}

:root{
    --accent:#ffffff;
}

html,body{
    margin:0;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.container{
    width:min(1100px,94%);
    margin:35px auto 70px;
}

.header{
    margin-bottom:25px;
}

.title{
    font-size:36px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:6px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 410px;
    gap:20px;
}

.card,
.preview{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
}

.card{
    padding:25px;
}

.section{
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #181818;
}

.section:last-child{
    border-bottom:0;
}

.section-title{
    color:#555;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:800;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    background:#070707;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    outline:none;
    padding:12px;
    margin-bottom:16px;
}

input{
    height:46px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#777;
}

.file{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    border:1px dashed #303030;
    border-radius:10px;
    color:#777;
    cursor:pointer;
    margin-bottom:14px;
}

.file:hover{
    border-color:#777;
    color:#fff;
    background:#0e0e0e;
}

.file input{
    display:none;
}

.social-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.social-grid input{
    margin:0;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:60px;
    height:42px;
    padding:3px;
    margin:0;
}

.color-value{
    color:#777;
    font-size:11px;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-weight:900;
    cursor:pointer;
}

.save:disabled{
    opacity:.5;
    cursor:wait;
}

.message{
    min-height:20px;
    text-align:center;
    margin-top:13px;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff5555;
}

/* PROFILE LINK */

.profile-tools{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #181818;
}

.link-button{
    width:100%;
    height:48px;
    border:1px solid #292929;
    border-radius:10px;
    background:#080808;
    color:#fff;
    cursor:pointer;
    font-weight:800;
    font-size:11px;
}

.link-button:hover{
    border-color:#666;
    background:#111;
}

.link-box{
    display:none;
    margin-top:10px;
}

.link-box input{
    margin-bottom:8px;
}

.preview{
    position:sticky;
    top:20px;
    height:max-content;
    overflow:hidden;
    background-size:cover;
    background-position:center;
}

.banner{
    height:190px;
    position:relative;
    background:
        radial-gradient(
            circle at 50% 0%,
            #292929,
            #070707 65%
        );
    background-size:cover;
    background-position:center;
}

.banner:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 20%,
        #0b0b0b
    );
}

.profile{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 25px 30px;
    margin-top:-62px;
}

.avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0b0b0b;
}

.name{
    margin-top:12px;
    font-size:25px;
    font-weight:900;
}

.username{
    color:#666;
    font-size:11px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:12px;
    line-height:1.5;
    margin:15px auto;
    max-width:330px;
}

.website{
    display:none;
    color:var(--accent);
    font-size:11px;
    text-decoration:none;
}

.socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
}

.social{
    display:none;
    padding:8px 10px;
    border:1px solid #292929;
    border-radius:8px;
    color:#888;
    text-decoration:none;
    font-size:10px;
}

.social:hover{
    color:var(--accent);
    border-color:var(--accent);
}

.badges{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:20px;
}

.badge{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
}

.badge.early{
    color:#fff;
    border-color:#555;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }
}

@media(max-width:550px){

    .social-grid{
        grid-template-columns:1fr;
    }

    .title{
        font-size:30px;
    }
}
</style>
</head>

                    <button

        </div>


        <!-- PREVIEW -->

        <div

    $("message").textContent =

    $("message").className =

/* =========================
   URL
========================= */

function normalizeUrl(value){

    value =
        value.trim();

    if(!value){
        return "";
    }

    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){

        return value;

    }

    return "https://" + value;

}

/* =========================
   SOCIAL PREVIEW
========================= */

function socialPreview(
    inputId,
    outputId
){

    const value =
        $(inputId)
        .value
        .trim();

    const output =
        $(outputId);


    if(!value){

        output.style.display =
            "none";

        output.removeAttribute(
            "href"
        );

        return;

    }


    output.style.display =
        "inline-block";

    output.href =
        normalizeUrl(value);

}

            .auth

    }catch(error){

        console.error(
            "NØX:",
            error
        );

        message(
            error.message,
            "error"
        );

    }

}
