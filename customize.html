<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NØX — Customize</title>

<style>
*{box-sizing:border-box}

:root{--accent:#fff}

body{
margin:0;
min-height:100vh;
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif
}

.container{
width:min(1050px,94%);
margin:35px auto 70px
}

.header{margin-bottom:25px}

.title{
font-size:35px;
font-weight:900;
letter-spacing:-1.5px
}

.subtitle{
color:#666;
font-size:12px;
margin-top:6px
}

.layout{
display:grid;
grid-template-columns:minmax(0,1fr) 400px;
gap:20px
}

.card,.preview{
background:#0b0b0b;
border:1px solid #252525;
border-radius:20px
}

.card{padding:25px}

.section{
padding-bottom:25px;
margin-bottom:25px;
border-bottom:1px solid #181818
}

.section:last-child{
border-bottom:0;
margin-bottom:0
}

.section-title{
color:#555;
font-size:10px;
font-weight:900;
letter-spacing:1.5px;
margin-bottom:16px
}

label{
display:block;
color:#777;
font-size:10px;
font-weight:800;
margin-bottom:7px
}

input,textarea,select{
width:100%;
background:#070707;
color:#fff;
border:1px solid #292929;
border-radius:10px;
outline:none;
padding:12px;
margin-bottom:16px
}

input{height:45px}

textarea{
min-height:95px;
resize:vertical
}

input:focus,
textarea:focus,
select:focus{
border-color:#666
}

.username-info{
color:#555;
font-size:10px;
margin-top:-9px;
margin-bottom:17px
}

.file{
display:flex;
align-items:center;
justify-content:center;
min-height:48px;
padding:12px;
border:1px dashed #303030;
border-radius:10px;
color:#777;
cursor:pointer;
margin-bottom:15px;
transition:.2s
}

.file:hover{
border-color:#777;
color:#fff;
background:#0d0d0d
}

.file input{display:none}

.social-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.social-grid input{margin:0}

.color-row{
display:flex;
align-items:center;
gap:12px
}

.color-row input{
width:60px;
padding:3px;
margin:0
}

.color-value{
color:#777;
font-size:11px
}

.save,.generate{
width:100%;
height:52px;
border-radius:11px;
font-weight:900;
cursor:pointer;
transition:.2s
}

.save{
border:0;
background:#fff;
color:#000
}

.generate{
margin-top:10px;
border:1px solid #292929;
background:#111;
color:#fff
}

.save:hover,.generate:hover{
transform:translateY(-2px)
}

.save:disabled{
opacity:.5;
cursor:wait;
transform:none
}

.message{
min-height:20px;
text-align:center;
margin-top:13px;
font-size:11px
}

.success{color:#aaa}
.error{color:#ff5555}

.profile-link-box{
display:none;
margin-top:18px;
padding-top:18px;
border-top:1px solid #181818
}

.profile-link-row{
display:flex;
gap:8px
}

.profile-link-row input{margin:0}

.copy{
width:110px;
border:1px solid #292929;
border-radius:10px;
background:#111;
color:#fff;
cursor:pointer
}

.view-profile{
width:100%;
height:46px;
margin-top:10px;
border:1px solid #292929;
border-radius:10px;
background:#080808;
color:#fff;
cursor:pointer
}

.preview{
overflow:hidden;
position:sticky;
top:20px;
height:max-content;
background-size:cover;
background-position:center
}

.banner{
height:185px;
position:relative;
background:radial-gradient(
circle at 50% 0%,
#252525,
#070707 65%
);
background-size:cover;
background-position:center
}

.banner:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
transparent 35%,
#0b0b0b
)
}

.profile{
position:relative;
z-index:2;
text-align:center;
padding:0 25px 30px;
margin-top:-60px
}

.avatar{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
background:#111;
border:4px solid #0b0b0b
}

.name{
margin-top:12px;
font-size:24px;
font-weight:900
}

.username{
color:#666;
font-size:11px;
margin-top:5px
}

.bio{
color:#999;
font-size:12px;
line-height:1.5;
margin:15px auto;
max-width:330px
}

.website{
display:none;
color:var(--accent);
font-size:11px;
text-decoration:none
}

.socials{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:7px;
margin-top:16px
}

.social{
display:none;
padding:8px 10px;
border:1px solid #292929;
border-radius:8px;
color:#888;
text-decoration:none;
font-size:10px
}

.social:hover{
color:var(--accent);
border-color:var(--accent)
}

.badges{
display:flex;
justify-content:center;
gap:7px;
margin-top:20px
}

.badge{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #292929;
border-radius:9px;
color:#777
}

.badge.early{
color:#fff;
border-color:#555
}

@media(max-width:850px){
.layout{grid-template-columns:1fr}
.preview{
position:relative;
top:0;
order:-1
}
}

@media(max-width:550px){
.social-grid{grid-template-columns:1fr}
.title{font-size:29px}
.profile-link-row{flex-direction:column}
.copy{
width:100%;
height:45px
}
}
</style>
</head>

<body>

<div class="header">

</div>

<div class="layout">

<div class="card">

<div class="section">

<label>BIO</label>

COPY LINK
</button>

</div>

<button id="viewProfile" class="view-profile" type="button">
👁 VIEW PROFILE
</button>

</div>

<div id="preview" class="preview">

<div id="banner" class="banner"></div>

<div class="profile">

<img id="avatar" class="avatar" alt="Avatar">

<div id="previewUsername" class="username">@nox</div>

<div id="previewBio" class="bio">
This is my NØX profile.
</div>

<a id="websitePreview"
class="website"
target="_blank"
rel="noopener"></a>

<div class="socials">

<a id="instagramPreview" class="social" target="_blank" rel="noopener">Instagram</a>
<a id="tiktokPreview" class="social" target="_blank" rel="noopener">TikTok</a>
<a id="youtubePreview" class="social" target="_blank" rel="noopener">YouTube</a>
<a id="githubPreview" class="social" target="_blank" rel="noopener">GitHub</a>
<a id="twitterPreview" class="social" target="_blank" rel="noopener">X</a>

</div>

<div class="badges">
<div class="badge early">◆</div>
<div class="badge">✓</div>
<div class="badge">⚡</div>

</div>

</div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://qvqhanioapefeyxtbzlp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hJVj-2VGj2hEXUgc91QY1Q_zGjw9qp1";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   STATE
========================================= */

let currentUser = null;
let currentProfile = {};


/* =========================================
   HELPER
========================================= */

const $ = id =>
document.getElementById(id);


function message(text,type=""){
$("message").textContent = text;
$("message").className = "message " + type;
}


function normalizeUrl(value){

if(!value) return "";

value = String(value).trim();

if(
value.startsWith("http://") ||
value.startsWith("https://")
){
return value;
}

return "https://" + value;
}


/* =========================================
   IMAGE COMPRESSION
========================================= */

function compressImage(
file,
type,
maxWidth,
maxHeight,
quality
){

return new Promise((resolve,reject)=>{

if(!file){
reject(new Error("No se seleccionó ninguna imagen."));
return;
}

if(!file.type.startsWith("image/")){
reject(new Error("El archivo debe ser una imagen."));
return;
}

const reader = new FileReader();

reader.onload = function(){

const image = new Image();

image.onload = function(){

let width = image.width;
let height = image.height;

const ratio = Math.min(
maxWidth / width,
maxHeight / height,
1
);

width = Math.round(width * ratio);
height = Math.round(height * ratio);

const canvas =
document.createElement("canvas");

canvas.width = width;
canvas.height = height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
width,
height
);

canvas.toBlob(
function(blob){

if(!blob){

reject(
new Error(
"No se pudo comprimir la imagen."
)
);

return;
}

resolve(blob);

},
"image/webp",
quality
);

};

image.onerror = function(){

reject(
new Error(
"No se pudo leer la imagen."
)
);

};

image.src = reader.result;

};

reader.onerror = function(){

reject(
new Error(
"No se pudo leer el archivo."
)
);

};

reader.readAsDataURL(file);

});

}


/* =========================================
   DELETE OLD STORAGE FILE
========================================= */

async function deleteOldFile(url){

if(!url){
return;
}

try{

const marker =
"/storage/v1/object/public/profiles/";

const index =
url.indexOf(marker);

if(index === -1){
return;
}

let path =
url.substring(
index + marker.length
);

path =
decodeURIComponent(path);

const result =
await supabaseClient
.storage
.from("profiles")
.remove([path]);

if(result.error){

console.warn(
"No se pudo eliminar la imagen anterior:",
result.error
);

}

}catch(error){

console.warn(
"Error eliminando imagen anterior:",
error
);

}

}


/* =========================================
   PREVIEW
========================================= */

function updatePreview(){

const username =
$("username").value.trim();

const name =
$("displayName").value.trim();

const bio =
$("bio").value.trim();

const website =
$("website").value.trim();

const color =
$("accentColor").value;


$("previewUsername").textContent =
"@" + (username || "nox");


$("previewName").textContent =
name || "NØX";


$("previewBio").textContent =
bio || "This is my NØX profile.";


$("colorValue").textContent =
color.toUpperCase();


document.documentElement.style.setProperty(
"--accent",
color
);


if(website){

$("websitePreview").style.display =
"inline";

$("websitePreview").href =
normalizeUrl(website);

$("websitePreview").textContent =
website;

}else{

$("websitePreview").style.display =
"none";

}


updateSocial(
"discord",
"discordPreview"
);

updateSocial(
"instagram",
"instagramPreview"
);

updateSocial(
"tiktok",
"tiktokPreview"
);

updateSocial(
"youtube",
"youtubePreview"
);

updateSocial(
"github",
"githubPreview"
);

updateSocial(
"twitter",
"twitterPreview"
);

}


function updateSocial(
inputId,
outputId
){

const value =
$(inputId).value.trim();

const element =
$(outputId);


if(!value){

element.style.display =
"none";

return;

}


element.style.display =
"inline-block";

element.href =
normalizeUrl(value);

}


/* =========================================
   LOAD USER
========================================= */

async function loadUser(){

try{

const result =
await supabaseClient.auth.getUser();

if(result.error){
throw result.error;
}

if(!result.data.user){

message(
"No hay una sesión iniciada.",
"error"
);

return;
}

currentUser =
result.data.user;

await loadProfile();

}catch(error){

console.error(
"NØX USER ERROR:",
error
);

message(
error.message ||
"No se pudo cargar el usuario.",
"error"
);

}

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

const result =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(result.error){
throw result.error;
}

if(!result.data){

currentProfile = {};

message(
"No existe tu perfil.",
"error"
);

return;
}

currentProfile =
result.data;


$("username").value =
currentProfile.username || "";

$("displayName").value =
currentProfile.display_name || "NØX";

$("bio").value =
currentProfile.bio || "";

$("website").value =
currentProfile.website_url || "";

$("accentColor").value =
currentProfile.accent_color || "#ffffff";

$("profileEffect").value =
currentProfile.profile_effect || "none";


if(currentProfile.avatar_url){

$("avatar").src =
currentProfile.avatar_url;

}

if(currentProfile.banner_url){

$("banner").style.backgroundImage =
"url(" +
JSON.stringify(
currentProfile.banner_url
) +
")";

}

if(currentProfile.background_url){

$("preview").style.backgroundImage =
"url(" +
JSON.stringify(
currentProfile.background_url
) +
")";

}


const socials =
currentProfile.social_links || {};

$("discord").value =
socials.discord || "";

$("instagram").value =
socials.instagram || "";

$("tiktok").value =
socials.tiktok || "";

$("youtube").value =
socials.youtube || "";

$("github").value =
socials.github || "";

$("twitter").value =
socials.twitter || "";


updatePreview();

}


/* =========================================
   UPLOAD COMPRESSED IMAGE
========================================= */

async function uploadCompressedImage(
file,
folder,
oldUrl,
settings
){

if(!file){
return oldUrl || null;
}


/*
 * Comprime directamente en el navegador.
 */

message(
settings.message
);


const blob =
await compressImage(
file,
settings.type,
settings.maxWidth,
settings.maxHeight,
settings.quality
);


/*
 * WebP siempre.
 */

const path =
currentUser.id +
"/" +
folder +
"/" +
crypto.randomUUID() +
".webp";


const upload =
await supabaseClient
.storage
.from("profiles")
.upload(
path,
blob,
{
upsert:false,
contentType:"image/webp",
cacheControl:"31536000"
}
);


if(upload.error){

throw upload.error;

}


const publicResult =
supabaseClient
.storage
.from("profiles")
.getPublicUrl(path);


const newUrl =
publicResult.data.publicUrl;


/*
 * Elimina el anterior DESPUÉS
 * de haber subido correctamente
 * el nuevo.
 */

if(oldUrl){

await deleteOldFile(oldUrl);

}


return newUrl;

}


/* =========================================
   SAVE
========================================= */

$("save").addEventListener(
"click",
async function(){

const button =
$("save");

try{

if(!currentUser){

throw new Error(
"No hay una sesión iniciada."
);

}


button.disabled = true;
button.textContent = "SAVING...";


message(
"Guardando cambios..."
);


let avatarUrl =
currentProfile.avatar_url || null;

let bannerUrl =
currentProfile.banner_url || null;

let backgroundUrl =
currentProfile.background_url || null;


/* =========================
   AVATAR
========================= */

const avatarFile =
$("avatarFile").files[0];

if(avatarFile){

avatarUrl =
await uploadCompressedImage(
avatarFile,
"avatars",
avatarUrl,
{
message:"Comprimiendo foto de perfil...",
type:"avatar",
maxWidth:800,
maxHeight:800,
quality:.82
}
);

}


/* =========================
   BANNER
========================= */

const bannerFile =
$("bannerFile").files[0];

if(bannerFile){

bannerUrl =
await uploadCompressedImage(
bannerFile,
"banners",
bannerUrl,
{
message:"Comprimiendo banner...",
type:"banner",
maxWidth:1920,
maxHeight:700,
quality:.82
}
);

}


/* =========================
   BACKGROUND
========================= */

const backgroundFile =
$("backgroundFile").files[0];

if(backgroundFile){

backgroundUrl =
await uploadCompressedImage(
backgroundFile,
"backgrounds",
backgroundUrl,
{
message:"Comprimiendo fondo...",
type:"background",
maxWidth:1920,
maxHeight:1080,
quality:.78
}
);

}


/* =========================
   SOCIALS
========================= */

const socialLinks = {

discord:
$("discord").value.trim(),

instagram:
$("instagram").value.trim(),

tiktok:
$("tiktok").value.trim(),

youtube:
$("youtube").value.trim(),

github:
$("github").value.trim(),

twitter:
$("twitter").value.trim()

};


/* =========================
   DATA
========================= */

const data = {

username:
$("username").value.trim(),

display_name:
$("displayName").value.trim(),

bio:
$("bio").value.trim(),

website_url:
$("website").value.trim(),

avatar_url:
avatarUrl,

banner_url:
bannerUrl,

background_url:
backgroundUrl,

social_links:
socialLinks,

accent_color:
$("accentColor").value,

profile_effect:
$("profileEffect").value

};


/* =========================
   DATABASE
========================= */

const result =
await supabaseClient
.from("profiles")
.update(data)
.eq("id",currentUser.id)
.select()
.single();


if(result.error){

throw result.error;

}


currentProfile =
result.data;


/* =========================
   UPDATE PREVIEW
========================= */

if(avatarUrl){

$("avatar").src =
avatarUrl;

}

if(bannerUrl){

$("banner").style.backgroundImage =
"url(" +
JSON.stringify(
bannerUrl
) +
")";

}

if(backgroundUrl){

$("preview").style.backgroundImage =
"url(" +
JSON.stringify(
backgroundUrl
) +
")";

}


updatePreview();


/* =========================
   CLEAR INPUTS
========================= */

$("avatarFile").value = "";
$("bannerFile").value = "";
$("backgroundFile").value = "";


/* =========================
   SUCCESS
========================= */

message(
"✓ Cambios guardados correctamente.",
"success"
);


button.textContent =
"SAVE CHANGES";

button.disabled = false;


/*
 * Genera automáticamente
 * el enlace del perfil.
 */

generateProfileLink(false);


}catch(error){

console.error(
"NØX SAVE ERROR:",
error
);


message(
"ERROR: " +
(
error.message ||
"No se pudieron guardar los cambios."
),
"error"
);


button.textContent =
"SAVE CHANGES";

button.disabled = false;

}

});


/* =========================================
   GENERATE PROFILE LINK
========================================= */

function generateProfileLink(
showMessage=true
){

const username =
$("username").value.trim();


if(!username){

if(showMessage){

message(
"Primero escribe un username.",
"error"
);

}

return null;

}


/*
 * Mantiene el sistema actual.
 */

const link =
window.location.origin +
"/profile.html?username=" +
encodeURIComponent(username);


$("profileLink").value =
link;

$("profileLinkBox").style.display =
"block";


if(showMessage){

message(
"✓ Profile link generado.",
"success"
);

}


return link;

}


/* =========================================
   GENERATE BUTTON
=====================================
