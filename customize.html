<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    width:min(700px,92%);
    margin:50px auto;
}

.card{
    background:#0c0c0c;
    border:1px solid #252525;
    border-radius:20px;
    padding:25px;
}

h1{
    margin:0 0 5px;
    font-size:32px;
}

.sub{
    color:#666;
    font-size:12px;
    margin-bottom:30px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    background:#070707;
    border:1px solid #292929;
    color:white;
    border-radius:10px;
    padding:13px;
    outline:none;
    margin-bottom:18px;
}

input{
    height:46px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#777;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:white;
    color:black;
    font-weight:900;
    cursor:pointer;
}

.save:disabled{
    opacity:.5;
}

.status{
    text-align:center;
    margin-top:15px;
    min-height:20px;
    font-size:12px;
}

.ok{
    color:#aaa;
}

.error{
    color:#ff5555;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Customize</h1>

<div class="sub">
Customize your NØX identity.
</div>


<label>
USERNAME
</label>

<input
    id="username"
    type="text"
>


<label>
DISPLAY NAME
</label>

<input
    id="displayName"
    type="text"
>


<label>
BIO
</label>

<textarea
    id="bio"
></textarea>


<label>
WEBSITE
</label>

<input
    id="website"
    type="url"
    placeholder="https://example.com"
>


<button
    id="saveButton"
    class="save"
    type="button"
>
SAVE CHANGES
</button>


<div
    id="status"
    class="status"
></div>

</div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://qvqhanioapefeyxtbzlp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_hJVj-2VGj2hEXUgc91QY1Q_zGjw9qp1";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const username =
    document.getElementById(
        "username"
    );

const displayName =
    document.getElementById(
        "displayName"
    );

const bio =
    document.getElementById(
        "bio"
    );

const website =
    document.getElementById(
        "website"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const status =
    document.getElementById(
        "status"
    );


function showStatus(
    text,
    type=""
){

    status.textContent =
        text;

    status.className =
        "status " + type;

}


/* =========================
   CARGAR USUARIO
========================= */

async function loadProfile(){

    showStatus(
        "Cargando perfil..."
    );


    const {
        data,
        error
    } =
        await supabaseClient
        .auth
        .getUser();


    if(error){

        showStatus(
            error.message,
            "error"
        );

        return;

    }


    if(!data.user){

        showStatus(
            "No hay una sesión iniciada.",
            "error"
        );

        return;

    }


    const user =
        data.user;


    const profile =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            user.id
        )
        .maybeSingle();


    if(profile.error){

        showStatus(
            profile.error.message,
            "error"
        );

        return;

    }


    if(!profile.data){

        showStatus(
            "No existe un perfil para este usuario.",
            "error"
        );

        return;

    }


    username.value =
        profile.data.username ||
        "";

    displayName.value =
        profile.data.display_name ||
        "";

    bio.value =
        profile.data.bio ||
        "";

    website.value =
        profile.data.website_url ||
        "";


    showStatus(
        "Perfil cargado."
    );

}


/* =========================
   SAVE
========================= */

saveButton.addEventListener(
    "click",
    async function(){

        try{

            saveButton.disabled =
                true;

            saveButton.textContent =
                "SAVING...";


            showStatus(
                "Guardando..."
            );


            const {
                data,
                error
            } =
                await supabaseClient
                .auth
                .getUser();


            if(error)
                throw error;


            if(!data.user){

                throw new Error(
                    "No hay una sesión iniciada."
                );

            }


            const user =
                data.user;


            const update =
                await supabaseClient
                .from("profiles")
                .update({

                    display_name:
                        displayName.value.trim(),

                    bio:
                        bio.value.trim(),

                    website_url:
                        website.value.trim()

                })
                .eq(
                    "id",
                    user.id
                );


            if(update.error)
                throw update.error;


            showStatus(
                "✓ Cambios guardados correctamente.",
                "ok"
            );


        }
        catch(error){

            console.error(
                "NØX ERROR:",
                error
            );


            showStatus(
                "⚠️ " +
                error.message,
                "error"
            );


        }
        finally{

            saveButton.disabled =
                false;

            saveButton.textContent =
                "SAVE CHANGES";

        }

    }
);


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
