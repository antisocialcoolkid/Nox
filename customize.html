<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Customize</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}

.container{
    width:min(700px,100%);
    margin:auto;
}

h1{
    font-size:28px;
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    font-size:13px;
    margin-bottom:30px;
}

.card{
    background:#0d0d0d;
    border:1px solid #222;
    border-radius:18px;
    padding:25px;
}

.field{
    margin-bottom:20px;
}

label{
    display:block;
    color:#888;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:8px;
}

input,
textarea{
    width:100%;
    background:#080808;
    border:1px solid #252525;
    color:white;
    border-radius:10px;
    padding:13px;
    outline:none;
    font-family:inherit;
}

input:focus,
textarea:focus{
    border-color:#555;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:wait;
}

#message{
    text-align:center;
    margin-top:15px;
    font-size:12px;
    min-height:18px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff6b6b;
}

.username-info{
    margin-top:7px;
    color:#555;
    font-size:10px;
}

.preview{
    margin-top:25px;
    padding:20px;
    border:1px solid #222;
    border-radius:15px;
}

.preview-name{
    font-size:20px;
    font-weight:bold;
}

.preview-username{
    color:#555;
    font-size:11px;
    margin-top:4px;
}

.preview-bio{
    color:#aaa;
    margin-top:15px;
    font-size:12px;
    white-space:pre-wrap;
}

.back{
    display:inline-block;
    color:#666;
    text-decoration:none;
    margin-bottom:25px;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">
← Back
</a>

<h1>Customize</h1>

<div class="subtitle">
Customize your NØX identity.
</div>

<div class="card">

<div class="field">

<label>USERNAME</label>

<input
    id="username"
    maxlength="20"
    autocomplete="off"
>

<div
    id="usernameInfo"
    class="username-info"
>
</div>

</div>


<div class="field">

<label>DISPLAY NAME</label>

<input
    id="displayName"
    maxlength="30"
>

</div>


<div class="field">

<label>BIO</label>

<textarea
    id="bio"
    maxlength="160"
></textarea>

</div>


<div class="field">

<label>WEBSITE</label>

<input
    id="website"
    type="url"
    placeholder="https://..."
>

</div>


<div class="field">

<label>ACCENT COLOR</label>

<input
    id="accentColor"
    type="color"
    value="#ffffff"
>

</div>


<button id="saveButton">
SAVE CHANGES
</button>

<div id="message"></div>

</div>


<div class="preview">

<div
    id="previewName"
    class="preview-name"
>
NØX
</div>

<div
    id="previewUsername"
    class="preview-username"
>
@username
</div>

<div
    id="previewBio"
    class="preview-bio"
>
Your bio will appear here.
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let user = null;
let profile = null;


/* ELEMENTOS */

const username =
    document.getElementById("username");

const displayName =
    document.getElementById("displayName");

const bio =
    document.getElementById("bio");

const website =
    document.getElementById("website");

const accentColor =
    document.getElementById("accentColor");

const saveButton =
    document.getElementById("saveButton");

const message =
    document.getElementById("message");

const usernameInfo =
    document.getElementById("usernameInfo");


/* MENSAJE */

function showMessage(text,type=""){

    message.textContent = text;

    message.className = type;

}


/* ==========================================
   1. COMPROBAR USUARIO
========================================== */

async function loadUser(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();

    if(error)
        throw error;

    if(!data.user){

        window.location.href =
            "login.html";

        return;

    }

    user = data.user;

    await loadProfile();

}


/* ==========================================
   2. CARGAR PROFILE
========================================== */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .single();


    if(error)
        throw error;


    profile = data;


    username.value =
        profile.username || "";

    displayName.value =
        profile.display_name || "";

    bio.value =
        profile.bio || "";

    website.value =
        profile.website_url || "";

    accentColor.value =
        profile.accent_color ||
        "#ffffff";


    updatePreview();

    updateUsernameInfo();

}


/* ==========================================
   3. USERNAME
========================================== */

function updateUsernameInfo(){

    if(!profile)
        return;


    if(
        username.value.trim().toLowerCase()
        ===
        (profile.username || "").toLowerCase()
    ){

        usernameInfo.textContent =
            "Username actual.";

        return;

    }


    if(!profile.username_changed_at){

        usernameInfo.textContent =
            "Puedes cambiar tu username.";

        return;

    }


    const last =
        new Date(
            profile.username_changed_at
        );

    const next =
        new Date(
            last.getTime()
            +
            7 * 24 * 60 * 60 * 1000
        );


    if(Date.now() >= next.getTime()){

        usernameInfo.textContent =
            "Puedes cambiar tu username.";

    }else{

        const days =
            Math.ceil(
                (
                    next.getTime()
                    -
                    Date.now()
                )
                /
                86400000
            );

        usernameInfo.textContent =
            `Podrás cambiarlo en ${days} día(s).`;

    }

}


/* ==========================================
   4. PREVIEW
========================================== */

function updatePreview(){

    document.getElementById(
        "previewName"
    ).textContent =
        displayName.value || "NØX";


    document.getElementById(
        "previewUsername"
    ).textContent =
        "@" +
        (username.value || "username");


    document.getElementById(
        "previewBio"
    ).textContent =
        bio.value ||
        "Your bio will appear here.";

}


/* ==========================================
   5. GUARDAR
========================================== */

saveButton.addEventListener(
    "click",
    saveProfile
);


async function saveProfile(){

    saveButton.disabled = true;

    saveButton.textContent =
        "SAVING...";

    showMessage("");


    try{

        const newUsername =
            username.value
                .trim()
                .toLowerCase();


        /*
        ===============================
        USERNAME
        ===============================
        */

        if(
            newUsername !==
            (profile.username || "").toLowerCase()
        ){

            const {
                error
            } =
            await supabaseClient.rpc(
                "change_username",
                {
                    new_username:
                        newUsername
                }
            );


            if(error)
                throw error;


            profile.username =
                newUsername;

            profile.username_changed_at =
                new Date().toISOString();

        }


        /*
        ===============================
        RESTO DEL PERFIL
        ===============================
        */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("profiles")
            .update({

                display_name:
                    displayName.value.trim(),

                bio:
                    bio.value.trim(),

                website_url:
                    website.value.trim(),

                accent_color:
                    accentColor.value,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                user.id
            )
            .select()
            .single();


        if(error)
            throw error;


        profile = data;


        updatePreview();

        updateUsernameInfo();


        showMessage(
            "✓ Cambios guardados.",
            "success"
        );


    }catch(error){

        console.error(
            "NØX Customize:",
            error
        );


        showMessage(
            error.message ||
            "No se pudieron guardar los cambios.",
            "error"
        );


    }finally{

        saveButton.disabled = false;

        saveButton.textContent =
            "SAVE CHANGES";

    }

}


/* ==========================================
   6. ACTUALIZACIÓN EN VIVO
========================================== */

username.addEventListener(
    "input",
    () => {

        updatePreview();
        updateUsernameInfo();

    }
);


displayName.addEventListener(
    "input",
    updatePreview
);


bio.addEventListener(
    "input",
    updatePreview
);


/* ==========================================
   START
========================================== */

loadUser().catch(error => {

    console.error(error);

    showMessage(
        error.message ||
        "No se pudo cargar tu perfil.",
        "error"
    );

});

</script>

</body>
</html>
