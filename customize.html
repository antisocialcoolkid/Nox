<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ffffff;
    --bg:#050505;
    --panel:#0b0b0b;
    --border:#252525;
    --muted:#777;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.09),
            transparent 38%
        ),
        #050505;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    padding:24px;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

.container{
    width:min(1150px,100%);
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.title{
    font-size:30px;
    font-weight:800;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:5px;
}

.back{
    color:#666;
    text-decoration:none;
    font-size:12px;
}

.back:hover{
    color:#fff;
}

.grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) 420px;
    gap:20px;
}

.panel,
.preview{
    border:1px solid var(--border);
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(20px);
    border-radius:20px;
}

.panel{
    padding:25px;
}

.section{
    margin-bottom:30px;
}

.section-title{
    color:#777;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:15px;
}

.field{
    margin-bottom:17px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #242424;
    border-radius:10px;
    background:#070707;
    color:white;
    outline:none;
    padding:12px;
}

input{
    height:46px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#555;
}

.username-info{
    margin-top:7px;
    color:#555;
    font-size:10px;
    line-height:1.5;
}

.file{
    display:block;
    border:1px dashed #303030;
    border-radius:12px;
    padding:18px;
    text-align:center;
    color:#777;
    cursor:pointer;
    transition:.25s;
}

.file:hover{
    border-color:#666;
    color:#fff;
    background:#0c0c0c;
}

.file input{
    display:none;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:58px;
    height:42px;
    padding:3px;
}

.color-value{
    color:#777;
    font-size:11px;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.save:hover{
    transform:translateY(-2px);
    box-shadow:
        0 15px 40px
        rgba(255,255,255,.12);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}

.message{
    min-height:20px;
    margin-top:14px;
    padding:0 4px;
    text-align:center;
    font-size:11px;
    line-height:1.5;
}

.success{
    color:#aaa;
}

.error{
    color:#ff6868;
}


/* =========================
   PREVIEW
========================= */

.preview{
    position:sticky;
    top:20px;
    overflow:hidden;
    background-color:#080808;
    background-size:cover;
    background-position:center;
    transition:.35s;
}

.banner{
    position:relative;
    height:190px;
    background:
        linear-gradient(
            135deg,
            #191919,
            #050505
        );
    background-size:cover;
    background-position:center;
}

.banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            transparent,
            #080808
        );
}

.particles{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:3;
}

.dot{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--accent);
    opacity:.4;
    animation:
        particle
        6s
        ease-in-out
        infinite;
}

@keyframes particle{

    0%,
    100%{
        transform:translateY(0);
        opacity:.1;
    }

    50%{
        transform:translateY(-35px);
        opacity:.8;
    }

}

.preview-content{
    position:relative;
    z-index:4;
    margin-top:-58px;
    padding:0 25px 30px;
    text-align:center;
}

.avatar{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #080808;
    background:#111;
}

.preview-name{
    margin-top:14px;
    font-size:23px;
    font-weight:800;
}

.preview-username{
    margin-top:4px;
    color:#666;
    font-size:11px;
}

.preview-bio{
    max-width:340px;
    margin:15px auto;
    color:#aaa;
    font-size:12px;
    line-height:1.5;
}

.preview-website{
    display:none;
    color:var(--accent);
    text-decoration:none;
    font-size:11px;
}

.badges{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:18px;
}

.badge{
    width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    background:#111;
    transition:.25s;
}

.badge:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
}

.floating{
    animation:
        floating
        4s
        ease-in-out
        infinite;
}

@keyframes floating{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}

@media(max-width:850px){

    body{
        padding:15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }

}

</style>

</head>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


/* =====================================================
   NØX CUSTOMIZE
===================================================== */


let currentUser = null;
let profile = null;


const $ =
    id =>
    document.getElementById(id);


/* =====================================================
   MENSAJES
===================================================== */

function message(
    text,
    type = ""
){

    const box =
        $("message");


    box.textContent =
        text;


    box.className =
        "message " +
        type;

}


/* =====================================================
   INICIAR
===================================================== */

async function init(){

    try{

        message(
            "Cargando perfil..."
        );


        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(error)
            throw error;


        if(
            !data ||
            !data.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            data.user;


        await loadProfile();


        message("");

    }

    catch(error){

        console.error(
            "NØX INIT:",
            error
        );


        message(
            "Error: " +
            (
                error.message ||
                "No se pudo cargar el perfil."
            ),
            "error"
        );

    }

}


/* =====================================================
   CARGAR PROFILE
===================================================== */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(error)
        throw error;


    if(!data){

        throw new Error(
            "No existe un perfil para este usuario."
        );

    }


    profile =
        data;


    $("username").value =
        profile.username ||
        "nox";


    $("displayName").value =
        profile.display_name ||
        "NØX";


    $("bio").value =
        profile.bio ||
        "This is my NØX profile.";


    $("website").value =
        profile.website_url ||
        "";


    $("accentColor").value =
        profile.accent_color ||
        "#ffffff";


    $("profileEffect").value =
        profile.profile_effect ||
        "none";


    /* AVATAR */

    if(profile.avatar_url){

        $("avatar").src =
            profile.avatar_url;

    }


    /* BANNER */

    if(profile.banner_url){

        $("banner")
            .style
            .backgroundImage =
            `url("${profile.banner_url}")`;

    }


    /* BACKGROUND */

    if(profile.background_url){

        $("preview")
            .style
            .backgroundImage =
            `url("${profile.background_url}")`;

    }


    updatePreview();

    updateUsernameInfo();

}


/* =====================================================
   USERNAME
===================================================== */

function updateUsernameInfo(){

    if(!profile)
        return;


    const original =
        (
            profile.username ||
            ""
        )
        .toLowerCase();


    const current =
        $("username")
            .value
            .trim()
            .toLowerCase();


    if(
        current ===
        original
    ){

        $("usernameInfo")
            .textContent =
            "Username actual.";

        return;

    }


    if(
        !profile.username_changed_at
    ){

        $("usernameInfo")
            .textContent =
            "✓ Disponible. Después del cambio tendrás que esperar 7 días.";

        return;

    }


    const changed =
        new Date(
            profile.username_changed_at
        )
        .getTime();


    const next =
        changed +
        (
            7 *
            24 *
            60 *
            60 *
            1000
        );


    const remaining =
        next -
        Date.now();


    if(
        remaining <= 0
    ){

        $("usernameInfo")
            .textContent =
            "✓ Ya puedes cambiar tu username.";

        return;

    }


    const days =
        Math.ceil(
            remaining /
            (
                24 *
                60 *
                60 *
                1000
            )
        );


    $("usernameInfo")
        .textContent =
        `🔒 Podrás cambiarlo nuevamente en ${days} día(s).`;

}


/* =====================================================
   PREVIEW
===================================================== */

function updatePreview(){

    const username =
        $("username")
            .value
            .trim();


    const displayName =
        $("displayName")
            .value
            .trim();


    const bio =
        $("bio")
            .value
            .trim();


    $("previewUsername")
        .textContent =
        "@" +
        (
            username ||
            "nox"
        );


    $("previewName")
        .textContent =
        displayName ||
        "NØX";


    $("previewBio")
        .textContent =
        bio ||
        "This is my NØX profile.";


    /* COLOR */

    const color =
        $("accentColor")
            .value;


    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );


    $("colorValue")
        .textContent =
        color.toUpperCase();


    /* WEBSITE */

    const website =
        $("website")
            .value
            .trim();


    if(website){

        $("previewWebsite")
            .style
            .display =
            "inline";


        $("previewWebsite")
            .href =
            website;


        $("previewWebsite")
            .textContent =
            website;

    }

    else{

        $("previewWebsite")
            .style
            .display =
            "none";

    }


    /* EFFECT */

    $("preview")
        .classList.toggle(
            "floating",
            $("profileEffect")
                .value ===
            "floating"
        );


    createParticles();

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(){

    const container =
        $("particles");


    container.innerHTML =
        "";


    if(
        $("profileEffect")
            .value !==
        "particles"
    ){

        return;

    }


    for(
        let i = 0;
        i < 35;
        i++
    ){

        const dot =
            document.createElement(
                "div"
            );


        dot.className =
            "dot";


        dot.style.left =
            Math.random() *
            100 +
            "%";


        dot.style.top =
            Math.random() *
            100 +
            "%";


        dot.style.animationDelay =
            Math.random() *
            5 +
            "s";


        container
            .appendChild(dot);

    }

}


/* =====================================================
   SUBIR IMAGEN
===================================================== */

async function uploadImage(
    file,
    folder
){

    if(!file)
        return null;


    if(
        file.size >
        15 *
        1024 *
        1024
    ){

        throw new Error(
            "La imagen supera los 15 MB."
        );

    }


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const path =
        currentUser.id +
        "/" +
        folder +
        "/" +
        crypto.randomUUID() +
        "." +
        extension;


    const {
        error
    } =
    await supabaseClient
        .storage
        .from("profiles")
        .upload(
            path,
            file,
            {
                upsert:false,
                cacheControl:"3600"
            }
        );


    if(error)
        throw error;


    const {
        data
    } =
    supabaseClient
        .storage
        .from("profiles")
        .getPublicUrl(
            path
        );


    return data.publicUrl;

}


/* =====================================================
   GUARDAR
===================================================== */

$("save")
.addEventListener(
    "click",
    async function(){

        const button =
            $("save");


        try{

            button.disabled =
                true;


            button.textContent =
                "SAVING...";


            message(
                "Guardando cambios..."
            );


            /* USERNAME */

            const newUsername =
                $("username")
                    .value
                    .trim()
                    .toLowerCase();


            const oldUsername =
                (
                    profile.username ||
                    ""
                )
                .toLowerCase();


            if(
                !newUsername
            ){

                throw new Error(
                    "El username no puede estar vacío."
                );

            }


            if(
                newUsername !==
                oldUsername
            ){

                message(
                    "Comprobando username..."
                );


                const {
                    error
                } =
                await supabaseClient
                    .rpc(
                        "change_username",
                        {
                            new_username:
                                newUsername
                        }
                    );


                if(error)
                    throw error;

            }


            /* URLs actuales */

            let avatarUrl =
                profile.avatar_url ||
                null;


            let bannerUrl =
                profile.banner_url ||
                null;


            let backgroundUrl =
                profile.background_url ||
                null;


            /* ARCHIVOS */

            const avatarFile =
                $("avatarFile")
                    .files[0];


            const bannerFile =
                $("bannerFile")
                    .files[0];


            const backgroundFile =
                $("backgroundFile")
                    .files[0];


            /* AVATAR */

            if(avatarFile){

                message(
                    "Subiendo foto de perfil..."
                );
