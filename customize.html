<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --accent:#ffffff;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1050px,94%);
    margin:35px auto 70px;
}

.header{
    margin-bottom:25px;
}

.title{
    font-size:35px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:6px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 400px;
    gap:20px;
}

.card,
.preview{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
}

.card{
    padding:25px;
}

.section{
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #181818;
}

.section:last-of-type{
    border-bottom:0;
}

.section-title{
    color:#555;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:800;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    background:#070707;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    outline:none;
    padding:12px;
    margin-bottom:16px;
}

input{
    height:45px;
}

textarea{
    min-height:95px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#666;
}

.username-info{
    color:#555;
    font-size:10px;
    margin-top:-9px;
    margin-bottom:17px;
}

.file{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:12px;
    border:1px dashed #303030;
    border-radius:10px;
    color:#777;
    cursor:pointer;
    margin-bottom:15px;
    transition:.2s;
}

.file:hover{
    border-color:#777;
    color:#fff;
    background:#0d0d0d;
}

.file input{
    display:none;
}

.social-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.social-grid input{
    margin:0;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:60px;
    padding:3px;
    margin:0;
}

.color-value{
    color:#777;
    font-size:11px;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.save:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(255,255,255,.1);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}

.message{
    min-height:20px;
    text-align:center;
    margin-top:13px;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff5555;
}


/* PREVIEW */

.preview{
    overflow:hidden;
    position:sticky;
    top:20px;
    height:max-content;
}

.banner{
    height:185px;
    position:relative;
    background:
        radial-gradient(
            circle at 50% 0%,
            #252525,
            #070707 65%
        );
    background-size:cover;
    background-position:center;
}

.banner:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 35%,
        #0b0b0b
    );
}

.profile{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 25px 30px;
    margin-top:-60px;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0b0b0b;
}

.name{
    margin-top:12px;
    font-size:24px;
    font-weight:900;
}

.username{
    color:#666;
    font-size:11px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:12px;
    line-height:1.5;
    margin:15px auto;
    max-width:330px;
}

.website{
    color:var(--accent);
    font-size:11px;
    text-decoration:none;
}

.socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
}

.social{
    display:none;
    padding:8px 10px;
    border:1px solid #292929;
    border-radius:8px;
    color:#888;
    text-decoration:none;
    font-size:10px;
}

.social:hover{
    color:var(--accent);
    border-color:var(--accent);
}

.badges{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:20px;
}

.badge{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
}

.badge.early{
    color:#fff;
    border-color:#555;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }

}

@media(max-width:550px){

    .social-grid{
        grid-template-columns:1fr;
    }

    .title{
        font-size:29px;
    }

}

</style>

</head>

<script>

let currentUser = null;

let currentProfile = null;


/* =================================
   HELPERS
================================= */

const $ = id =>
    document.getElementById(id);


function message(
    text,
    type=""
){

    $("message").textContent =
        text;

    $("message").className =
        "message " + type;

}


/* =================================
   PREVIEW
================================= */

function updatePreview(){

    const username =
        $("username").value.trim();

    const name =
        $("displayName").value.trim();

    const bio =
        $("bio").value.trim();

    const website =
        $("website").value.trim();


    $("previewUsername")
        .textContent =
        "@" +
        (username || "nox");


    $("previewName")
        .textContent =
        name || "NØX";


    $("previewBio")
        .textContent =
        bio ||
        "This is my NØX profile.";


    $("colorValue")
        .textContent =
        $("accentColor")
            .value
            .toUpperCase();


    document.documentElement
        .style
        .setProperty(
            "--accent",
            $("accentColor").value
        );


    if(website){

        $("websitePreview")
            .style.display =
            "inline";

        $("websitePreview")
            .href =
            normalizeUrl(
                website
            );

        $("websitePreview")
            .textContent =
            website;

    }
    else{

        $("websitePreview")
            .style.display =
            "none";

    }


    updateSocial(
        "discord",
        "discordPreview"
    );

    updateSocial(
        "instagram",
        "instagramPreview"
    );

    updateSocial(
        "tiktok",
        "tiktokPreview"
    );

    updateSocial(
        "youtube",
        "youtubePreview"
    );

    updateSocial(
        "github",
        "githubPreview"
    );

    updateSocial(
        "twitter",
        "twitterPreview"
    );

}


/* =================================
   SOCIAL PREVIEW
================================= */

function updateSocial(
    input,
    output
){

    const value =
        $(input)
            .value
            .trim();

    const element =
        $(output);


    if(!value){

        element.style.display =
            "none";

        return;

    }


    element.style.display =
        "inline-block";

    element.href =
        normalizeUrl(value);

}


function normalizeUrl(value){

    if(
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "https://"
        )
    ){

        return value;

    }

    return "https://" + value;

}


/* =================================
   LOAD USER
================================= */

async function loadUser(){

    try{

        if(
            typeof supabaseClient ===
            "undefined"
        ){

            throw new Error(
                "supabaseClient no está cargado."
            );

        }


        const result =
            await supabaseClient
                .auth
                .getUser();


        if(result.error)
            throw result.error;


        currentUser =
            result.data.user;


        if(!currentUser){

            message(
                "No hay una sesión iniciada.",
                "error"
            );

            return;

        }


        await loadProfile();

    }
    catch(error){

        console.error(error);

        message(
            error.message,
            "error"
        );

    }

}


/* =================================
   LOAD PROFILE
================================= */

async function loadProfile(){

    const result =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if(result.error)
        throw result.error;


    if(!result.data){

        message(
            "No existe tu perfil.",
            "error"
        );

        return;

    }


    currentProfile =
        result.data;


    $("username").value =
        currentProfile.username ||
        "";


    $("displayName").value =
        currentProfile.display_name ||
        "NØX";


    $("bio").value =
        currentProfile.bio ||
        "This is my NØX profile.";


    $("website").value =
        currentProfile.website_url ||
        "";


    $("accentColor").value =
        currentProfile.accent_color ||
        "#ffffff";


    $("profileEffect").value =
        currentProfile.profile_effect ||
        "none";


    if(currentProfile.avatar_url){

        $("avatar").src =
            currentProfile.avatar_url;

    }


    if(currentProfile.banner_url){

        $("banner")
            .style
            .backgroundImage =
            `url("${currentProfile.banner_url}")`;

    }


    const socials =
        currentProfile.social_links ||
        {};


    $("discord").value =
        socials.discord || "";

    $("instagram").value =
        socials.instagram || "";

    $("tiktok").value =
        socials.tiktok || "";

    $("youtube").value =
        socials.youtube || "";

    $("github").value =
        socials.github || "";

    $("twitter").value =
        socials.twitter || "";


    updatePreview();

}


/* =================================
   FILE UPLOAD
================================= */

async function uploadFile(
    file,
    folder
){

    if(!file)
        return null;


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        throw new Error(
            "Solo puedes subir imágenes."
        );

    }


    if(
        file.size >
        10 * 1024 * 1024
    ){

        throw new Error(
            "La imagen supera los 10 MB."
        );

    }


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const path =
        currentUser.id +
        "/" +
        folder +
        "/" +
        crypto.randomUUID() +
        "." +
        extension;


    const upload =
        await supabaseClient
            .storage
            .from("profiles")
            .upload(
                path,
                file
            );


    if(upload.error)
        throw upload.error;


    const result =
        supabaseClient
            .storage
            .from("profiles")
            .getPublicUrl(
                path
            );


    return result
        .data
        .publicUrl;

}

================================= */

[

    "bio",
    "website",
    "discord",
    "instagram",
    "tiktok",
    "youtube",
    "github",

            if(bannerFile){

                bannerUrl =
                    await uploadFile(

            }


            if(backgroundFile){

                message(

                backgroundUrl =
                    await uploadFile(

                    );

            const socialLinks = {

                instagram:
                    $("instagram")
                        .value
                        .trim(),

                tiktok:
                    $("tiktok")
                        .value
                        .trim(),

                youtube:
