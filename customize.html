<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØX — Customize</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ffffff;
    --bg:#050505;
    --panel:#0b0b0b;
    --border:#242424;
    --muted:#777;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(255,255,255,.08),
            transparent 35%
        ),
        #050505;
    color:white;
    font-family:Inter,Arial,sans-serif;
    padding:25px;
}

.container{
    width:min(1150px,100%);
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.title{
    font-size:30px;
    font-weight:800;
    letter-spacing:-1.5px;
}

.subtitle{
    margin-top:5px;
    color:#666;
    font-size:12px;
}

.back{
    color:#666;
    text-decoration:none;
    font-size:12px;
}

.back:hover{
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) 420px;
    gap:20px;
}

.card{
    border:1px solid var(--border);
    border-radius:20px;
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(20px);
    padding:25px;
}

.section{
    margin-bottom:28px;
}

.section-title{
    color:#777;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:15px;
}

.field{
    margin-bottom:17px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:700;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #252525;
    border-radius:10px;
    background:#070707;
    color:white;
    outline:none;
    font-family:inherit;
    padding:12px;
}

input{
    height:46px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#555;
}

.username-info{
    margin-top:7px;
    color:#555;
    font-size:10px;
    line-height:1.5;
}

.file{
    display:block;
    border:1px dashed #303030;
    border-radius:12px;
    padding:17px;
    text-align:center;
    color:#777;
    cursor:pointer;
    transition:.25s;
}

.file:hover{
    border-color:#666;
    color:white;
    background:#0c0c0c;
}

.file input{
    display:none;
}

.color{
    display:flex;
    align-items:center;
    gap:12px;
}

.color input{
    width:55px;
    height:40px;
    padding:3px;
}

.color span{
    color:#777;
    font-size:11px;
}

.save{
    width:100%;
    height:50px;
    border:0;
    border-radius:11px;
    background:white;
    color:black;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.save:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(255,255,255,.12);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}

.message{
    min-height:20px;
    margin-top:14px;
    text-align:center;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff6565;
}


/* PREVIEW */

.preview{
    position:sticky;
    top:20px;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:22px;
    background:#080808;
}

.banner{
    height:190px;
    position:relative;
    background:
        linear-gradient(
            135deg,
            #191919,
            #050505
        );
    background-size:cover;
    background-position:center;
}

.banner:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent,
        #080808
    );
}

.content{
    position:relative;
    margin-top:-58px;
    padding:0 25px 30px;
    text-align:center;
    z-index:2;
}

.avatar{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #080808;
    background:#111;
}

.name{
    margin-top:14px;
    font-size:23px;
    font-weight:800;
}

.username{
    margin-top:4px;
    color:#666;
    font-size:11px;
}

.bio{
    max-width:340px;
    margin:15px auto;
    color:#aaa;
    font-size:12px;
    line-height:1.5;
}

.website{
    display:none;
    color:var(--accent);
    text-decoration:none;
    font-size:11px;
}

.badges{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:18px;
}

.badge{
    width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    background:#111;
    transition:.25s;
}

.badge:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
}

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.dot{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--accent);
    opacity:.4;
    animation:float 6s ease-in-out infinite;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
        opacity:.1;
    }

    50%{
        transform:translateY(-35px);
        opacity:.8;
    }

}

.floating{
    animation:cardFloat 4s ease-in-out infinite;
}

@keyframes cardFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}

@media(max-width:850px){

    body{
        padding:15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }

}

</style>
</head>


<body>

<div class="container">

<div class="top">

<div>
    <div class="title">Customize</div>
    <div class="subtitle">
        Customize your NØX identity.
    </div>
</div>

<a
    href="dashboard.html"
    class="back"
>
    ← BACK
</a>

</div>


<div class="grid">


<!-- EDITOR -->

<div class="card">


<div class="section">

<div class="section-title">
IDENTITY
</div>


<div class="field">

<label>USERNAME</label>

<input
    id="username"
    maxlength="20"
    autocomplete="off"
>

<div
    id="usernameInfo"
    class="username-info"
>
Cargando...
</div>

</div>


<div class="field">

<label>DISPLAY NAME</label>

<input
    id="displayName"
    maxlength="30"
    placeholder="NØX"
>

</div>


<div class="field">

<label>BIO</label>

<textarea
    id="bio"
    maxlength="160"
    placeholder="This is my NØX profile."
></textarea>

</div>

</div>


<div class="section">

<div class="section-title">
MEDIA
</div>


<div class="field">

<label>PROFILE PICTURE</label>

<label class="file">

📷 CHOOSE PROFILE PHOTO

<input
    id="avatarFile"
    type="file"
    accept="image/*"
>

</label>

</div>


<div class="field">

<label>BANNER</label>

<label class="file">

🖼️ CHOOSE BANNER

<input
    id="bannerFile"
    type="file"
    accept="image/*"
>

</label>

</div>


<div class="field">

<label>BACKGROUND</label>

<label class="file">

🌌 CHOOSE BACKGROUND

<input
    id="backgroundFile"
    type="file"
    accept="image/*"
>

</label>

</div>

</div>


<div class="section">

<div class="section-title">
STYLE
</div>


<div class="field">

<label>ACCENT COLOR</label>

<div class="color">

<input
    id="accentColor"
    type="color"
    value="#ffffff"
>

<span id="colorText">
#FFFFFF
</span>

</div>

</div>


<div class="field">

<label>PROFILE EFFECT</label>

<select id="effect">

<option value="none">
None
</option>

<option value="floating">
Floating
</option>

<option value="particles">
Particles
</option>

</select>

</div>

</div>


<div class="section">

<div class="section-title">
SOCIAL
</div>


<div class="field">

<label>WEBSITE</label>

<input
    id="website"
    type="url"
    placeholder="https://example.com"
>

</div>

</div>


<button
    id="save"
    class="save"
>
SAVE CHANGES
</button>


<div
    id="message"
    class="message"
></div>


</div>


<!-- PREVIEW -->

<div
    id="preview"
    class="preview"
>


<div
    id="banner"
    class="banner"
>

<div
    id="particles"
    class="particles"
></div>

</div>


<div class="content">


<img
    id="avatar"
    class="avatar"
    alt="Avatar"
>


<div
    id="previewName"
    class="name"
>
NØX
</div>


<div
    id="previewUsername"
    class="username"
>
@nox
</div>


<div
    id="previewBio"
    class="bio"
>
This is my NØX profile.
</div>


<a
    id="previewWebsite"
    class="website"
    target="_blank"
    rel="noopener"
></a>


<div class="badges">

<div class="badge">✓</div>
<div class="badge">◆</div>
<div class="badge">⚡</div>

</div>


</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let user = null;
let profile = null;


const $ = id =>
    document.getElementById(id);


/* =========================
AUTH
========================= */

async function start(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if(error)
            throw error;


        if(!data.user){

            window.location.href =
                "login.html";

            return;

        }


        user =
            data.user;


        await loadProfile();

    }

    catch(error){

        console.error(error);

        showError(
            "No se pudo cargar tu sesión."
        );

    }

}


/* =========================
LOAD
========================= */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();


    if(error)
        throw error;


    profile =
        data;


    $("username").value =
        profile.username || "nox";


    $("displayName").value =
        profile.display_name || "NØX";


    $("bio").value =
        profile.bio ||
        "This is my NØX profile.";


    $("website").value =
        profile.website_url || "";


    $("accentColor").value =
        profile.accent_color ||
        "#ffffff";


    $("effect").value =
        profile.profile_effect ||
        "none";


    if(profile.avatar_url){

        $("avatar").src =
            profile.avatar_url;

    }


    if(profile.banner_url){

        $("banner")
        .style
        .backgroundImage =
        `url("${profile.banner_url}")`;

    }


    if(profile.background_url){

        $("preview")
        .style
        .backgroundImage =
        `url("${profile.background_url}")`;

    }


    updatePreview();

    usernameStatus();

}


/* =========================
USERNAME
========================= */

function usernameStatus(){

    const old =
        (
            profile.username ||
            ""
        ).toLowerCase();


    const current =
        $("username")
        .value
        .trim()
        .toLowerCase();


    if(old === current){

        $("usernameInfo")
        .textContent =
        "Username actual.";

        return;

    }


    if(!profile.username_changed_at){

        $("usernameInfo")
        .textContent =
        "✓ Puedes cambiarlo ahora. Después tendrás que esperar 7 días.";

        return;

    }


    const next =
        new Date(
            profile.username_changed_at
        ).getTime()
        +
        7*24*60*60*1000;


    const left =
        next - Date.now();


    if(left <= 0){

        $("usernameInfo")
        .textContent =
        "✓ Puedes cambiar tu username.";

        return;

    }


    const days =
        Math.ceil(
            left /
            (24*60*60*1000)
        );


    $("usernameInfo")
    .textContent =
    `🔒 Podrás cambiarlo nuevamente en ${days} día(s).`;

}


/* =========================
PREVIEW
========================= */

function updatePreview(){

    const username =
        $("username")
        .value
        .trim();


    const name =
        $("displayName")
        .value
        .trim();


    const bio =
        $("bio")
        .value
        .trim();


    $("previewUsername")
    .textContent =
    "@" +
    (username || "nox");


    $("previewName")
    .textContent =
    name || "NØX";


    $("previewBio")
    .textContent =
    bio ||
    "This is my NØX profile.";


    const color =
        $("accentColor").value;


    document.documentElement
    .style
    .setProperty(
        "--accent",
        color
    );


    $("colorText")
    .textContent =
    color.toUpperCase();


    const website =
        $("website")
        .value
        .trim();


    if(website){

        $("previewWebsite")
        .style.display =
        "inline";

        $("previewWebsite")
        .href =
        website;

        $("previewWebsite")
        .textContent =
        website;

    }else{

        $("previewWebsite")
        .style.display =
        "none";

    }


    $("preview")
    .classList.toggle(
        "floating",
        $("effect").value ===
        "floating"
    );


    makeParticles();

}


/* =========================
PARTICLES
========================= */

function makeParticles(){

    $("particles")
    .innerHTML = "";


    if(
        $("effect").value !==
        "particles"
    )
        return;


    for(
        let i=0;
        i<30;
        i++
    ){

        const dot =
            document.createElement(
                "div"
            );


        dot.className =
            "dot";


        dot.style.left =
            Math.random()*100+"%";


        dot.style.top =
            Math.random()*100+"%";


        dot.style.animationDelay =
            Math.random()*5+"s";


        $("particles")
        .appendChild(dot);

    }

}


/* =========================
IMAGE UPLOAD
========================= */

async function upload(file,type){

    if(!file)
        return null;


    if(
        file.size >
        15*1024*1024
    ){

        throw new Error(
            "La imagen supera los 15 MB."
        );

    }


    const extension =
        file.name
        .split(".")
        .pop();


    const path =
        `${user.id}/${type}/${crypto.randomUUID()}.${extension}`;


    const {
        error
    } =
    await supabaseClient
    .storage
    .from("profiles")
    .upload(
        path,
        file,
        {
            upsert:false
        }
    );


    if(error)
        throw error;


    const {
        data
    } =
    supabaseClient
    .storage
    .from("profiles")
    .getPublicUrl(path);


    return data.publicUrl;

}


/* =========================
SAVE
========================= */

$("save")
.addEventListener(
    "click",
    async () => {

        const button =
            $("save");


        button.disabled =
            true;

        button.textContent =
            "SAVING...";


        clearMessage();


        try{

            const newUsername =
                $("username")
                .value
                .trim()
                .toLowerCase();


            const oldUsername =
                (
                    profile.username ||
                    ""
                ).toLowerCase();


            /* USERNAME */

            if(
                newUsername !==
                oldUsername
            ){

                const {
                    error
                } =
                await supabaseClient
                .rpc(
                    "change_username",
                    {
                        new_username:
                            newUsername
                    }
                );


                if(error)
                    throw error;

            }


            /* IMAGES */

            let avatar =
                profile.avatar_url ||
                null;


            let banner =
                profile.banner_url ||
                null;


            let background =
                profile.background_url ||
                null;


            const avatarFile =
                $("avatarFile")
                .files[0];


            const bannerFile =
                $("bannerFile")
                .files[0];


            const backgroundFile =
                $("backgroundFile")
                .files[0];


            if(avatarFile){

                avatar =
                    await upload(
                        avatarFile,
                        "avatars"
                    );

            }


            if(bannerFile){

                banner =
                    await upload(
                        bannerFile,
                        "banners"
                    );

            }


            if(backgroundFile){

                background =
                    await upload(
                        backgroundFile,
                        "backgrounds"
                    );

            }


            /* PROFILE */

            const {
                data,
                error
            } =
            await supabaseClient
            .from("profiles")
            .update({

                display_name:
                    $("displayName")
                    .value
                    .trim(),

                bio:
                    $("bio")
                    .value
                    .trim(),

                website_url:
                    $("website")
                    .value
                    .trim(),

                avatar_url:
                    avatar,

                banner_url:
                    banner,

                background_url:
                    background,

                accent_color:
                    $("accentColor")
                    .value,

                profile_effect:
                    $("effect")
                    .value,

                updated_at:
                    new Date()
                    .toISOString()

            })
            .eq(
                "id",
                user.id
            )
            .select()
            .single();


            if(error)
                throw error;


            profile =
                data;


            showSuccess(
                "✓ Cambios guardados correctamente."
            );


            updatePreview();

            usernameStatus();


            $("avatarFile").value =
                "";

            $("bannerFile").value =
                "";

            $("backgroundFile").value =
                "";


        }

        catch(error){

            console.error(
                "NØX ERROR:",
                error
            );


            showError(
                error.message ||
                "No se pudieron guardar los cambios."
            );

        }


        button.disabled =
            false;

        button.textContent =
            "SAVE CHANGES";

    }
);


/* =========================
LIVE
========================= */

[
    "username",
    "displayName",
    "bio",
    "website",
    "accentColor",
    "effect"
]
.forEach(
    id => {

        $(id)
        .addEventListener(
            "input",
            updatePreview
        );

        $(id)
        .addEventListener(
            "change",
            updatePreview
        );

    }
);


$("username")
.addEventListener(
    "input",
    () => {

        $("username").value =
            $("username")
            .value
            .toLowerCase()
            .replace(
                /[^a-z0-9_]/g,
                ""
            );


        usernameStatus();

    }
);


/* =========================
AVATAR PREVIEW
========================= */

$("avatarFile")
.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];


        if(!file)
            return;


        $("avatar").src =
            URL.createObjectURL(
                file
            );

    }
);


/* =========================
BANNER PREVIEW
========================= */

$("bannerFile")
.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];


        if(!file)
            return;


        $("banner")
        .style
        .backgroundImage =
        `url("${URL.createObjectURL(file)}")`;

    }
