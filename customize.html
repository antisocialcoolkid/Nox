<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Customize</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --accent:#ffffff;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1050px,94%);
    margin:35px auto 70px;
}

.header{
    margin-bottom:25px;
}

.title{
    font-size:36px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:6px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 410px;
    gap:20px;
}

.card,
.preview{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
}

.card{
    padding:25px;
}

.section{
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #181818;
}

.section:last-child{
    border-bottom:0;
    margin-bottom:0;
}

.section-title{
    color:#555;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:800;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    background:#070707;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    outline:none;
    padding:12px;
    margin-bottom:16px;
}

input{
    height:46px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#777;
}

.file{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    border:1px dashed #303030;
    border-radius:10px;
    color:#777;
    cursor:pointer;
    margin-bottom:14px;
    transition:.2s;
}

.file:hover{
    border-color:#777;
    color:#fff;
    background:#0e0e0e;
}

.file input{
    display:none;
}

.social-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.social-grid input{
    margin:0;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:60px;
    height:42px;
    padding:3px;
    margin:0;
}

.color-value{
    color:#777;
    font-size:11px;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.save:hover{
    transform:translateY(-2px);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
}

.status{
    min-height:20px;
    text-align:center;
    margin-top:13px;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff5555;
}


/* PROFILE LINK */

.profile-tools{
    margin-top:15px;
}

.profile-button{
    width:100%;
    height:46px;
    border:1px solid #292929;
    border-radius:10px;
    background:#080808;
    color:#fff;
    cursor:pointer;
    font-weight:800;
    font-size:11px;
    transition:.2s;
}

.profile-button:hover{
    background:#151515;
    border-color:#666;
    transform:translateY(-1px);
}

.profile-result{
    display:none;
    margin-top:10px;
}

.profile-result input{
    margin-bottom:8px;
}

.profile-result button{
    margin-top:8px;
}


/* PREVIEW */

.preview{
    overflow:hidden;
    position:sticky;
    top:20px;
    height:max-content;
}

.banner{
    height:190px;
    background:
        radial-gradient(
            circle at 50% 0%,
            #292929,
            #070707 65%
        );
    background-size:cover;
    background-position:center;
}

.banner:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 25%,
        #0b0b0b
    );
}

.banner{
    position:relative;
}

.profile{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 25px 30px;
    margin-top:-62px;
}

.avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0b0b0b;
}

.name{
    margin-top:12px;
    font-size:25px;
    font-weight:900;
}

.username{
    color:#666;
    font-size:11px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:12px;
    line-height:1.5;
    margin:15px auto;
    max-width:330px;
}

.website{
    display:none;
    color:var(--accent);
    font-size:11px;
    text-decoration:none;
}

.socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
}

.social{
    display:none;
    padding:8px 10px;
    border:1px solid #292929;
    border-radius:8px;
    color:#888;
    text-decoration:none;
    font-size:10px;
}

.social:hover{
    color:var(--accent);
    border-color:var(--accent);
}

.badges{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:20px;
}

.badge{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
    font-size:14px;
}

.badge.early{
    color:#fff;
    border-color:#555;
}

@media(max-width:850px){
    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }
}

@media(max-width:550px){
    .social-grid{
        grid-template-columns:1fr;
    }

    .title{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="title">Customize</div>
    <div class="subtitle">
        Customize your NØX identity.
    </div>
</div>

<div class="layout">

<!-- EDITOR -->

<div class="card">

<div class="section">

<div class="section-title">IDENTITY</div>

<input
    id="username"
    type="text"

>

<div style="
color:#555;
font-size:10px;
margin-top:-9px;
margin-bottom:17px;
">
Username actual. El cambio de username
se controla por separado.
</div>

<label>DISPLAY NAME</label>

<input
    id="displayName"

>

    id="bio"

></textarea>

<input
    id="website"

>

<!-- MEDIA -->

<div class="section">

📷 CHOOSE PROFILE PHOTO

<input

🌌 CHOOSE BACKGROUND

<input

<!-- PREVIEW -->

<div
    id="preview"

>

></div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qvqhanioapefeyxtbzlp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hJVj-2VGj2hEXUgc91QY1Q_zGjw9qp1";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const $ = id =>
document.getElementById(id);

let currentUser = null;
let currentProfile = null;


/* =========================
   STATUS
========================= */

function showStatus(text,type=""){

    $("status").textContent =
        text;

    $("status").className =
        "status " + type;
}


/* =========================
   URL
========================= */

function normalizeUrl(value){

    if(!value)
        return "";

    if(
        value.startsWith("https://") ||
        value.startsWith("http://")
    ){
        return value;
    }

    return "https://" + value;
}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const username =
        $("username").value.trim();

    const displayName =
        $("displayName").value.trim();

    const bio =
        $("bio").value.trim();

    const website =
        $("website").value.trim();

    const color =
        $("accentColor").value;


    $("previewUsername").textContent =
        "@" + (username || "nox");

    $("previewName").textContent =
        displayName || "NØX";

    $("previewBio").textContent =
        bio || "This is my NØX profile.";

    $("colorValue").textContent =
        color.toUpperCase();

    document.documentElement.style
        .setProperty(
            "--accent",
            color
        );


    if(website){

        $("websitePreview").style.display =
            "inline";

        $("websitePreview").href =
            normalizeUrl(website);

        $("websitePreview").textContent =
            website;

    }else{

        $("websitePreview").style.display =
            "none";

    }


    updateSocial("discord","discordPreview");
    updateSocial("instagram","instagramPreview");
    updateSocial("tiktok","tiktokPreview");
    updateSocial("youtube","youtubePreview");
    updateSocial("github","githubPreview");
    updateSocial("twitter","twitterPreview");
}


/* =========================
   SOCIAL
========================= */

function updateSocial(inputId,outputId){

    const value =
        $(inputId).value.trim();

    const element =
        $(outputId);

    if(!value){

        element.style.display =
            "none";

        return;
    }

    element.style.display =
        "inline-block";

    element.href =
        normalizeUrl(value);
}


/* =========================
   PROFILE LINK
========================= */

function getProfileUrl(){

    const username =
        $("username")
        .value
        .trim()
        .toLowerCase();

    if(!username){

        showStatus(
            "Primero escribe un username.",
            "error"
        );

        return null;
    }

    return (
        window.location.origin +
        "/@" +
        encodeURIComponent(username)
    );
}


/* =========================
   GENERATE PROFILE
========================= */

$("generateProfile")
.addEventListener(
    "click",
    function(){

        const url =
            getProfileUrl();

        if(!url)
            return;

        $("profileUrl").value =
            url;

        $("profileResult").style.display =
            "block";
    }
);


/* =========================
   COPY PROFILE
========================= */

$("copyProfile")
.addEventListener(
    "click",
    async function(){

        const url =
            $("profileUrl").value;

        if(!url)
            return;

        try{

            await navigator.clipboard
                .writeText(url);

            this.textContent =
                "COPIED ✓";

            setTimeout(
                () => {
                    this.textContent =
                        "📋 COPY LINK";
                },
                1500
            );

        }catch(error){

            $("profileUrl").select();

            document.execCommand("copy");

        }
    }
);


/* =========================
   VIEW PROFILE
========================= */

$("viewProfile")
.addEventListener(
    "click",
    function(){

        const url =
            getProfileUrl();

        if(!url)
            return;

        window.location.href =
            url;
    }
);


/* =========================
   USERNAME
========================= */

$("username")
.addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .toLowerCase()
            .replace(
                /[^a-z0-9_]/g,
                ""
            );

        updatePreview();


        if(
            $("profileResult").style.display ===
            "block"
        ){

            const url =
                getProfileUrl();

            if(url){

                $("profileUrl").value =
                    url;
            }
        }
    }
);


/* =========================
   LIVE INPUTS
========================= */

[
    "displayName",
    "bio",
    "website",
    "discord",
    "instagram",
    "tiktok",
    "youtube",
    "github",
    "twitter",
    "accentColor"
]
.forEach(
    id => {

        $(id).addEventListener(
            "input",
            updatePreview
        );

    }
);


/* =========================
   AVATAR PREVIEW
========================= */

$("avatarFile")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;

        $("avatar").src =
            URL.createObjectURL(file);
    }
);


/* =========================
   BANNER PREVIEW
========================= */

$("bannerFile")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;

        $("banner").style.backgroundImage =
            `url("${URL.createObjectURL(file)}")`;
    }
);


/* =========================
   BACKGROUND PREVIEW
========================= */

$("backgroundFile")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;

        $("preview").style.backgroundImage =
            `url("${URL.createObjectURL(file)}")`;
    }
);


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    try{

        const result =
            await supabaseClient.auth.getUser();

        if(result.error)
            throw result.error;

        if(!result.data.user){

            showStatus(
                "No hay una sesión iniciada.",
                "error"
            );

            return;
        }

        currentUser =
            result.data.user;


        const profile =
            await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(profile.error)
            throw profile.error;


        if(!profile.data){

            showStatus(
                "No existe tu perfil.",
                "error"
            );

            return;
        }


        currentProfile =
            profile.data;


        $("username").value =
            profile.data.username || "";

        $("displayName").value =
            profile.data.display_name || "NØX";

        $("bio").value =
            profile.data.bio ||
            "This is my NØX profile.";

        $("website").value =
            profile.data.website_url || "";

        $("accentColor").value =
            profile.data.accent_color ||
            "#ffffff";


        if(profile.data.avatar_url){

            $("avatar").src =
                profile.data.avatar_url;
        }


        if(profile.data.banner_url){

            $("banner").style.backgroundImage =
                `url("${profile.data.banner_url}")`;
        }


        if(profile.data.background_url){

            $("preview").style.backgroundImage =
                `url("${profile.data.background_url}")`;
        }


        const socials =
            profile.data.social_links || {};


        $("discord").value =
            socials.discord || "";

        $("instagram").value =
            socials.instagram || "";

        $("tiktok").value =
            socials.tiktok || "";

        $("youtube").value =
            socials.youtube || "";

        $("github").value =
            socials.github || "";

        $("twitter").value =
            socials.twitter || "";


        updatePreview();


    }catch(error){

        console.error(
            "NØX LOAD ERROR:",
            error
        );

        showStatus(
            "⚠️ " + error.message,
            "error"
        );
    }
}


/* =========================
   SAVE
========================= */

$("save")
.addEventListener(
    "click",
    async function(){

        try{

            if(!currentUser){

                throw new Error(
                    "No hay una sesión iniciada."
                );
            }


            this.disabled =
                true;

            this.textContent =
                "SAVING...";


            showStatus(
                "Guardando..."
            );


            const socialLinks = {

                discord:
                    $("discord").value.trim(),

                instagram:
                    $("instagram").value.trim(),

                tiktok:
                    $("tiktok").value.trim(),

                youtube:
                    $("youtube").value.trim(),

                github:
                    $("github").value.trim(),

                twitter:
                    $("twitter").value.trim()

            };


            const update =
                await supabaseClient
                .from("profiles")
                .update({

                    display_name:
                        $("displayName")
                        .value
                        .trim(),

                    bio:
                        $("bio")
                        .value
                        .trim(),

                    website_url:
                        $("website")
                        .value
                        .trim(),

                    accent_color:
                        $("accentColor").value,

                    social_links:
                        socialLinks

                })
                .eq(
                    "id",
                    currentUser
