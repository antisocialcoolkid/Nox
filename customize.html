<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Customize</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --accent:#ffffff;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1100px,94%);
    margin:35px auto 70px;
}

.header{
    margin-bottom:25px;
}

.title{
    font-size:36px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:6px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 410px;
    gap:20px;
}

.card,
.preview{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
}

.card{
    padding:25px;
}

.section{
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #181818;
}

.section:last-child{
    border-bottom:0;
    margin-bottom:0;
}

.section-title{
    color:#555;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:800;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    background:#070707;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    outline:none;
    padding:12px;
    margin-bottom:16px;
}

input{
    height:46px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#777;
}

.file{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    border:1px dashed #303030;
    border-radius:10px;
    color:#777;
    cursor:pointer;
    margin-bottom:14px;
    transition:.2s;
}

.file:hover{
    border-color:#777;
    color:#fff;
    background:#0e0e0e;
}

.file input{
    display:none;
}

.social-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.social-grid input{
    margin:0;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:60px;
    height:42px;
    padding:3px;
    margin:0;
}

.color-value{
    color:#777;
    font-size:11px;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.save:hover{
    transform:translateY(-2px);
}

.save:disabled{
    opacity:.5;
    cursor:wait;
    transform:none;
}

.message{
    min-height:20px;
    text-align:center;
    margin-top:13px;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff5555;
}


/* PROFILE LINK */

.profile-link-box{
    margin-top:15px;
    display:none;
}

.profile-link{
    display:flex;
    gap:8px;
}

.profile-link input{
    margin:0;
}

.copy{
    width:100px;
    border:1px solid #292929;
    border-radius:10px;
    background:#111;
    color:#fff;
    cursor:pointer;
}

.copy:hover{
    background:#181818;
}

.view-profile{
    width:100%;
    height:46px;
    margin-top:10px;
    border:1px solid #292929;
    border-radius:10px;
    background:#080808;
    color:#fff;
    cursor:pointer;
}

.view-profile:hover{
    border-color:#666;
}


/* PREVIEW */

.preview{
    overflow:hidden;
    position:sticky;
    top:20px;
    height:max-content;
}

.banner{
    height:190px;
    position:relative;
    background:
        radial-gradient(
            circle at 50% 0%,
            #292929,
            #070707 65%
        );
    background-size:cover;
    background-position:center;
}

.banner:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        transparent 25%,
        #0b0b0b
    );
}

.profile{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 25px 30px;
    margin-top:-62px;
}

.avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0b0b0b;
}

.name{
    margin-top:12px;
    font-size:25px;
    font-weight:900;
}

.username{
    color:#666;
    font-size:11px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:12px;
    line-height:1.5;
    margin:15px auto;
    max-width:330px;
}

.website{
    display:none;
    color:var(--accent);
    font-size:11px;
    text-decoration:none;
}

.socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
}

.social{
    display:none;
    padding:8px 10px;
    border:1px solid #292929;
    border-radius:8px;
    color:#888;
    text-decoration:none;
    font-size:10px;
}

.social:hover{
    color:var(--accent);
    border-color:var(--accent);
}

.badges{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:20px;
}

.badge{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
    font-size:14px;
}

.badge.early{
    color:#fff;
    border-color:#555;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }

@media(max-width:550px){

    .social-grid{
        grid-template-columns:1fr;
    }

    .profile-link{
        flex-direction:column;
    }

    .copy{
        width:100%;
        height:45px;
    }

    .title{
        font-size:30px;
    }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://qvqhanioapefeyxtbzlp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_hJVj-2VGj2hEXUgc91QY1Q_zGjw9qp1";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentProfile = null;


const $ = id =>
    document.getElementById(id);


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type=""
){

    $("message").textContent =
        text;

    $("message").className =
        "message " + type;

}


/* =========================
   NORMALIZE URL
========================= */

function normalizeUrl(
    value
){

    if(
        value.startsWith("https://") ||
        value.startsWith("http://")
    ){

        return value;

    }

    return "https://" + value;

}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    const username =
        $("username")
        .value
        .trim();

    const name =
        $("displayName")
        .value
        .trim();

    const bio =
        $("bio")
        .value
        .trim();

    const website =
        $("website")
        .value
        .trim();

    const color =
        $("accentColor")
        .value;


    $("previewUsername")
        .textContent =
        "@" +
        (username || "nox");


    $("previewName")
        .textContent =
        name || "NØX";


    $("previewBio")
        .textContent =
        bio ||
        "This is my NØX profile.";


    $("colorValue")
        .textContent =
        color.toUpperCase();


    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );


    if(website){

        $("websitePreview")
            .style.display =
            "inline";

        $("websitePreview")
            .href =
            normalizeUrl(
                website
            );

        $("websitePreview")
            .textContent =
            website;

    }
    else{

        $("websitePreview")
            .style.display =
            "none";

    }


    updateSocial(
        "discord",
        "discordPreview"
    );

    updateSocial(
        "instagram",
        "instagramPreview"
    );

    updateSocial(
        "tiktok",
        "tiktokPreview"
    );

    updateSocial(
        "youtube",
        "youtubePreview"
    );

    updateSocial(
        "github",
        "githubPreview"
    );

    updateSocial(
        "twitter",
        "twitterPreview"
    );

}


/* =========================
   SOCIAL PREVIEW
========================= */

function updateSocial(
    input,
    output
){

    const value =
        $(input)
        .value
        .trim();

    const element =
        $(output);


    if(!value){

        element.style.display =
            "none";

        return;

    }


    element.style.display =
        "inline-block";

    element.href =
        normalizeUrl(value);

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    try{

        const userResult =
            await supabaseClient
            .auth
            .getUser();


        if(userResult.error)
            throw userResult.error;


        if(!userResult.data.user){

            showMessage(
                "No hay una sesión iniciada.",
                "error"
            );

            return;

        }


        currentUser =
            userResult.data.user;


        const result =
            await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(result.error)
            throw result.error;


        if(!result.data){

            showMessage(
                "No existe tu perfil.",
                "error"
            );

            return;

        }


        currentProfile =
            result.data;


        $("username").value =
            currentProfile.username ||
            "";


        $("displayName").value =
            currentProfile.display_name ||
            "NØX";


        $("bio").value =
            currentProfile.bio ||
            "This is my NØX profile.";


        $("website").value =
            currentProfile.website_url ||
            "";


        $("accentColor").value =
            currentProfile.accent_color ||
            "#ffffff";


        $("profileEffect").value =
            currentProfile.profile_effect ||
            "none";


        if(
            currentProfile.avatar_url
        ){

            $("avatar").src =
                currentProfile.avatar_url;

        }


        if(
            currentProfile.banner_url
        ){

            $("banner")
            .style
            .backgroundImage =
            `url("${currentProfile.banner_url}")`;

        }


        if(
            currentProfile.background_url
        ){

            $("preview")
            .style
            .backgroundImage =
            `url("${currentProfile.background_url}")`;

        }


        const socials =
            currentProfile.social_links ||
            {};


        $("discord").value =
            socials.discord || "";

        $("instagram").value =
            socials.instagram || "";

        $("tiktok").value =
            socials.tiktok || "";

        $("youtube").value =
            socials.youtube || "";

        $("github").value =
            socials.github || "";

        $("twitter").value =
            socials.twitter || "";


        updatePreview();


        generateProfileLink();


    }
    catch(error){

        console.error(
            "NØX LOAD ERROR:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================
   UPLOAD
========================= */

async function uploadFile(
    file,
    folder
){

    if(!file)
        return null;


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        throw new Error(
            "El archivo debe ser una imagen."
        );

    }


    if(
        file.size >
        10 * 1024 * 1024
    ){

        throw new Error(
            "La imagen supera los 10 MB."
        );

    }


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const path =
        currentUser.id +
        "/" +
        folder +
        "/" +
        crypto.randomUUID() +
        "." +
        extension;


    const upload =
        await supabaseClient
        .storage
        .from("profiles")
        .upload(
            path,
            file
        );


    if(upload.error)
        throw upload.error;


    const result =
        supabaseClient
        .storage
        .from("profiles")
        .getPublicUrl(
            path
        );


    return result.data.publicUrl;

}


/* =========================
   PROFILE LINK
========================= */

function generateProfileLink(){

    const username =
        $("username")
        .value
        .trim();


    if(!username)
        return;


    const link =
        window.location.origin +
        "/" +
        encodeURIComponent(
            username
        );


    $("profileLink").value =
        link;


    $("profileLinkBox")
        .style
        .display =
        "block";

}


$("copyLink")
.addEventListener(
    "click",
    async function(){

        const link =
            $("profileLink")
            .value;


        try{

            await navigator
                .clipboard
                .writeText(link);


            this.textContent =
                "COPIED ✓";


            setTimeout(
                () => {
                    this.textContent =
                        "COPY";
                },
                1500
            );

        }
        catch{

            $("profileLink")
                .select();

            document.execCommand(
                "copy"
            );

        }

    }
);


$("viewProfile")
.addEventListener(
    "click",
    function(){

        const username =
            $("username")
            .value
            .trim();


        if(!username)
            return;


        /*
         * Si tu Vercel usa /profile.html?username=nox,
         * cambia esta línea por:
         *
         * /profile.html?username=
         */

        const url =
            window.location.origin +
            "/" +
            encodeURIComponent(
                username
            );


        window.location.href =
            url;

    }
);


/* =========================
   LIVE INPUTS
========================= */

[
    "username",
    "displayName",
    "bio",
    "website",
    "discord",
    "instagram",
    "tiktok",
    "youtube",
    "github",
    "twitter",
    "accentColor"
]
.forEach(
    id => {

        $(id)
        .addEventListener(
            "input",
            function(){

                updatePreview();

                if(
                    id === "username"
                ){

                    generateProfileLink();

                }

            }
        );

    }
);


/* =========================
   USERNAME
========================= */

$("username")
.addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .toLowerCase()
            .replace(
                /[^a-z0-9_]/g,
                ""
            );

        generateProfileLink();

    }
);


/* =========================
   AVATAR PREVIEW
========================= */

$("avatarFile")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;


        $("avatar").src =
            URL.createObjectURL(
                file
            );

    }
);


/* =========================
   BANNER PREVIEW
========================= */

$("bannerFile")
.addE
