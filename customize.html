<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NØX — Customize</title>

<style>
*{box-sizing:border-box}

:root{--accent:#fff}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1100px,94%);
    margin:35px auto 70px;
}

.title{
    font-size:36px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin:6px 0 25px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 410px;
    gap:20px;
}

.card,.preview{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
}

.card{padding:25px}

.section{
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #181818;
}

.section:last-child{
    border:0;
    margin:0;
}

.section-title{
    color:#555;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:800;
    margin-bottom:7px;
}

input,textarea{
    width:100%;
    background:#070707;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    outline:none;
    padding:12px;
    margin-bottom:16px;
}

input{height:46px}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,textarea:focus{
    border-color:#777;
}

.file{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    border:1px dashed #303030;
    border-radius:10px;
    color:#777;
    cursor:pointer;
    margin-bottom:14px;
}

.file:hover{
    color:#fff;
    border-color:#777;
}

.file input{display:none}

.social-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.social-grid input{margin:0}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:60px;
    height:42px;
    padding:3px;
    margin:0;
}

.color-value{
    color:#777;
    font-size:11px;
}

button{
    font-family:inherit;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-weight:900;
    cursor:pointer;
}

.save:disabled{
    opacity:.5;
    cursor:wait;
}

.status{
    min-height:20px;
    text-align:center;
    margin:13px 0;
    font-size:11px;
}

.success{color:#aaa}
.error{color:#ff5555}

.profile-tools{
    margin-top:15px;
}

.tool{
    width:100%;
    height:46px;
    margin-top:9px;
    border:1px solid #292929;
    border-radius:10px;
    background:#080808;
    color:#fff;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.tool:hover{
    border-color:#666;
    background:#111;
}

.profile-result{
    display:none;
    margin-top:12px;
}

.profile-result input{
    margin:0;
}

.preview{
    overflow:hidden;
    position:sticky;
    top:20px;
    height:max-content;
    background-size:cover;
    background-position:center;
}

.banner{
    height:190px;
    position:relative;
    background:
        radial-gradient(circle at 50% 0%,#292929,#070707 65%);
    background-size:cover;
    background-position:center;
}

.banner:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 20%,#0b0b0b);
}

.profile{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 25px 30px;
    margin-top:-62px;
}

.avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0b0b0b;
}

.name{
    margin-top:12px;
    font-size:25px;
    font-weight:900;
}

.username{
    color:#666;
    font-size:11px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:12px;
    line-height:1.5;
    margin:15px auto;
}

.website{
    display:none;
    color:var(--accent);
    font-size:11px;
}

.socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
}

.social{
    display:none;
    padding:8px 10px;
    border:1px solid #292929;
    border-radius:8px;
    color:#888;
    text-decoration:none;
    font-size:10px;
}

.badges{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:20px;
}

.badge{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
}

.badge.early{
    color:#fff;
    border-color:#555;
}

@media(max-width:850px){
    .layout{grid-template-columns:1fr}
    .preview{
        position:relative;
        top:0;
        order:-1;
    }
}

@media(max-width:550px){
    .social-grid{grid-template-columns:1fr}
    .title{font-size:30px}
}
</style>
</head>

<body>

<div class="container">

<div class="title">Customize</div>
<div class="subtitle">Customize your NØX identity.</div>

<div class="layout">

<div class="card">

<div class="section">

<div class="section-title">IDENTITY</div>

<label>USERNAME</label>
<input id="username" maxlength="20" autocomplete="off">

<label>DISPLAY NAME</label>
<input id="displayName" maxlength="30">

<label>BIO</label>
<textarea id="bio" maxlength="160"></textarea>

<label>WEBSITE</label>
<input id="website" placeholder="https://example.com">

</div>


<div class="section">

<div class="section-title">MEDIA</div>

<label>PROFILE PICTURE</label>
<label class="file">
📷 CHOOSE PROFILE PHOTO
<input id="avatarFile" type="file" accept="image/*">
</label>

<label>BANNER</label>
<label class="file">
🖼️ CHOOSE BANNER
<input id="bannerFile" type="file" accept="image/*">
</label>

<label>BACKGROUND</label>
<label class="file">
🌌 CHOOSE BACKGROUND
<input id="backgroundFile" type="file" accept="image/*">
</label>

</div>


<div class="section">

<div class="section-title">SOCIAL LINKS</div>

<div class="social-grid">
<input id="discord" placeholder="Discord">
<input id="instagram" placeholder="Instagram">
<input id="tiktok" placeholder="TikTok">
<input id="youtube" placeholder="YouTube">
<input id="github" placeholder="GitHub">
<input id="twitter" placeholder="X / Twitter">
</div>

</div>


<div class="section">

<div class="section-title">STYLE</div>

<label>ACCENT COLOR</label>

<div class="color-row">
<input id="accentColor" type="color" value="#ffffff">
<span id="colorValue">#FFFFFF</span>
</div>

</div>


<button id="save" class="save">
SAVE CHANGES
</button>

<div id="status" class="status"></div>


<div class="profile-tools">

<button id="generate" class="tool">
🔗 GENERATE PROFILE LINK
</button>

<div id="profileResult" class="profile-result">

<input id="profileUrl" readonly>

<button id="copy" class="tool">
📋 COPY LINK
</button>

<button id="view" class="tool">
👁 VIEW PROFILE
</button>

</div>

</div>

</div>


<div id="preview" class="preview">

<div id="banner" class="banner"></div>

<div class="profile">

<img id="avatar" class="avatar" alt="Avatar">

<div id="pName" class="name">NØX</div>

<div id="pUsername" class="username">@nox</div>

<div id="pBio" class="bio">
This is my NØX profile.
</div>

<a id="pWebsite"
   class="website"
   target="_blank"
   rel="noopener">
</a>

<div class="socials">

<a id="pDiscord" class="social" target="_blank">Discord</a>
<a id="pInstagram" class="social" target="_blank">Instagram</a>
<a id="pTiktok" class="social" target="_blank">TikTok</a>
<a id="pYoutube" class="social" target="_blank">YouTube</a>
<a id="pGithub" class="social" target="_blank">GitHub</a>
<a id="pTwitter" class="social" target="_blank">X</a>

</div>

<div class="badges">

<div class="badge early" title="Early Access">◆</div>
<div class="badge" title="Verified">✓</div>
<div class="badge" title="Developer">⚡</div>
<div class="badge" title="OG">★</div>

</div>

</div>
</div>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://qvqhanioapefeyxtbzlp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hJVj-2VGj2hEXUgc91QY1Q_zGjw9qp1";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const $ = id =>
document.getElementById(id);

let user = null;
let avatarUrl = null;
let bannerUrl = null;
let backgroundUrl = null;


/* STATUS */

function status(text,type=""){
    $("status").textContent = text;
    $("status").className = "status " + type;
}


/* URL */

function url(value){

    if(!value) return "";

    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){
        return value;
    }

    return "https://" + value;
}


/* PREVIEW */

function preview(){

    const username =
        $("username").value.trim();

    const name =
        $("displayName").value.trim();

    const bio =
        $("bio").value.trim();

    const website =
        $("website").value.trim();

    const accent =
        $("accentColor").value;

    $("pUsername").textContent =
        "@" + (username || "nox");

    $("pName").textContent =
        name || "NØX";

    $("pBio").textContent =
        bio || "This is my NØX profile.";

    $("colorValue").textContent =
        accent.toUpperCase();

    document.documentElement.style
        .setProperty("--accent",accent);


    if(website){

        $("pWebsite").style.display =
            "inline";

        $("pWebsite").href =
            url(website);

        $("pWebsite").textContent =
            website;

    }else{

        $("pWebsite").style.display =
            "none";

    }


    social("discord","pDiscord");
    social("instagram","pInstagram");
    social("tiktok","pTiktok");
    social("youtube","pYoutube");
    social("github","pGithub");
    social("twitter","pTwitter");
}


function social(input,output){

    const value =
        $(input).value.trim();

    if(!value){

        $(output).style.display =
            "none";

        return;
    }

    $(output).style.display =
        "inline-block";

    $(output).href =
        url(value);
}


/* UPLOAD */

async function upload(file,type){

    if(!file) return null;

    if(!file.type.startsWith("image/")){
        throw new Error("Solo se permiten imágenes.");
    }

    if(file.size > 10 * 1024 * 1024){
        throw new Error(
            "La imagen supera los 10 MB."
        );
    }

    const ext =
        file.name.split(".").pop().toLowerCase();

    const path =
        user.id +
        "/" +
        type +
        "-" +
        Date.now() +
        "." +
        ext;

    const result =
        await db.storage
        .from("profiles")
        .upload(
            path,
            file,
            {
                upsert:true,
                contentType:file.type
            }
        );

    if(result.error)
        throw result.error;

    const publicUrl =
        db.storage
        .from("profiles")
        .getPublicUrl(path);

    return publicUrl.data.publicUrl;
}


/* LOAD */

async function load(){

    try{

        const result =
            await db.auth.getUser();

        if(result.error)
            throw result.error;

        user = result.data.user;

        if(!user){

            status(
                "No hay una sesión iniciada.",
                "error"
            );

            return;
        }


        const resultProfile =
            await db
            .from("profiles")
            .select("*")
            .eq("id",user.id)
            .maybeSingle();


        if(resultProfile.error)
            throw resultProfile.error;


        if(!resultProfile.data){

            status(
                "No existe tu perfil.",
                "error"
            );

            return;
        }


        const p =
            resultProfile.data;


        $("username").value =
            p.username || "";

        $("displayName").value =
            p.display_name || "NØX";

        $("bio").value =
            p.bio || "";

        $("website").value =
            p.website_url || "";

        $("accentColor").value =
            p.accent_color || "#ffffff";


        avatarUrl =
            p.avatar_url || null;

        bannerUrl =
            p.banner_url || null;

        backgroundUrl =
            p.background_url || null;


        if(avatarUrl)
            $("avatar").src = avatarUrl;

        if(bannerUrl)
            $("banner").style.backgroundImage =
                `url("${bannerUrl}")`;

        if(backgroundUrl)
            $("preview").style.backgroundImage =
                `url("${backgroundUrl}")`;


        const socials =
            p.social_links || {};

        $("discord").value =
            socials.discord || "";

        $("instagram").value =
            socials.instagram || "";

        $("tiktok").value =
            socials.tiktok || "";

        $("youtube").value =
            socials.youtube || "";

        $("github").value =
            socials.github || "";

        $("twitter").value =
            socials.twitter || "";


        preview();

    }catch(e){

        console.error(e);

        status(
            "⚠️ " + e.message,
            "error"
        );
    }
}


/* SAVE */

$("save").addEventListener(
"click",
async function(){

    const button = this;

    try{

        if(!user)
            throw new Error(
                "No hay una sesión iniciada."
            );


        button.disabled = true;
        button.textContent = "SAVING...";

        status("Guardando...");


        /* AVATAR */

        const avatarFile =
            $("avatarFile").files[0];

        if(avatarFile){

            avatarUrl =
                await upload(
                    avatarFile,
                    "avatar"
                );
        }


        /* BANNER */

        const bannerFile =
            $("bannerFile").files[0];

        if(bannerFile){

            bannerUrl =
                await upload(
                    bannerFile,
                    "banner"
                );
        }


        /* BACKGROUND */

        const backgroundFile =
            $("backgroundFile").files[0];

        if(backgroundFile){

            backgroundUrl =
                await upload(
                    backgroundFile,
                    "background"
                );
        }


        const socialLinks = {

            discord:
                $("discord").value.trim(),

            instagram:
                $("instagram").value.trim(),

            tiktok:
                $("tiktok").value.trim(),

            youtube:
                $("youtube").value.trim(),

            github:
                $("github").value.trim(),

            twitter:
                $("twitter").value.trim()
        };


        const update =
            await db
            .from("profiles")
            .update({

                display_name:
                    $("displayName").value.trim(),

                bio:
                    $("bio").value.trim(),

                website_url:
                    $("website").value.trim(),

                accent_color:
                    $("accentColor").value,

                social_links:
                    socialLinks,

                avatar_url:
                    avatarUrl,

                banner_url:
                    bannerUrl,

                background_url:
                    backgroundUrl

            })
            .eq("id",user.id);


        if(update.error)
            throw update.error;


        status(
            "✓ Cambios guardados correctamente.",
            "success"
        );

    }catch(e){

        console.error(e);

        status(
            "⚠️ " + e.message,
            "error"
        );

    }finally{

        button.disabled = false;
        button.textContent = "SAVE CHANGES";
    }
});


/* FILE PREVIEWS */

$("avatarFile").addEventListener(
"change",
function(){

    const file = this.files[0];

    if(file)
        $("avatar").src =
            URL.createObjectURL(file);
});


$("bannerFile").addEventListener(
"change",
function(){

    const file = this.files[0];

    if(file)
        $("banner").style.backgroundImage =
            `url("${URL.createObjectURL(file)}")`;
});


$("backgroundFile").addEventListener(
"change",
function(){

    const file = this.files[0];

    if(file)
        $("preview").style.backgroundImage =
            `url("${URL.createObjectURL(file)}")`;
});


/* LIVE PREVIEW */

[
    "username",
    "displayName",
    "bio",
    "website",
    "discord",
    "instagram",
    "tiktok",
    "youtube",
    "github",
    "twitter",
    "accentColor"
].forEach(id => {

    $(id).addEventListener(
        "input",
        preview
    );
});


$("username").addEventListener(
"input",
function(){

    this.value =
        this.value
        .toLowerCase()
        .replace(
            /[^a-z0-9_]/g,
            ""
        );
});


/* GENERATE LINK */

$("generate").addEventListener(
"click",
function(){

    const username =
        $("username")
        .value
        .trim()
        .toLowerCase();

    if(!username){

        status(
            "Escribe un username primero.",
            "error"
        );

        return;
    }


    const profile =
        window.location.origin +
        "/profile.html?username=" +
        encodeURIComponent(username);


    $("profileUrl").value =
        profile;

    $("profileResult").style.display =
        "block";
});


/* COPY */

$("copy").addEventListener(
"click",
async function(){

    const value =
        $("profileUrl").value;

    try{

        await navigator.clipboard
            .writeText(value);

        this.textContent =
            "COPIED ✓";

        setTimeout(
            () => {
                this.textContent =
                    "📋 COPY LINK";
            },
            1500
        );

    }catch(e){

        $("profileUrl").select();
        document.execCommand("copy");

    }
});


/* VIEW */

$("view").addEventListener(
"click",
function(){

    const username =
        $("username")
        .value
        .trim()
        .toLowerCase();

    if(!username) return;

    window.location.href =
        "profile.html?username=" +
        encodeURIComponent(username);
});


/* START */

load();
preview();

</script>

</body>
</html>
