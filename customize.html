<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Customize</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --accent:#ffffff;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(1100px,94%);
    margin:35px auto 70px;
}

.header{
    margin-bottom:25px;
}

.title{
    font-size:36px;
    font-weight:900;
}

.subtitle{
    color:#666;
    font-size:12px;
    margin-top:6px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 410px;
    gap:20px;
}

.card,
.preview{
    background:#0b0b0b;
    border:1px solid #252525;
    border-radius:20px;
}

.card{
    padding:25px;
}

.section{
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #181818;
}

.section-title{
    color:#555;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    margin-bottom:16px;
}

label{
    display:block;
    color:#777;
    font-size:10px;
    font-weight:800;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    background:#070707;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    outline:none;
    padding:12px;
    margin-bottom:16px;
}

input{
    height:46px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.file{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    border:1px dashed #303030;
    border-radius:10px;
    color:#777;
    cursor:pointer;
    margin-bottom:14px;
}

.file:hover{
    border-color:#777;
    color:#fff;
}

.file input{
    display:none;
}

.social-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.social-grid input{
    margin:0;
}

.color-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.color-row input{
    width:60px;
    height:42px;
    padding:3px;
    margin:0;
}

.save{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#fff;
    color:#000;
    font-weight:900;
    cursor:pointer;
}

.save:disabled{
    opacity:.5;
}

.message{
    min-height:20px;
    text-align:center;
    margin-top:13px;
    font-size:11px;
}

.success{
    color:#aaa;
}

.error{
    color:#ff5555;
}

.profile-tools{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #181818;
}

.tool-button{
    width:100%;
    height:48px;
    border:1px solid #292929;
    border-radius:10px;
    background:#080808;
    color:#fff;
    cursor:pointer;
    font-weight:800;
    margin-top:8px;
}

.tool-button:first-child{
    margin-top:0;
}

.tool-button:hover{
    border-color:#666;
}

.link-box{
    display:none;
    margin-top:10px;
}

.link-box input{
    margin-bottom:8px;
}

.preview{
    overflow:hidden;
    position:sticky;
    top:20px;
    height:max-content;
}

.banner{
    height:190px;
    background:
        radial-gradient(
            circle at 50% 0%,
            #292929,
            #070707 65%
        );
    background-size:cover;
    background-position:center;
}

.profile{
    text-align:center;
    padding:0 25px 30px;
    margin-top:-62px;
}

.avatar{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0b0b0b;
}

.name{
    margin-top:12px;
    font-size:25px;
    font-weight:900;
}

.username{
    color:#666;
    font-size:11px;
    margin-top:5px;
}

.bio{
    color:#999;
    font-size:12px;
    line-height:1.5;
    margin:15px auto;
}

.website{
    display:none;
    color:var(--accent);
    font-size:11px;
}

.socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:16px;
}

.social{
    display:none;
    padding:8px 10px;
    border:1px solid #292929;
    border-radius:8px;
    color:#888;
    text-decoration:none;
    font-size:10px;
}

.badges{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:20px;
}

.badge{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
}

.badge.early{
    color:#fff;
    border-color:#555;
}

.status{
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #181818;
    color:#666;
    font-size:10px;
    line-height:2;
}

.status span{
    color:#aaa;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
        order:-1;
    }
}

@media(max-width:550px){

    .social-grid{
        grid-template-columns:1fr;
    }

    .title{
        font-size:30px;
    }
}
</style>
</head>

<body>

        <div

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://qvqhanioapefeyxtbzlp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_hJVj-2VGj2hEXUgc91QY1Q_zGjw9qp1";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;


/* =========================
   HELPERS
========================= */

function $(id){

    return document.getElementById(id);

}


function showMessage(
    text,
    type
){

    $("message").textContent =
        text;

    $("message").className =
        "message " +
        (type || "");

}


function safeUrl(value){

    value =
        value.trim();

    if(!value){
        return "";
    }

    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){

        return value;

    }

    return "https://" + value;

}


/* =========================
   PREVIEW
========================= */

function updatePreview(){

    $("previewName").textContent =
        $("displayName").value.trim()
        || "NØX";


    $("previewUsername").textContent =
        "@" +
        (
            $("username").value.trim()
            || "nox"
        );


    $("previewBio").textContent =
        $("bio").value.trim()
        || "Dueño de NØX";


    const color =
        $("accentColor").value;


    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );


    $("colorValue").textContent =
        color.toUpperCase();


    const website =
        $("website").value.trim();


    if(website){

        $("previewWebsite")
            .style.display =
            "inline";

        $("previewWebsite")
            .href =
            safeUrl(website);

        $("previewWebsite")
            .textContent =
            website;

    }else{

        $("previewWebsite")
            .style.display =
            "none";

    }


    updateSocial(
        "discord",
        "previewDiscord"
    );

    updateSocial(
        "instagram",
        "previewInstagram"
    );

    updateSocial(
        "tiktok",
        "previewTiktok"
    );

    updateSocial(
        "youtube",
        "previewYoutube"
    );

    updateSocial(
        "github",
        "previewGithub"
    );

    updateSocial(
        "twitter",
        "previewTwitter"
    );

}


function updateSocial(
    inputId,
    outputId
){

    const value =
        $(inputId).value.trim();


    const output =
        $(outputId);


    if(!value){

        output.style.display =
            "none";

        return;

    }


    output.style.display =
        "inline-block";

    output.href =
        safeUrl(value);

}


/* =========================
   AUTH + PROFILE
========================= */

async function start(){

    try{

        const result =
            await supabaseClient
            .auth
            .getUser();


        if(result.error){

            throw result.error;

        }


        currentUser =
            result.data.user;


        if(!currentUser){

            showMessage(
                "No hay una sesión iniciada.",
                "error"
            );

            return;

        }


        await loadProfile();


    }catch(error){

        console.error(error);

        showMessage(
            "Error: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   LOAD
========================= */

async function loadProfile(){

    const result =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(result.error){

        throw result.error;

    }


    if(!result.data){

        showMessage(
            "No existe tu perfil.",
            "error"
        );

        return;

    }


    const p =
        result.data;


    $("username").value =
        p.username || "";


    $("displayName").value =
        p.display_name || "NØX";


    $("bio").value =
        p.bio || "Dueño de NØX";


    $("website").value =
        p.website_url || "";


    $("accentColor").value =
        p.accent_color || "#ffffff";


    if(p.avatar_url){

        $("avatar").src =
            p.avatar_url;

    }


    if(p.banner_url){

        $("banner")
            .style
            .backgroundImage =
            'url("' +
            p.banner_url +
            '")';

    }


    if(p.background_url){

        $("preview")
            .style
            .backgroundImage =
            'url("' +
            p.background_url +
            '")';

    }


    const socials =
        p.social_links || {};


    $("discord").value =
        socials.discord || "";

    $("instagram").value =
        socials.instagram || "";

    $("tiktok").value =
        socials.tiktok || "";

    $("youtube").value =
        socials.youtube || "";

    $("github").value =
        socials.github || "";

    $("twitter").value =
        socials.twitter || "";


    updatePreview();

}


/* =========================
   SAVE
========================= */

$("save").addEventListener(
    "click",
    async function(){

        if(!currentUser){

            showMessage(
                "No hay una sesión iniciada.",
                "error"
            );

            return;

        }


        const button =
            $("save");


        try{

            button.disabled =
                true;

            button.textContent =
                "SAVING...";


            const socialLinks = {

                discord:
                    $("discord").value.trim(),

                instagram:
                    $("instagram").value.trim(),

                tiktok:
                    $("tiktok").value.trim(),

                youtube:
                    $("youtube").value.trim(),

                github:
                    $("github").value.trim(),

                twitter:
                    $("twitter").value.trim()

            };


            const data = {

                display_name:
                    $("displayName")
                    .value
                    .trim(),

                bio:
                    $("bio")
                    .value
                    .trim(),

                website_url:
                    $("website")
                    .value
                    .trim(),

                accent_color:
                    $("accentColor")
                    .value,

                social_links:
                    socialLinks

            };
