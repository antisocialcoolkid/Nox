<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#030303"
    >

    <title>NØX — Login</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #030303;
            --card: rgba(15,15,15,.72);
            --border: rgba(255,255,255,.09);
            --text: #fff;
            --muted: #666;
        }

        html,
        body {
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background: var(--bg);

            color: var(--text);

            font-family: "Inter", sans-serif;

            overflow-x: hidden;

        }


        /* =========================
           BACKGROUND
        ========================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:

                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );

        }


        .glow {

            position: fixed;

            width: 500px;

            height: 500px;

            border-radius: 50%;

            background: white;

            filter: blur(160px);

            opacity: .055;

            top: -300px;

            left: 50%;

            transform:
                translateX(-50%);

            pointer-events: none;

        }


        /* =========================
           CARD
        ========================= */

        .login-card {

            position: relative;

            width: min(430px, 100%);

            padding: 42px 35px;

            border:
                1px solid
                var(--border);

            border-radius: 22px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.012)
                );

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 40px 100px
                rgba(0,0,0,.7);

            animation:
                appear .7s ease forwards;

        }


        .login-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 12%;

            right: 12%;

            height: 1px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            font-size: 31px;

            font-weight: 900;

            letter-spacing: -2.5px;

        }


        .subtitle {

            margin-top: 9px;

            text-align: center;

            color: var(--muted);

            font-size: 11px;

        }


        .line {

            width: 45px;

            height: 1px;

            margin: 23px auto 0;

            background:
                rgba(255,255,255,.2);

        }


        /* =========================
           FORM
        ========================= */

        form {

            margin-top: 30px;

        }


        .field {

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #777;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        input {

            width: 100%;

            height: 49px;

            padding: 0 14px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 10px;

            background: #080808;

            color: white;

            font-family: inherit;

            font-size: 12px;

            transition: .25s;

        }


        input:hover {

            border-color:
                rgba(255,255,255,.13);

        }


        input:focus {

            border-color:
                rgba(255,255,255,.28);

            background: #0b0b0b;

            box-shadow:
                0 0 0 3px
                rgba(255,255,255,.025);

        }


        input::placeholder {

            color: #3f3f3f;

        }


        /* =========================
           FORGOT PASSWORD
        ========================= */

        .forgot {

            display: block;

            margin-top: -7px;

            margin-bottom: 18px;

            text-align: right;

            color: #555;

            font-size: 10px;

            text-decoration: none;

            transition: .2s;

        }


        .forgot:hover {

            color: white;

        }


        /* =========================
           BUTTON
        ========================= */

        button {

            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 10px;

            background: white;

            color: black;

            font-family: inherit;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: .5px;

            cursor: pointer;

            transition: .25s;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 40px
                rgba(255,255,255,.1);

        }


        button:active {

            transform:
                translateY(0);

        }


        button:disabled {

            opacity: .5;

            cursor: wait;

            transform: none;

            box-shadow: none;

        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            min-height: 18px;

            margin-top: 17px;

            text-align: center;

            font-size: 10px;

            line-height: 1.6;

        }


        .message.error {

            color: #ff6b6b;

        }


        .message.success {

            color: #aaa;

        }


        /* =========================
           REGISTER
        ========================= */

        .register {

            margin-top: 25px;

            text-align: center;

            color: #555;

            font-size: 10px;

        }


        .register a {

            color: white;

            text-decoration: none;

            font-weight: 600;

        }


        .register a:hover {

            text-decoration: underline;

        }


        /* =========================
           BACK
        ========================= */

        .back {

            position: fixed;

            top: 25px;

            left: 25px;

            color: #555;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            transition: .25s;

        }


        .back:hover {

            color: white;

            transform:
                translateX(-2px);

        }


        /* =========================
           BRAND
        ========================= */

        .brand {

            margin-top: 28px;

            text-align: center;

            color: #2f2f2f;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 3px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:500px) {

            .login-card {

                padding:
                    35px 22px;

            }

            .back {

                top: 18px;

                left: 18px;

            }

        }

    </style>

</head>


<body>


    <div class="glow"></div>


    <a
        href="index.html"
        class="back"
    >
        ← NØX
    </a>


    <main class="login-card">


        <div class="logo">
            NØX
        </div>


        <div class="subtitle">
            Welcome back.
        </div>


        <div class="line"></div>


        <form
            id="loginForm"
            novalidate
        >


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    EMAIL
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- FORGOT -->

            <a
                href="forgot-password.html"
                class="forgot"
            >
                Forgot password?
            </a>


            <!-- LOGIN -->

            <button
                id="loginButton"
                type="submit"
            >
                LOGIN
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>


        </form>


        <!-- REGISTER -->

        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </div>


        <div class="brand">
            YOUR IDENTITY. YOUR VOID.
        </div>


    </main>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="supabase.js"></script>


    <!-- =========================
         LOGIN
    ========================= -->

    <script>

        const form =
            document.getElementById(
                "loginForm"
            );


        const button =
            document.getElementById(
                "loginButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        /*
        =========================
        MESSAGE
        =========================
        */

        function showMessage(
            text,
            type = ""
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        /*
        =========================
        LOGIN
        =========================
        */

        form.addEventListener(
            "submit",
            async function(event) {

                /*
                Evita que el navegador
                recargue la página.
                */

                event.preventDefault();

                event.stopPropagation();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                /*
                VALIDACIÓN
                */

                if (!email) {

                    showMessage(
                        "Introduce tu email.",
                        "error"
                    );

                    return;

                }


                if (!password) {

                    showMessage(
                        "Introduce tu contraseña.",
                        "error"
                    );

                    return;

                }


                /*
                COMPROBAR SUPABASE
                */

                if (
                    typeof supabaseClient ===
                    "undefined"
                ) {

                    showMessage(
                        "Supabase no está cargando. Revisa supabase.js.",
                        "error"
                    );

                    return;

                }


                /*
                ESTADO
                */

                button.disabled =
                    true;

                button.textContent =
                    "LOGGING IN...";

                showMessage("");


                try {


                    /*
                    SIGN IN
                    */

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({

                                email:
                                    email,

                                password:
                                    password

                            });


                    /*
                    ERROR
                    */

                    if (error) {

                        throw error;

                    }


                    /*
                    SESIÓN
                    */

                    if (
                        !data ||
                        !data.session ||
                        !data.user
                    ) {

                        throw new Error(
                            "No se pudo crear la sesión."
                        );

                    }


                    /*
                    LOGIN CORRECTO
                    */

                    showMessage(
                        "Login correcto. Entrando...",
                        "success"
                    );


                    button.textContent =
                        "WELCOME";


                    /*
                    ESPERAR UN MOMENTO
                    */

                    setTimeout(
                        function() {

                            window.location.href =
                                "dashboard.html";

                        },
                        600
                    );


                } catch(error) {


                    console.error(
                        "NØX Login Error:",
                        error
                    );


                    let text =
                        error.message ||
                        "No se pudo iniciar sesión.";


                    /*
                    MENSAJES MÁS LIMPIOS
                    */

                    const lower =
                        text.toLowerCase();


                    if (
                        lower.includes(
                            "invalid login credentials"
                        )
                    ) {

                        text =
                            "Email o contraseña incorrectos.";

                    }


                    else if (
                        lower.includes(
                            "email not confirmed"
                        )
                    ) {

                        text =
                            "Tu email todavía no está confirmado.";

                    }


                    else if (
                        lower.includes(
                            "too many requests"
                        )
                    ) {

                        text =
                            "Demasiados intentos. Espera un momento.";

                    }


                    else if (
                        lower.includes(
                            "rate limit"
                        )
                    ) {

                        text =
                            "Demasiados intentos. Espera un momento.";

                    }


                    showMessage(
                        text,
                        "error"
                    );


                    button.disabled =
                        false;

                    button.textContent =
                        "LOGIN";

                }

            }
        );


    </script>


</body>

</html>
