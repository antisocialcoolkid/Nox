<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NØX — Login</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #050505;
            --border: rgba(255,255,255,.09);
            --muted: #666;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background: #050505;

            color: white;

            font-family: "Inter", sans-serif;

        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );

        }


        .glow {

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: white;

            filter: blur(160px);

            opacity: .05;

            top: -300px;

            left: 50%;

            transform: translateX(-50%);

        }


        .login-card {

            position: relative;

            width: min(430px, 100%);

            padding: 42px 35px;

            border:
                1px solid
                var(--border);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.012)
                );

            backdrop-filter: blur(25px);

            box-shadow:
                0 40px 100px
                rgba(0,0,0,.7);

            animation:
                appear .7s ease forwards;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .logo {

            text-align: center;

            font-size: 29px;

            font-weight: 800;

            letter-spacing: -2px;

        }


        .subtitle {

            margin-top: 8px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;

        }


        form {

            margin-top: 35px;

        }


        .field {

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #777;

            font-size: 10px;

            letter-spacing: 1px;

        }


        input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 10px;

            background: #090909;

            color: white;

            font-family: inherit;

            font-size: 12px;

            transition: .25s;

        }


        input:focus {

            border-color:
                rgba(255,255,255,.25);

        }


        input::placeholder {

            color: #3f3f3f;

        }


        button {

            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: 0;

            border-radius: 10px;

            background: white;

            color: black;

            font-family: inherit;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            transition: .3s;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 40px
                rgba(255,255,255,.1);

        }


        button:disabled {

            opacity: .5;

            cursor: wait;

            transform: none;

        }


        .message {

            min-height: 18px;

            margin-top: 17px;

            text-align: center;

            font-size: 11px;

            line-height: 1.5;

        }


        .message.error {

            color: #ff6b6b;

        }


        .message.success {

            color: #aaa;

        }


        .register {

            margin-top: 25px;

            text-align: center;

            color: #555;

            font-size: 11px;

        }


        .register a {

            color: white;

            text-decoration: none;

        }


        .register a:hover {

            text-decoration: underline;

        }


        .back {

            position: fixed;

            top: 25px;

            left: 25px;

            color: #555;

            text-decoration: none;

            font-size: 11px;

        }


        .back:hover {

            color: white;

        }


        .brand {

            margin-top: 28px;

            text-align: center;

            color: #2f2f2f;

            font-size: 9px;

            letter-spacing: 3px;

        }


        @media(max-width:500px) {

            .login-card {

                padding:
                    35px 22px;

            }

            .back {

                top: 18px;

                left: 18px;

            }

        }

    </style>

</head>


<body>

    <div class="glow"></div>


    <a
        href="index.html"
        class="back"
    >
        ← NØX
    </a>


    <main class="login-card">


        <div class="logo">
            NØX
        </div>


        <div class="subtitle">
            Welcome back.
        </div>


        <form id="loginForm">


            <div class="field">

                <label>
                    EMAIL
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label>
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                id="loginButton"
                type="submit"
            >
                LOGIN
            </button>


            <div
                id="message"
                class="message"
            ></div>


        </form>


        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </div>


        <div class="brand">
            YOUR IDENTITY. YOUR VOID.
        </div>


    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        const form =
            document.getElementById(
                "loginForm"
            );

        const button =
            document.getElementById(
                "loginButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type = ""
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                button.disabled =
                    true;

                button.textContent =
                    "LOGGING IN...";

                showMessage("");


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({

                                email:
                                    email,

                                password:
                                    password

                            });


                    if (error) {

                        throw error;

                    }


                    if (!data.session) {

                        throw new Error(
                            "No se pudo iniciar la sesión."
                        );

                    }


                    showMessage(
                        "Login correcto. Entrando...",
                        "success"
                    );


                    button.textContent =
                        "WELCOME";


                    setTimeout(() => {

                        window.location.href =
                            "dashboard.html";

                    }, 700);


                } catch (error) {

                    console.error(
                        "NØX Login Error:",
                        error
                    );


                    let text =
                        error.message ||
                        "No se pudo iniciar sesión.";


                    if (
                        text
                            .toLowerCase()
                            .includes(
                                "invalid login credentials"
                            )
                    ) {

                        text =
                            "Email o contraseña incorrectos.";

                    }


                    showMessage(
                        text,
                        "error"
                    );


                    button.disabled =
                        false;

                    button.textContent =
                        "LOGIN";

                }

            }
        );


    </script>

</body>

</html>
