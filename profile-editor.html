<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#030303;
    --panel:#0b0b0b;
    --border:rgba(255,255,255,.09);
    --text:#fff;
    --muted:#666;
}

body{

    min-height:100vh;

    padding:30px;

    background:
        radial-gradient(
            circle at top,
            rgba(255,255,255,.05),
            transparent 35%
        ),
        var(--bg);

    color:white;

    font-family:
        Inter,
        Arial,
        sans-serif;

}

.container{

    width:min(1050px,100%);

    margin:auto;

}

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}

.logo{

    font-size:26px;

    font-weight:900;

    letter-spacing:-2px;

}

.back{

    color:#666;

    text-decoration:none;

    font-size:11px;

}

.back:hover{

    color:white;

}

.layout{

    display:grid;

    grid-template-columns:
        1fr
        360px;

    gap:20px;

}

.panel{

    padding:25px;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.01)
        );

    backdrop-filter:blur(20px);

}

.title{

    font-size:15px;

    font-weight:800;

}

.subtitle{

    margin-top:5px;

    color:#555;

    font-size:10px;

}

.field{

    margin-top:22px;

}

label.title-label{

    display:block;

    margin-bottom:8px;

    color:#777;

    font-size:9px;

    font-weight:800;

    letter-spacing:1.3px;

}

input,
textarea{

    width:100%;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:10px;

    background:#080808;

    color:white;

    outline:none;

    font-family:inherit;

    font-size:12px;

}

input{

    height:47px;

    padding:0 13px;

}

textarea{

    min-height:100px;

    padding:13px;

    resize:vertical;

}

input:focus,
textarea:focus{

    border-color:
        rgba(255,255,255,.3);

}

.username-row{

    display:flex;

    gap:8px;

}

.username-row input{

    flex:1;

}

.username-info{

    margin-top:7px;

    color:#444;

    font-size:9px;

}

.username-info.ready{

    color:#777;

}

.upload{

    display:flex;

    align-items:center;

    gap:10px;

}

.file-input{

    display:none;

}

.upload-button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    height:42px;

    padding:0 14px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:9px;

    background:#0c0c0c;

    color:#aaa;

    font-size:10px;

    font-weight:800;

    cursor:pointer;

}

.upload-button:hover{

    color:white;

    border-color:
        rgba(255,255,255,.25);

}

.preview-small{

    width:42px;

    height:42px;

    object-fit:cover;

    border-radius:9px;

    background:#161616;

}

.color-row{

    display:flex;

    gap:10px;

}

.color{

    width:55px;

    padding:4px;

}

.save{

    width:100%;

    height:50px;

    margin-top:28px;

    border:0;

    border-radius:10px;

    background:white;

    color:black;

    font-family:inherit;

    font-size:10px;

    font-weight:900;

    cursor:pointer;

}

.save:hover{

    transform:translateY(-2px);

}

.save:disabled{

    opacity:.5;

    cursor:wait;

}

.message{

    min-height:18px;

    margin-top:14px;

    text-align:center;

    font-size:10px;

}

.error{

    color:#ff6b6b;

}

.success{

    color:#aaa;

}


/* PREVIEW */

.preview{

    padding:0;

    overflow:hidden;

    position:sticky;

    top:30px;

}

.preview-banner{

    height:125px;

    background:
        linear-gradient(
            135deg,
            #171717,
            #050505
        );

    background-position:center;

    background-size:cover;

}

.preview-content{

    padding:
        0
        20px
        25px;

}

.preview-avatar{

    width:78px;

    height:78px;

    margin-top:-39px;

    object-fit:cover;

    border:
        4px solid
        #0b0b0b;

    border-radius:50%;

    background:#151515;

}

.preview-name{

    margin-top:12px;

    font-size:18px;

    font-weight:800;

}

.preview-username{

    margin-top:3px;

    color:#555;

    font-size:10px;

}

.preview-bio{

    margin-top:17px;

    color:#aaa;

    font-size:11px;

    line-height:1.6;

    white-space:pre-wrap;

}

.preview-website{

    display:none;

    margin-top:15px;

    color:white;

    font-size:10px;

    text-decoration:none;

}

.discord{

    margin-top:20px;

    padding:12px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:10px;

    color:#666;

    font-size:10px;

}

@media(max-width:800px){

    body{
        padding:18px;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .preview{
        position:relative;
        top:0;
    }

}

</style>

</head>

></script>

<script src="supabase.js"></script>


<script>


let currentUser = null;

let profile = null;


/* ELEMENTS */

const username =
    document.getElementById(
        "username"
    );

const usernameInfo =
    document.getElementById(
        "usernameInfo"
    );

const displayName =
    document.getElementById(
        "displayName"
    );

const bio =
    document.getElementById(
        "bio"
    );

const website =
    document.getElementById(
        "website"
    );

const accentColor =
    document.getElementById(
        "accentColor"
    );

const avatar =
    document.getElementById(
        "avatar"
    );

const banner =
    document.getElementById(
        "banner"
    );

const background =
    document.getElementById(
        "background"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const message =
    document.getElementById(
        "message"
    );


/* MESSAGE */

function showMessage(
    text,
    type=""
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* INIT */

async function init(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getUser();


        if(error)
            throw error;


        if(!data.user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            data.user;


        await loadProfile();


    }catch(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* LOAD */

async function loadProfile(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .single();


    if(error)
        throw error;


    profile =
        data;


    username.value =
        profile.username || "";


    displayName.value =
        profile.display_name || "";


    bio.value =
        profile.bio || "";


    website.value =
        profile.website_url || "";


    accentColor.value =
        profile.accent_color ||
        "#ffffff";


    updateUsernameInfo();


    if(profile.avatar_url){

        avatarPreview.src =
            profile.avatar_url;

        previewAvatar.src =
            profile.avatar_url;

    }


    if(profile.banner_url){

        previewBanner.style.backgroundImage =
            `url("${profile.banner_url}")`;

    }


    previewName.textContent =
        profile.display_name ||
        "NØX";


    previewUsername.textContent =
        "@" +
        (profile.username || "");


    previewBio.textContent =
        profile.bio ||
        "Your bio will appear here.";


    if(profile.website_url){

        previewWebsite.href =
            profile.website_url;

        previewWebsite.style.display =
            "block";

    }


    if(profile.discord_username){

        discordStatus.textContent =
            profile.discord_username;

        previewDiscord.textContent =
            "Discord • " +
            profile.discord_username;

    }

}


/* USERNAME STATUS */

function updateUsernameInfo(){

    if(!profile)
        return;


    const current =
        profile.username || "";


    if(
        username.value.trim().toLowerCase()
        ===
        current.toLowerCase()
    ){

        if(!profile.username_changed_at){

            usernameInfo.textContent =
                "Username disponible para cambiar.";

            usernameInfo.className =
                "username-info ready";

            return;

        }


        const last =
            new Date(
                profile.username_changed_at
            );

        const next =
            new Date(
                last.getTime()
                +
                7 * 24 * 60 * 60 * 1000
            );


        if(
            Date.now() >=
            next.getTime()
        ){

            usernameInfo.textContent =
                "Puedes cambiar tu username.";

            usernameInfo.className =
                "username-info ready";

        }else{

            const days =
                Math.ceil(
                    (
                        next.getTime()
                        -
                        Date.now()
                    )
                    /
                    (
                        24 *
                        60 *
                        60 *
                        1000
                    )
                );

            usernameInfo.textContent =
                `Podrás cambiarlo en ${days} día(s).`;

        }

    }

}


/* USERNAME INPUT */

username.addEventListener(
    "input",
    updateUsernameInfo
);


/* UPLOAD */

async function uploadFile(
    file,
    bucket
){

    if(!file)
        return null;


    if(
        ![
            "image/png",
            "image/jpeg",
            "image/webp"
        ].includes(file.type)
    ){

        throw new Error(
            "Solo PNG, JPG o WEBP."
        );

    }


    if(
        file.size >
        8 * 1024 * 1024
    ){

        throw new Error(
            "La imagen supera los 8 MB."
        );

    }


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const path =
        `${currentUser.id}/${Date.now()}.${extension}`;


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(bucket)
            .upload(
                path,
                file,
                {
                    upsert:true
                }
            );


    if(error)
        throw error;


    const {
        data
    } =
        supabaseClient
            .storage
            .from(bucket)
            .getPublicUrl(path);


    return data.publicUrl;

}


/* SAVE */

saveButton.addEventListener(
    "click",
    async function(){

        saveButton.disabled =
            true;

        saveButton.textContent =
            "SAVING...";

        showMessage("");


        try{

            const newUsername =
                username.value
                    .trim()
                    .toLowerCase();


            /*
            USERNAME
            */

            if(
                newUsername !==
                profile.username
                    .toLowerCase()
            ){

                const {
                    error
                } =
                    await supabaseClient
                        .rpc(
                            "change_username",
                            {
                                new_username:
                                    newUsername
                            }
                        );


                if(error)
                    throw error;


                profile.username =
                    newUsername;


                profile.username_changed_at =
                    new Date().toISOString();

            }


            /*
            FILES
            */

            let avatarUrl =
                profile.avatar_url || "";

            let bannerUrl =
                profile.banner_url || "";

            let backgroundUrl =
                profile.background_url || "";


            if(avatar.files[0]){

                avatarUrl =
                    await uploadFile(
                        avatar.files[0],
                        "avatars"
                    );

            }


            if(banner.files[0]){

                bannerUrl =
                    await uploadFile(
                        banner.files[0],
                        "banners"
                    );

            }


            if(background.files[0]){

                backgroundUrl =
                    await uploadFile(
                        background.files[0],
                        "backgrounds"
                    );

            }


            /*
            PROFILE
            */

            const {
                error:
                    profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .update({

                        display_name:
                            displayName.value
                                .trim(),

                        bio:
                            bio.value
                                .trim(),

                        avatar_url:
                            avatarUrl,

                        banner_url:
                            bannerUrl,

                        background_url:
                            backgroundUrl,

                        accent_color:
                            accentColor.value,

                        website_url:
                            website.value
                                .trim(),

                        updated_at:
                            new Date()
                                .toISOString()

                    })
                    .eq(
                        "id",
                        currentUser.id
                    );


            if(profileError)
                throw profileError;


            profile.display_name =
                displayName.value.trim();

            profile.bio =
                bio.value.trim();

            profile.avatar_url =
                avatarUrl;

            profile.banner_url =
                bannerUrl;

            profile.background_url =
                backgroundUrl;

            profile.accent_color =
                accentColor.value;

            profile.website_url =
                website.value.trim();


            showMessage(
                "Perfil guardado correctamente.",
                "success"
            );


            updatePreview();

            updateUsernameInfo();


        }catch(error){

            console.error(
                "NØX ERROR:",
                error
            );


            let text =
                error.message ||
                "No se pudo guardar.";


            if(
                text.includes(
                    "already occupied"
                )
            ){

                text =
                    "Ese username ya está ocupado.";

            }


            if(
                text.includes(
                    "once every 7 days"
                )
            ){

                text =
                    "Solo puedes cambiar tu username una vez cada 7 días.";

            }


            showMessage(
                text,
                "error"
            );


        }finally{

            saveButton.disabled =
                false;

            saveButton.textContent =
                "SAVE CHANGES";

        }

    }
);


/* PREVIEW */

function updatePreview(){

    previewName.textC
