<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Profile</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:40px 20px;
}

.profile{
    width:min(600px,100%);
    text-align:center;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:3px solid #222;
}

.name{
    margin-top:20px;
    font-size:25px;
    font-weight:800;
}

.username{
    margin-top:5px;
    color:#666;
    font-size:12px;
}

.bio{
    margin:20px auto;
    max-width:450px;
    color:#aaa;
    font-size:13px;
    line-height:1.6;
}

.website{
    color:white;
    text-decoration:none;
    font-size:12px;
}

.card{
    margin-top:30px;
    padding:20px;
    border:1px solid #222;
    border-radius:16px;
    background:#0c0c0c;
}

.error{
    color:#ff6464;
    margin-top:30px;
}
</style>
</head>

<body>

<div class="profile">

<img
    id="avatar"
    class="avatar"
    src=""
    alt="Avatar"
>

<div
    id="name"
    class="name"
>
NØX
</div>

<div
    id="username"
    class="username"
>
@username
</div>

<div
    id="bio"
    class="bio"
></div>

<a
    id="website"
    class="website"
    target="_blank"
    style="display:none"
></a>

<div class="card">

NØX Profile

</div>

<div
    id="error"
    class="error"
></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const usernameParam =
    params.get("username");


const avatar =
    document.getElementById("avatar");

const name =
    document.getElementById("name");

const username =
    document.getElementById("username");

const bio =
    document.getElementById("bio");

const website =
    document.getElementById("website");

const errorElement =
    document.getElementById("error");


async function loadProfile(){

    if(!usernameParam){

        errorElement.textContent =
            "No se especificó un username.";

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient

        .from("profiles")

        .select(`
            username,
            display_name,
            bio,
            avatar_url,
            website_url,
            accent_color
        `)

        .eq(
            "username",
            usernameParam
                .toLowerCase()
        )

        .maybeSingle();


    if(error){

        console.error(error);

        errorElement.textContent =
            "No se pudo cargar el perfil.";

        return;

    }


    if(!data){

        errorElement.textContent =
            "Este perfil no existe.";

        return;

    }


    name.textContent =
        data.display_name ||
        data.username;


    username.textContent =
        "@" +
        data.username;


    bio.textContent =
        data.bio ||
        "";


    if(data.avatar_url){

        avatar.src =
            data.avatar_url;

    }else{

        avatar.style.display =
            "none";

    }


    if(data.website_url){

        website.href =
            data.website_url;

        website.textContent =
            data.website_url;

        website.style.display =
            "inline-block";

    }


    if(data.accent_color){

        document.documentElement
            .style
            .setProperty(
                "--accent",
                data.accent_color
            );

    }

}


loadProfile();

</script>

</body>
</html>
