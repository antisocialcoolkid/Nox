<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NØX — Profile</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#ffffff;
}

html,body{
    min-height:100%;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    padding:30px 15px 60px;
    overflow-x:hidden;
}

#background{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(
            circle at 50% 0%,
            #202020 0%,
            #090909 45%,
            #030303 100%
        );
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.background-overlay{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
        radial-gradient(
            circle at 50% 20%,
            transparent 0%,
            rgba(0,0,0,.35) 55%,
            rgba(0,0,0,.8) 100%
        );
    pointer-events:none;
}

.profile{
    width:min(650px,100%);
    text-align:center;
}

.profile-card{
    overflow:hidden;
    background:rgba(10,10,10,.94);
    border:1px solid #242424;
    border-radius:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.55);
    backdrop-filter:blur(15px);
}

.banner{
    width:100%;
    height:210px;
    position:relative;
    background:
        radial-gradient(
            circle at 50% 0%,
            #292929,
            #070707 70%
        );
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(10,10,10,.15) 45%,
            #0a0a0a 100%
        );
}

.profile-content{
    position:relative;
    margin-top:-60px;
    padding:0 25px 30px;
}

.avatar{
    width:115px;
    height:115px;
    border-radius:50%;
    object-fit:cover;
    background:#111;
    border:4px solid #0a0a0a;
    box-shadow:0 10px 35px rgba(0,0,0,.5);
}

.name{
    margin-top:14px;
    font-size:27px;
    font-weight:900;
    letter-spacing:-.7px;
}

.username{
    margin-top:6px;
    color:#666;
    font-size:12px;
}

.bio{
    margin:17px auto;
    max-width:470px;
    color:#999;
    font-size:13px;
    line-height:1.6;
}

.website{
    display:none;
    color:var(--accent);
    text-decoration:none;
    font-size:12px;
    margin-top:5px;
}

.website:hover{
    text-decoration:underline;
}

.socials{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
}

.social{
    display:none;
    padding:8px 11px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:9px;
    color:#888;
    text-decoration:none;
    font-size:10px;
    transition:.2s;
}

.social:hover{
    color:var(--accent);
    border-color:var(--accent);
    transform:translateY(-2px);
}

.badges{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:21px;
}

.badge{
    width:35px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:9px;
    color:#777;
    font-size:14px;
}

.badge.early{
    color:#fff;
    border-color:#555;
}

.status{
    margin-top:20px;
    color:#444;
    font-size:9px;
    letter-spacing:1.5px;
}

.status span{
    color:#777;
}

.error{
    margin-top:25px;
    color:#ff6464;
    font-size:12px;
}

.loading{
    padding:80px 20px;
    color:#555;
    font-size:11px;
    letter-spacing:1px;
}

.effect-floating .avatar{
    animation:floating 4s ease-in-out infinite;
}

@keyframes floating{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }
}

.effect-glow .avatar{
    box-shadow:
        0 0 0 1px var(--accent),
        0 0 30px var(--accent);
}

.effect-pulse .avatar{
    animation:pulse 2.5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        box-shadow:0 0 0 transparent;
    }

    50%{
        box-shadow:0 0 25px var(--accent);
    }
}

@media(max-width:600px){

    body{
        padding:15px 10px 40px;
    }

    .banner{
        height:175px;
    }

    .profile-content{
        margin-top:-55px;
        padding-left:18px;
        padding-right:18px;
    }

    .avatar{
        width:105px;
        height:105px;
    }

    .name{
        font-size:24px;
    }

    .bio{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div id="background"></div>
<div class="background-overlay"></div>

<div class="profile">

    <div id="loading" class="profile-card loading">
        LOADING PROFILE...
    </div>

    <div
        id="profileCard"
        class="profile-card"
        style="display:none;"
    >

        <div id="banner" class="banner"></div>

        <div class="profile-content">

            <img
                id="avatar"
                class="avatar"
                src=""
                alt="Avatar"
            >

            <div id="name" class="name">
                NØX
            </div>

            <div id="username" class="username">
                @nox
            </div>

            <div id="bio" class="bio"></div>

            <a
                id="website"
                class="website"
                target="_blank"
                rel="noopener noreferrer"
            ></a>

            <div class="socials">

                <a id="discord" class="social"
                   target="_blank"
                   rel="noopener noreferrer">
                    Discord
                </a>

                <a id="instagram" class="social"
                   target="_blank"
                   rel="noopener noreferrer">
                    Instagram
                </a>

                <a id="tiktok" class="social"
                   target="_blank"
                   rel="noopener noreferrer">
                    TikTok
                </a>

                <a id="youtube" class="social"
                   target="_blank"
                   rel="noopener noreferrer">
                    YouTube
                </a>

                <a id="github" class="social"
                   target="_blank"
                   rel="noopener noreferrer">
                    GitHub
                </a>

                <a id="twitter" class="social"
                   target="_blank"
                   rel="noopener noreferrer">
                    X
                </a>

            </div>

            <div class="badges">

                <div class="badge early" title="Early Access">
                    ◆
                </div>

                <div class="badge" title="Verified">
                    ✓
                </div>

                <div class="badge" title="Developer">
                    ⚡
                </div>

                <div class="badge" title="OG">
                    ★
                </div>

            </div>

            <div class="status">
                NØX PROFILE <span>•</span> ONLINE
            </div>

        </div>

    </div>

    <div id="error" class="error"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

/* =========================================
   ELEMENTS
========================================= */

const avatar =
    document.getElementById("avatar");

const banner =
    document.getElementById("banner");

const background =
    document.getElementById("background");

const nameElement =
    document.getElementById("name");

const usernameElement =
    document.getElementById("username");

const bio =
    document.getElementById("bio");

const website =
    document.getElementById("website");

const errorElement =
    document.getElementById("error");

const loading =
    document.getElementById("loading");

const profileCard =
    document.getElementById("profileCard");


/* =========================================
   GET USERNAME
========================================= */

function getUsername(){

    /*
     * Primero intenta:
     *
     * /profile.html?username=nox
     */

    const params =
        new URLSearchParams(
            window.location.search
        );

    let username =
        params.get("username");


    /*
     * Si no existe, intenta:
     *
     * /nox
     */

    if(!username){

        const path =
            window.location.pathname
                .split("/")
                .filter(Boolean);


        if(path.length){

            username =
                path[path.length - 1];

        }

    }


    /*
     * Limpieza
     */

    if(!username){
        return null;
    }


    return decodeURIComponent(
        username
    )
    .trim()
    .toLowerCase();

}


const usernameParam =
    getUsername();


/* =========================================
   URL
========================================= */

function normalizeUrl(value){

    if(!value){
        return "";
    }

    value =
        String(value).trim();

    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){

        return value;

    }

    return "https://" + value;

}


/* =========================================
   SOCIAL
========================================= */

function setSocial(
    id,
    value
){

    const element =
        document.getElementById(id);


    if(!element){
        return;
    }


    if(!value){

        element.style.display =
            "none";

        return;

    }


    element.href =
        normalizeUrl(value);

    element.style.display =
        "inline-block";

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

    try{

        if(!usernameParam){

            throw new Error(
                "No se especificó un username."
            );

        }


        if(
            typeof supabaseClient ===
            "undefined"
        ){

            throw new Error(
                "No se encontró supabase.js."
            );

        }


        console.log(
            "NØX USERNAME:",
            usernameParam
        );


        const result =
            await supabaseClient
                .from("profiles")
                .select(`
                    username,
                    display_name,
                    bio,
                    avatar_url,
                    banner_url,
                    background_url,
                    website_url,
                    social_links,
                    accent_color,
                    profile_effect
                `)
                .eq(
                    "username",
                    usernameParam
                )
                .maybeSingle();


        if(result.error){

            console.error(
                "SUPABASE ERROR:",
                result.error
            );

            throw new Error(
                result.error.message ||
                "No se pudo cargar el perfil."
            );

        }


        if(!result.data){

            throw new Error(
                "Este perfil no existe."
            );

        }


        const data =
            result.data;


        console.log(
            "NØX PROFILE DATA:",
            data
        );


        /* =========================
           BASIC
        ========================= */

        nameElement.textContent =
            data.display_name ||
            data.username ||
            "NØX";


        usernameElement.textContent =
            "@" +
            (
                data.username ||
                usernameParam
            );


        bio.textContent =
            data.bio || "";


        bio.style.display =
            data.bio
            ? "block"
            : "none";


        /* =========================
           ACCENT
        ========================= */

        if(data.accent_color){

            document.documentElement
                .style
                .setProperty(
                    "--accent",
                    data.accent_color
                );

        }


        /* =========================
           EFFECT
        ========================= */

        if(
            data.profile_effect ===
            "floating"
        ){

            profileCard.classList.add(
                "effect-floating"
            );

        }
        else if(
            data.profile_effect ===
            "glow"
        ){

            profileCard.classList.add(
                "effect-glow"
            );

        }
        else if(
            data.profile_effect ===
            "pulse"
        ){

            profileCard.classList.add(
                "effect-pulse"
            );

        }


        /* =========================
           AVATAR
        ========================= */

        if(data.avatar_url){

            avatar.src =
                data.avatar_url;

        }


        /* =========================
           BANNER
        ========================= */

        if(data.banner_url){

            banner.style.backgroundImage =
                "url(" +
                JSON.stringify(
                    data.banner_url
                ) +
                ")";

        }


        /* =========================
           BACKGROUND
        ========================= */

        if(data.background_url){

            background.style.backgroundImage =
                "url(" +
                JSON.stringify(
                    data.background_url
                ) +
                ")";

        }


        /* =========================
           WEBSITE
        ========================= */

        if(data.website_url){

            website.href =
                normalizeUrl(
                    data.website_url
                );

            website.textContent =
                data.website_url;

            website.style.display =
                "inline-block";

        }


        /* =========================
           SOCIALS
        ========================= */

        const socials =
            data.social_links || {};


        setSocial(
            "discord",
            socials.discord
        );

        setSocial(
            "instagram",
            socials.instagram
        );

        setSocial(
            "tiktok",
            socials.tiktok
        );

        setSocial(
            "youtube",
            socials.youtube
        );

        setSocial(
            "github",
            socials.github
        );

        setSocial(
            "twitter",
            socials.twitter
        );


        /* =========================
           TITLE
        ========================= */

        document.title =
            (
                data.display_name ||
                data.username ||
                "NØX"
            ) +
            " — NØX";


        /* =========================
           SHOW
        ========================= */

        loading.style.display =
            "none";

        profileCard.style.display =
            "block";


    }
    catch(error){

        console.error(
            "NØX PROFILE ERROR:",
            error
        );


        loading.style.display =
            "none";

        profileCard.style.display =
            "none";

        errorElement.textContent =
            error.message ||
            "No se pudo cargar el perfil.";

    }

}


/* =========================================
   START
========================================= */

loadProfile();

</script>

</body>
</html>
