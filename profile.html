<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NØX — Profile</title>

    <meta
        name="description"
        content="NØX profile"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .profile-page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .profile-main {
            position: relative;

            width: min(470px, 100%);

            padding: 45px 35px;

            text-align: center;

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.06),
                    rgba(255,255,255,0.015)
                );

            backdrop-filter: blur(30px);

            box-shadow:
                0 40px 120px rgba(0,0,0,0.75),
                inset 0 1px rgba(255,255,255,0.06);

            animation: profileAppear 1s ease forwards;
        }

        @keyframes profileAppear {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }

        .profile-avatar {

            width: 95px;
            height: 95px;

            margin: 0 auto;

            display: grid;
            place-items: center;

            border-radius: 28px;

            background: #101010;

            border: 1px solid rgba(255,255,255,0.14);

            font-size: 32px;

            font-weight: 800;

            box-shadow:
                0 0 60px rgba(255,255,255,0.05);
        }

        .profile-name {

            margin-top: 22px;

            font-size: 27px;

            font-weight: 800;

            letter-spacing: -1px;
        }

        .profile-username {

            display: block;

            margin-top: 6px;

            color: #555;

            font-size: 12px;
        }

        .profile-description {

            max-width: 330px;

            margin: 22px auto 0;

            color: #777;

            font-size: 13px;

            line-height: 1.8;
        }

        .profile-socials {

            display: flex;

            flex-direction: column;

            gap: 9px;

            margin-top: 30px;
        }

        .profile-social {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 48px;

            color: #ddd;

            text-decoration: none;

            font-size: 12px;

            border: 1px solid rgba(255,255,255,0.07);

            border-radius: 11px;

            background: rgba(255,255,255,0.025);

            transition:
                transform .3s ease,
                background .3s ease,
                border .3s ease;
        }

        .profile-social:hover {

            transform: translateY(-3px);

            background: rgba(255,255,255,0.07);

            border-color:
                rgba(255,255,255,0.16);
        }

        .profile-status {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 27px;

            color: #555;

            font-size: 10px;
        }

        .status-online {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 10px white;
        }

        .profile-views {

            margin-top: 22px;

            color: #333;

            font-size: 9px;

            letter-spacing: 1px;
        }

        .nox-watermark {

            position: fixed;

            bottom: 25px;

            left: 50%;

            transform: translateX(-50%);

            color: #333;

            font-size: 10px;

            letter-spacing: 4px;

            font-weight: 700;
        }

        .back-home {

            position: fixed;

            top: 25px;
            left: 25px;

            color: #555;

            text-decoration: none;

            font-size: 11px;

            transition: .3s;
        }

        .back-home:hover {
            color: white;
        }

    </style>

</head>


<body>

    <div class="noise"></div>

    <div class="orb orb-one"></div>

    <div class="orb orb-two"></div>


    <a href="index.html" class="back-home">
        ← NØX
    </a>


    <main class="profile-page">

        <section class="profile-main">

            <div class="profile-avatar">
                N
            </div>


            <h1 class="profile-name">
                NØX
            </h1>


            <span class="profile-username">
                @nox
            </span>


            <p class="profile-description">
                Welcome to my corner of the void.
                Nothing here is accidental.
            </p>


            <div class="profile-socials">

                <a
                    href="https://discord.com/invite/w986WYqQuT"
                    target="_blank"
                    class="profile-social"
                >
                    Discord
                </a>

                <a
                    href="#"
                    class="profile-social"
                >
                    Instagram
                </a>

                <a
                    href="#"
                    class="profile-social"
                >
                    YouTube
                </a>

                <a
                    href="#"
                    class="profile-social"
                >
                    TikTok
                </a>

            </div>


            <div class="profile-status">

                <span class="status-online"></span>

                Online

            </div>


            <div class="profile-views">

                1,284 VIEWS

            </div>

        </section>

    </main>


    <div class="nox-watermark">
        NØX
    </div>


    <script src="script.js"></script>

</body>

  </html>
