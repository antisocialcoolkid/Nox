<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#030303"
    >

    <title>NØX — Create your identity</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #030303;
            --border: rgba(255,255,255,.08);
            --text: #fff;
            --muted: #666;
        }

        html,
        body {
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background: var(--bg);

            color: var(--text);

            font-family:
                "Inter",
                Arial,
                sans-serif;

            overflow-x: hidden;

        }


        /* BACKGROUND */

        .background {

            position: fixed;

            inset: 0;

            z-index: -5;

            background:

                radial-gradient(
                    circle at 50% 10%,
                    rgba(255,255,255,.065),
                    transparent 32%
                ),

                #030303;

        }


        .grid {

            position: fixed;

            inset: 0;

            z-index: -4;

            opacity: .45;

            background-image:

                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );

        }


        .glow {

            position: fixed;

            width: 500px;

            height: 500px;

            top: -350px;

            left: 50%;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background: #fff;

            filter: blur(170px);

            opacity: .055;

            pointer-events: none;

        }


        /* BACK */

        .back {

            position: fixed;

            top: 25px;

            left: 25px;

            color: #555;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            transition: .25s;

        }

        .back:hover {
            color: white;
        }


        /* CARD */

        .register-card {

            position: relative;

            width:
                min(430px, 100%);

            padding:
                42px 35px;

            border:
                1px solid var(--border);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.012)
                );

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 40px 100px
                rgba(0,0,0,.7);

            animation:
                appear .7s ease forwards;

        }


        @keyframes appear {

            from {
                opacity: 0;
                transform:
                    translateY(20px)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* LOGO */

        .logo {

            text-align: center;

            font-size: 31px;

            font-weight: 900;

            letter-spacing: -2.5px;

        }


        .subtitle {

            margin-top: 8px;

            text-align: center;

            color: var(--muted);

            font-size: 11px;

        }


        .line {

            width: 45px;

            height: 1px;

            margin:
                23px auto 0;

            background:
                rgba(255,255,255,.2);

        }


        /* FORM */

        form {
            margin-top: 30px;
        }


        .field {
            margin-bottom: 17px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #777;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        input {

            width: 100%;

            height: 49px;

            padding:
                0 14px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 10px;

            background: #080808;

            color: white;

            font-family: inherit;

            font-size: 12px;

            transition: .25s;

        }


        input:focus {

            border-color:
                rgba(255,255,255,.27);

            background: #0b0b0b;

            box-shadow:
                0 0 0 3px
                rgba(255,255,255,.025);

        }


        input::placeholder {
            color: #3d3d3d;
        }


        .hint {

            margin-top: 7px;

            color: #3d3d3d;

            font-size: 8px;

        }


        /* BUTTON */

        button {

            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: 0;

            border-radius: 10px;

            background: white;

            color: black;

            font-family: inherit;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: .5px;

            cursor: pointer;

            transition: .25s;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 40px
                rgba(255,255,255,.1);

        }


        button:disabled {

            opacity: .5;

            cursor: wait;

            transform: none;

        }


        /* MESSAGE */

        .message {

            min-height: 18px;

            margin-top: 16px;

            text-align: center;

            font-size: 10px;

            line-height: 1.5;

        }


        .message.error {
            color: #ff6b6b;
        }


        .message.success {
            color: #aaa;
        }


        /* LOGIN */

        .login {

            margin-top: 25px;

            text-align: center;

            color: #555;

            font-size: 10px;

        }


        .login a {

            color: white;

            text-decoration: none;

            font-weight: 600;

        }


        .login a:hover {
            text-decoration: underline;
        }


        .brand {

            margin-top: 28px;

            text-align: center;

            color: #2d2d2d;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 3px;

        }


        @media(max-width:500px) {

            body {
                padding: 20px 15px;
            }

            .register-card {
                padding: 35px 22px;
            }

            .back {
                top: 18px;
                left: 18px;
            }

        }

    </style>

</head>


<body>


    <div class="background"></div>

    <div class="grid"></div>

    <div class="glow"></div>


    <a
        href="index.html"
        class="back"
    >
        ← NØX
    </a>


    <main class="register-card">


        <div class="logo">
            NØX
        </div>


        <div class="subtitle">
            Create your identity.
        </div>


        <div class="line"></div>


        <form
            id="registerForm"
            novalidate
        >


            <div class="field">

                <label for="username">
                    USERNAME
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="yourname"
                    autocomplete="username"
                    maxlength="20"
                    minlength="3"
                    spellcheck="false"
                    required
                >

                <div class="hint">
                    3–20 characters · letters, numbers and _
                </div>

            </div>


            <div class="field">

                <label for="displayName">
                    DISPLAY NAME
                </label>

                <input
                    id="displayName"
                    type="text"
                    placeholder="Your name"
                    maxlength="30"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="field">

                <label for="email">
                    EMAIL
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="At least 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                id="registerButton"
                type="submit"
            >
                CREATE ACCOUNT
            </button>


            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>


        </form>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <div class="brand">
            YOUR IDENTITY. YOUR VOID.
        </div>


    </main>


    <!-- SUPABASE LIBRARY -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- YOUR SUPABASE CONFIG -->

    <script src="supabase.js"></script>


    <!-- REGISTER SCRIPT -->

    <script>

        const form =
            document.getElementById(
                "registerForm"
            );

        const button =
            document.getElementById(
                "registerButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type = ""
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        function resetButton() {

            button.disabled =
                false;

            button.textContent =
                "CREATE ACCOUNT";

        }


        form.addEventListener(
            "submit",
            async function(event) {

                /*
                IMPORTANT:
                Prevent normal HTML form reload.
                */

                event.preventDefault();

                event.stopPropagation();


                const username =
                    document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim()
                        .toLowerCase();


                const displayName =
                    document
                        .getElementById(
                            "displayName"
                        )
                        .value
                        .trim();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                /*
                VALIDATION
                */

                if (
                    username.length < 3 ||
                    username.length > 20
                ) {

                    showMessage(
                        "El username debe tener entre 3 y 20 caracteres.",
                        "error"
                    );

                    return;

                }


                if (
                    !/^[a-z0-9_]+$/.test(
                        username
                    )
                ) {

                    showMessage(
                        "Usa solamente letras, números y _.",
                        "error"
                    );

                    return;

                }


                if (
                    !displayName
                ) {

                    showMessage(
                        "Escribe un display name.",
                        "error"
                    );

                    return;

                }


                if (
                    password.length < 6
                ) {

                    showMessage(
                        "La contraseña debe tener al menos 6 caracteres.",
                        "error"
                    );

                    return;

                }


                button.disabled =
                    true;

                button.textContent =
                    "CREATING...";

                showMessage("");


                try {


                    /*
                    CHECK SUPABASE
                    */

                    if (
                        typeof supabaseClient ===
                        "undefined"
                    ) {

                        throw new Error(
                            "Supabase no está cargando. Revisa supabase.js."
                        );

                    }


                    /*
                    CHECK USERNAME
                    */

                    const {
                        data:
                            existingProfile,
                        error:
                            usernameError
                    } =
                        await supabaseClient
                            .from("profiles")
                            .select("id")
                            .eq(
                                "username",
                                username
                            )
                            .maybeSingle();


                    if (
                        usernameError
                    ) {

                        throw usernameError;

                    }


                    if (
                        existingProfile
                    ) {

                        showMessage(
                            "Ese username ya está ocupado.",
                            "error"
                        );

                        resetButton();

                        return;

                    }


                    /*
                    CREATE AUTH USER
                    */

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signUp({

                                email:
                                    email,

                                password:
                                    password,

                                options: {

                                    data: {

                                        username:
                                            username,

                                        display_name:
                                            displayName

                                    }

                                }

                            });


                    if (
                        error
                    ) {

                        throw error;

                    }


                    if (
                        !data ||
                        !data.user
                    ) {

                        throw new Error(
                            "Supabase no devolvió el usuario."
                        );

                    }


                    /*
                    THE DATABASE TRIGGER
                    CREATES THE PROFILE.

                    We DO NOT insert into
                    profiles here.
                    */


                    if (
                        data.session
                    ) {

                        showMessage(
                            "Cuenta creada. Entrando...",
                            "success"
                        );

                        button.textContent =
                            "ACCOUNT CREATED";


                        setTimeout(
                            function() {

                                window.location.href =
                                    "dashboard.html";

                            },
                            1000
                        );


                    } else {

                        showMessage(
                            "Cuenta creada. Revisa tu correo para confirmar tu cuenta.",
                            "success"
                        );

                        button.textContent =
                            "CHECK YOUR EMAIL";

                    }


                } catch(error) {


                    console.error(
                        "NØX:",
                        error
                    );


                    let text =
                        error.message ||
                        "No se pudo crear la cuenta.";


                    if (
                        text
                            .toLowerCase()
                            .includes(
                                "user already registered"
                            )
                    ) {

                        text =
                            "Ese email ya está registrado.";

                    }


                    if (
                        text
                            .toLowerCase()
                            .includes(
                                "row-level security"
                            )
                    ) {

                        text =
                            "Supabase bloqueó el perfil. Revisa las policies de profiles.";

                    }


                    showMessage(
                        text,
                        "error"
                    );


                    resetButton();

                }

            }
        );

    </script>


</body>

    </html>
