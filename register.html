<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>NØX — Create your identity</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --bg: #030303;

            --card: rgba(13, 13, 13, .76);

            --border:
                rgba(255, 255, 255, .08);

            --border-hover:
                rgba(255, 255, 255, .18);

            --text: #ffffff;

            --muted: #666;

            --muted-light: #888;

        }


        html,
        body {

            min-height: 100%;

        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

            background: var(--bg);

            color: var(--text);

            font-family:
                "Inter",
                Arial,
                sans-serif;

            overflow-x: hidden;

        }


        /* ========================================
           BACKGROUND
        ======================================== */


        .background {

            position: fixed;

            inset: 0;

            z-index: -5;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,.065),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 10% 90%,
                    rgba(255,255,255,.025),
                    transparent 30%
                ),

                #030303;

        }


        .grid {

            position: fixed;

            inset: 0;

            z-index: -4;

            opacity: .45;

            background-image:

                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black 0%,
                    transparent 85%
                );

        }


        .glow {

            position: fixed;

            width: 500px;

            height: 500px;

            top: -350px;

            left: 50%;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background: #fff;

            filter: blur(170px);

            opacity: .06;

            pointer-events: none;

            z-index: -3;

        }


        /* ========================================
           NOISE
        ======================================== */


        .noise {

            position: fixed;

            inset: -50%;

            z-index: -2;

            pointer-events: none;

            opacity: .018;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");

            animation: noise .2s infinite;

        }


        @keyframes noise {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(2%, 1%);
            }

            50% {
                transform: translate(-1%, 2%);
            }

            75% {
                transform: translate(1%, -2%);
            }

            100% {
                transform: translate(0, 0);
            }

        }


        /* ========================================
           BACK BUTTON
        ======================================== */


        .back {

            position: fixed;

            top: 25px;

            left: 25px;

            display: inline-flex;

            align-items: center;

            gap: 7px;

            color: #555;

            text-decoration: none;

            font-size: 11px;

            font-weight: 600;

            transition: .25s;

        }


        .back:hover {

            color: #fff;

            transform:
                translateX(-2px);

        }


        /* ========================================
           CARD
        ======================================== */


        .register-card {

            position: relative;

            width:
                min(440px, 100%);

            padding:
                42px 36px 34px;

            border:
                1px solid var(--border);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.012)
                );

            backdrop-filter:
                blur(30px);

            -webkit-backdrop-filter:
                blur(30px);

            box-shadow:
                0 45px 120px
                rgba(0,0,0,.72);

            animation:
                appear .7s ease both;

        }


        .register-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 12%;

            right: 12%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

            opacity: .5;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* ========================================
           LOGO
        ======================================== */


        .logo {

            text-align: center;

            font-size: 31px;

            line-height: 1;

            font-weight: 900;

            letter-spacing: -2.5px;

        }


        .subtitle {

            margin-top: 9px;

            text-align: center;

            color: var(--muted);

            font-size: 11px;

            line-height: 1.5;

        }


        .line {

            width: 45px;

            height: 1px;

            margin:
                23px auto 0;

            background:
                rgba(255,255,255,.2);

        }


        /* ========================================
           FORM
        ======================================== */


        form {

            margin-top: 30px;

        }


        .field {

            margin-bottom: 16px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #777;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }


        input {

            width: 100%;

            height: 49px;

            padding:
                0 14px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 10px;

            background:
                rgba(0,0,0,.35);

            color: #fff;

            font-family: inherit;

            font-size: 12px;

            transition:
                .25s;

        }


        input:hover {

            border-color:
                rgba(255,255,255,.13);

        }


        input:focus {

            border-color:
                rgba(255,255,255,.28);

            background:
                rgba(255,255,255,.025);

            box-shadow:
                0 0 0 3px
                rgba(255,255,255,.025);

        }


        input::placeholder {

            color: #393939;

        }


        /* ========================================
           USERNAME HINT
        ======================================== */


        .hint {

            margin-top: 7px;

            color: #3e3e3e;

            font-size: 8px;

        }


        /* ========================================
           BUTTON
        ======================================== */


        button {

            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: 0;

            border-radius: 10px;

            background: #fff;

            color: #000;

            font-family: inherit;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: .5px;

            cursor: pointer;

            transition:
                transform .25s,
                box-shadow .25s,
                opacity .25s;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 18px 45px
                rgba(255,255,255,.12);

        }


        button:active {

            transform:
                translateY(0);

        }


        button:disabled {

            opacity: .45;

            cursor: wait;

            transform: none;

            box-shadow: none;

        }


        /* ========================================
           MESSAGE
        ======================================== */


        .message {

            min-height: 18px;

            margin-top: 15px;

            text-align: center;

            font-size: 10px;

            line-height: 1.5;

        }


        .message.error {

            color: #ff6b6b;

        }


        .message.success {

            color: #aaa;

        }


        /* ========================================
           LOGIN
        ======================================== */


        .login {

            margin-top: 23px;

            text-align: center;

            color: #4d4d4d;

            font-size: 10px;

        }


        .login a {

            color: #fff;

            text-decoration: none;

            font-weight: 600;

        }


        .login a:hover {

            text-decoration: underline;

        }


        /* ========================================
           BRAND
        ======================================== */


        .brand {

            margin-top: 27px;

            text-align: center;

            color: #292929;

            font-size: 8px;

            font-weight: 700;

            letter-spacing: 3px;

        }


        /* ========================================
           MOBILE
        ======================================== */


        @media(max-width:500px) {

            body {

                padding:
                    20px 15px;

            }


            .register-card {

                padding:
                    34px 22px 30px;

                border-radius:
                    18px;

            }


            .back {

                top: 18px;

                left: 18px;

            }


            .logo {

                font-size: 29px;

            }

        }

    </style>

</head>


<body>


    <div class="background"></div>

    <div class="grid"></div>

    <div class="glow"></div>

    <div class="noise"></div>


    <!-- BACK -->

    <a
        href="index.html"
        class="back"
    >
        ← NØX
    </a>


    <!-- REGISTER -->

    <main class="register-card">


        <div class="logo">
            NØX
        </div>


        <div class="subtitle">
            Create your identity.
        </div>


        <div class="line"></div>


        <form id="registerForm">


            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    USERNAME
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="yourname"
                    autocomplete="username"
                    maxlength="20"
                    minlength="3"
                    spellcheck="false"
                    required
                >

                <div class="hint">
                    3–20 characters · letters, numbers and _
                </div>

            </div>


            <!-- DISPLAY NAME -->

            <div class="field">

                <label for="displayName">
                    DISPLAY NAME
                </label>

                <input
                    id="displayName"
                    type="text"
                    placeholder="Your name"
                    maxlength="30"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    EMAIL
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="At least 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button
                id="registerButton"
                type="submit"
            >
                CREATE ACCOUNT
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>


        </form>


        <!-- LOGIN -->

        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <div class="brand">
            YOUR IDENTITY. YOUR VOID.
        </div>


    </main>


    <!-- ========================================
         SUPABASE
    ========================================= -->


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

         REGISTER LOGIC

                ================================
                */

                ) {

                    showMessage(

                    );

                    return;

                }

                ) {

                    showMessage(
                        "La contraseña debe tener al menos 6 caracteres.",
                        "error"
                    );

                    return;

                }
