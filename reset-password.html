<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NØX — New password</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: #030303;

            color: white;

            font-family: Inter, sans-serif;

        }

        .card {

            width: min(420px, 100%);

            padding: 40px 32px;

            border: 1px solid
                rgba(255,255,255,.09);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.01)
                );

            backdrop-filter: blur(25px);

            box-shadow:
                0 40px 100px
                rgba(0,0,0,.7);

        }

        .logo {

            text-align: center;

            font-size: 31px;

            font-weight: 900;

            letter-spacing: -2px;

        }

        .subtitle {

            margin-top: 8px;

            text-align: center;

            color: #666;

            font-size: 11px;

        }

        form {

            margin-top: 32px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #777;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;

        }

        input {

            width: 100%;

            height: 50px;

            padding: 0 14px;

            margin-bottom: 18px;

            border: 1px solid
                rgba(255,255,255,.08);

            border-radius: 10px;

            outline: none;

            background: #080808;

            color: white;

            font-family: inherit;

        }

        input:focus {

            border-color:
                rgba(255,255,255,.3);

        }

        button {

            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 10px;

            background: white;

            color: black;

            font-family: inherit;

            font-size: 10px;

            font-weight: 900;

            cursor: pointer;

        }

        button:disabled {

            opacity: .5;

            cursor: wait;

        }

        .message {

            min-height: 20px;

            margin-top: 17px;

            text-align: center;

            font-size: 10px;

        }

        .error {

            color: #ff6b6b;

        }

        .success {

            color: #aaa;

        }

    </style>

</head>

<body>

    <main class="card">

        <div class="logo">
            NØX
        </div>

        <div class="subtitle">
            Create a new password.
        </div>


        <form id="resetForm">

            <label for="password">
                NEW PASSWORD
            </label>

            <input
                id="password"
                type="password"
                minlength="6"
                placeholder="New password"
                autocomplete="new-password"
                required
            >


            <label for="confirmPassword">
                CONFIRM PASSWORD
            </label>

            <input
                id="confirmPassword"
                type="password"
                minlength="6"
                placeholder="Repeat password"
                autocomplete="new-password"
                required
            >


            <button
                id="button"
                type="submit"
            >
                CHANGE PASSWORD
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        const form =
            document.getElementById(
                "resetForm"
            );

        const button =
            document.getElementById(
                "button"
            );

        const message =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type = ""
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        /*
        Supabase detectará automáticamente
        la sesión creada por el enlace
        de recuperación.
        */

        async function checkSession() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (error) {

                showMessage(
                    error.message,
                    "error"
                );

                return false;

            }


            if (!data.session) {

                showMessage(
                    "El enlace de recuperación no es válido o ha expirado.",
                    "error"
                );

                return false;

            }


            return true;

        }


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                const confirmPassword =
                    document
                        .getElementById(
                            "confirmPassword"
                        )
                        .value;


                if (
                    password.length < 6
                ) {

                    showMessage(
                        "La contraseña debe tener al menos 6 caracteres.",
                        "error"
                    );

                    return;

                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Las contraseñas no coinciden.",
                        "error"
                    );

                    return;

                }


                button.disabled =
                    true;

                button.textContent =
                    "UPDATING...";


                try {


                    const valid =
                        await checkSession();


                    if (!valid) {

                        button.disabled =
                            false;

                        button.textContent =
                            "CHANGE PASSWORD";

                        return;

                    }


                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .updateUser({

                                password:
                                    password

                            });


                    if (error) {

                        throw error;

                    }


                    showMessage(
                        "Contraseña actualizada correctamente.",
                        "success"
                    );


                    button.textContent =
                        "PASSWORD UPDATED";


                    await supabaseClient
                        .auth
                        .signOut();


                    setTimeout(
                        function() {

                            window.location.href =
                                "login.html";

                        },
                        1200
                    );


                } catch(error) {

                    console.error(
                        "NØX Password Reset:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "No se pudo cambiar la contraseña.",
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "CHANGE PASSWORD";

                }

            }
        );

    </script>

</body>

</html>
